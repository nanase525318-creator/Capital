const Geo={   /* 架空国家も含めた地政学 */
  st(){if(!S.geo)S.geo={ten:{},wars:[],hist:[],infl:0};return S.geo;},
  pairs:[['us','cn'],['cn','tw'],['de','cn'],['in','cn'],['us','ae'],['br','mx'],['gb','de'],['kr','cn'],['nor','eas'],['arc','eas'],['gra','sou'],['val','nor'],['arc','gra'],['eas','sou']],
  key(p){return p[0]+'-'+p[1];},
  monthly(){const G=this.st(),E=S.econ;
    for(const p of this.pairs){const k=this.key(p);let t=G.ten[k]??ri(5,25);
      const A=S.gl?S.gl.cty[p[0]]:null,B=S.gl?S.gl.cty[p[1]]:null;
      t+=gauss()*4+((A&&A.g<0)||(B&&B.g<0)?1.5:0)-1.2;t=clamp(t,0,100);G.ten[k]=t;
      const war=G.wars.find(w=>w.k===k);
      if(!war&&t>78&&R()<.1){G.wars.push({k,p,m:S.month,dur:ri(6,30)});
        News.add('世界経済',`⚠️ ${CTY[p[0]].n}と${CTY[p[1]].n}が武力衝突に発展`,'物流と資源の流れが止まり、世界経済に大きな影響が出る見込み。',null,-1,{lv:2,imp:['資源・エネルギー価格が上昇します','半導体・物流に混乱が広がります','防衛・エネルギー・資源関連には追い風','復興需要は数年後に生まれます']});
        chron(`${CTY[p[0]].n}と${CTY[p[1]].n}の衝突が発生`,'世界');}
      else if(!war&&t>60&&R()<.06)News.add('世界経済',`${CTY[p[0]].n}と${CTY[p[1]].n}の緊張が高まる`,'貿易制限や関税引き上げの観測が出ている。',null,-1,{lv:1,imp:['関税や輸出規制が起こりやすくなります']});}
    for(const w of G.wars.slice()){const C=[CTY[w.p[0]],CTY[w.p[1]]];
      E.commod=clamp(E.commod*1.03,.5,3);E.oil=(E.oil||80)*1.04;E.sent=clamp(E.sent-.03,-1,1);
      for(const k2 of ['energy','material','semi','mfg','logi','auto'])E.trend[k2]=clamp((E.trend[k2]||1)*(k2==='energy'||k2==='material'?1.02:.985),.5,2);
      if(S.gl){for(const c2 of w.p){S.gl.cty[c2].unrest=Math.min(1,(S.gl.cty[c2].unrest||0)+.25);S.gl.cty[c2].g-=.4;}}
      if(S.month-w.m>=w.dur){G.wars=G.wars.filter(x=>x!==w);G.ten[w.k]=25;
        News.add('世界経済',`${C[0].n}と${C[1].n}が停戦に合意`,'復興需要が生まれ、建設・インフラ・物流に追い風となる。',null,1,{lv:2,imp:['資源価格は落ち着きます','建設・素材・物流に復興需要','進出企業には再投資の好機']});
        for(const k2 of ['mfg','logi','material','re'])E.trend[k2]=clamp((E.trend[k2]||1)*1.08,.5,2);chron(`${C[0].n}と${C[1].n}が停戦`,'世界');}}
    if(R()<.05){const k=pick(Object.keys(CTY)),C=CTY[k],G2=S.gl?S.gl.cty[k]:null;const kind=pick(['election','tax','nation','open','sanction']);
      if(kind==='election'){if(G2)G2.g+=rn(-.6,.8);News.add('世界経済',`${C.fl}${C.n}で政権交代`,'経済政策の変更が見込まれる。',null,0,{lv:1});}
      if(kind==='tax'&&G2){C.tax=clamp(C.tax+rn(-.04,.05),.05,.45);News.add('世界経済',`${C.fl}${C.n}が法人税率を変更（${pctp(C.tax,0)}）`,'進出企業の税負担が変わる。',null,C.tax<.25?1:-1,{lv:1});}
      if(kind==='nation'&&G2&&S.gl&&S.gl.ops[k]){const o=S.gl.ops[k],loss=Math.round(o.fixed*.5);o.fixed-=loss;S.flows.extraLoss+=loss;
        News.add('速報',`${C.fl}${C.n}で外資規制が強化。現地資産の一部が接収`,`${yen(loss)}円を特別損失に計上。`,null,-1,{lv:2,imp:['政情リスクの高い国は合弁が安全です']});}
      if(kind==='open'&&G2){G2.rg=Math.max(.1,G2.rg-.1);News.add('世界経済',`${C.fl}${C.n}が規制緩和、外資に門戸`,'進出のチャンスが広がる。',null,1,{lv:1});}
      if(kind==='sanction'&&G2){G2.tariff=Math.min(.4,G2.tariff+.06);News.add('世界経済',`${C.fl}${C.n}に経済制裁。関税が引き上げ`,'輸出企業には逆風。',null,-1,{lv:1});}}
    G.infl=Influence.score();},
  wars(){return this.st().wars;}
};
/* 世界影響力（0〜1000）：資産・企業・技術・金融・情報・インフラ・海外・スポーツなどから算出 */
const INFT=[[0,'地方企業'],[60,'国内企業'],[140,'全国企業'],[250,'国際企業'],[380,'世界企業'],[520,'グローバル企業グループ'],[680,'世界経済の主要プレイヤー'],[850,'世界最大級の企業帝国']];
const Influence={
  parts(){const C=Co.cons(),H=Syn.have(),M=Me.st(),mnet=Me.net();
    const f=(v,d)=>clamp(Math.log10(Math.max(1,v/d))*40,0,160);
    return{資産:f(C.assets,1e10),売上:f(C.rev,1e10),個人資産:f(mnet,1e9)*.6,
      海外:clamp((S.gl?Global.n():0)*8,0,120),株式:clamp(Object.keys(S.hold||{}).length*3+Object.keys(M.hold||{}).length*2,0,90),
      技術:clamp(['semi','aiB','cloud','space','pharma'].filter(k=>H.has(k)).length*22,0,110),
      金融:clamp((H.has('finB')?45:0)+((S.vc&&VC.port().length)?20:0)+((S.nation&&S.nation.jgb)?25:0),0,90),
      情報:clamp((H.has('media')?30:0)+(H.has('ad')?15:0)+(H.has('gameB')?15:0)+((S.ip||[]).length*3),0,90),
      インフラ:clamp(['energyB','telecom','logi','mining','city'].filter(k=>H.has(k)).length*20,0,100),
      スポーツ:clamp((S.sp&&S.sp.team)?25+(S.sp.team.champs||0)*8:0,0,60),
      国家:clamp((S.nation&&S.nation.hist?S.nation.hist.length*18:0),0,90)};},
  score(){const p=this.parts();return Math.round(clamp(sum(Object.values(p),v=>v),0,1000));},
  tier(){const v=this.score();let n=INFT[0][1];for(const t of INFT)if(v>=t[0])n=t[1];return n;}
};

/* =====================================================================
   MODULE: Nation — 国家規模・世界規模のプロジェクト（超巨大企業向け）
   ===================================================================== */
const Nation={
  st(){if(!S.nation)S.nation={done:[],jgb:0,infl:0,proj:[],hist:[]};return S.nation;},
  // 世界経済への影響力（架空の指標）。売上・資産・雇用・海外・保有インフラから計算
  influence(){const C=Co.cons(),G=S.gl?Global.n():0,H=Syn.have();
    const infra=['energyB','telecom','logi','finB','mining','semi','cloud'].filter(k=>H.has(k)).length;
    const v=Math.log10(Math.max(1,C.rev/1e11))*6+Math.log10(Math.max(1,C.assets/1e12))*5+Math.log10(Math.max(1,C.emp/1e4))*3+G*.5+infra*1.6;
    return clamp(v,0,60);},
  tier(){const i=this.influence();return i>=35?4:i>=22?3:i>=12?2:i>=5?1:0;},
  tierN:['国内企業','多国籍企業','グローバル企業','世界的企業','世界最大級の経済圏'],
  debt(){const E=S.econ;return 1100e12*(E.pIdx||1)*(1-(this.st().paid||0));},   /* 国の債務（架空） */
  // 国家・世界規模の議題
  agendas(){const A=[],N=this.st(),C=Co.cons(),cash=S.co.cash,t=this.tier();
    if(t>=1&&cash>2e12&&!N.done.includes('jgb'+S.y))A.push({k:'natJGB',pri:20,ttl:'国債の大量購入による国家財政への協力',amount:Math.round(cash*.2),note:`余剰資金${yen(cash)}円の一部を国債で運用し、財政を支える`,nat:'jgb'});
    if(t>=2&&cash>1e13)A.push({k:'natInfra',pri:65,ttl:'国家インフラ計画への参画（高速鉄道・空港・港湾）',amount:Math.round(cash*.25),note:'グループ各社を総動員して社会基盤を整備する',nat:'infra'});
    if(t>=3&&cash>this.debt()*.08)A.push({k:'natDebt',pri:95,ttl:'国家債務の返済支援',amount:Math.round(this.debt()*.1),note:`国の債務は${yen(this.debt())}円。企業として前例のない規模の支援になる`,nat:'debt'});
    if(t>=4&&cash>5e13)A.push({k:'natWorld',pri:98,ttl:'世界復興基金の設立',amount:Math.round(cash*.3),note:'世界規模の危機に対し、自社グループで基金を設立する',nat:'world'});
    return A;},
  // 実行（社長決裁の結果として呼ばれる）
  run(kind,amount){const N=this.st(),E=S.econ,C=Co.cons();if(S.co.cash<amount)return '現金が不足しています';
    S.co.cash-=amount;N.hist.unshift({y:S.y,m:S.m,kind,amount});
    if(kind==='jgb'){N.jgb+=amount;S.flows.buy+=amount;E.rate=Math.max(0,E.rate-.1);S.co.credit=Math.min(100,S.co.credit+3);
      News.add('速報',`${pName()}、国債${yen(amount)}円を購入。財政の下支えに`,'長期金利の低下要因となり、政府は歓迎の意向を示した。',null,1,{lv:2,imp:['受取利息として毎月の収益になります','政策金利の低下は借入コストの低下にもつながります']});}
    if(kind==='infra'){S.flows.capex+=amount;S.co.mfixed=(S.co.mfixed||0)+amount*.7;S.flows.extraLoss+=amount*.3;E.gdp=Math.min(6,E.gdp+.6);E.sent=Math.min(1,E.sent+.15);S.co.maxBrand=Math.min(100,S.co.maxBrand+5);
      for(const b of S.biz)b.brand=Math.min(100,b.brand+6);
      News.add('速報',`${pName()}、国家インフラ計画に${yen(amount)}円を投資`,'高速鉄道・空港・港湾の整備をグループ各社で担う。',null,1,{lv:2,imp:['国内景気の押し上げ要因','グループのブランド力が向上','投資の7割は資産として計上']});
      Disc.add('ME','事業','国家インフラ計画への参画に関するお知らせ',{sum:`総額${yen(amount)}円を投じ、社会基盤の整備に参画します。`,sec:[['目的','国内経済の基盤強化とグループの中長期的な成長のため。'],['業績への影響','投資の大半は固定資産に計上し、長期にわたり収益を生みます。']]});}
    if(kind==='debt'){S.flows.extraLoss+=amount;N.paid=(N.paid||0)+amount/this.debt()*.1;E.rate=Math.max(0,E.rate-.4);E.gdp=Math.min(6,E.gdp+1);E.sent=Math.min(1,E.sent+.25);S.co.credit=100;
      for(const b of S.biz)b.brand=Math.min(100,b.brand+10);
      News.add('速報',`🚨 ${pName()}、国家債務返済支援を表明。${yen(amount)}円を拠出`,'前例のない規模の企業による財政支援として世界が注目している。',null,1,{lv:2,imp:['国の金利低下と景気改善が見込まれます','国内事業の需要にも波及します','株主からは本業への投資を求める声も']});
      Disc.add('ME','その他','国家債務返済支援に関するお知らせ',{sum:`${yen(amount)}円を拠出し、国家債務の返済を支援します。`,sec:[['目的','経済基盤の安定は当社グループの長期的な成長に資すると判断しました。'],['株主への影響','当期の現金は大きく減少しますが、金利低下と景気改善による恩恵を見込みます。']]});
      if(R()<.5)setTimeout(()=>{},0);
      if(S.eq.listed)S.eq.jump+=R()<.5?.08:-.08;   /* 市場の評価は割れる */
      if(R()<.45)News.add('経済','一企業の影響力拡大に懸念の声','政治との距離感を問題視する報道も出ている。',null,-1,{lv:1,imp:['政治的リスクとして株価の重しになることがあります']});}
    if(kind==='world'){S.flows.extraLoss+=amount*.5;S.co.mfixed=(S.co.mfixed||0)+amount*.5;E.sent=Math.min(1,E.sent+.3);if(S.gl)for(const k in S.gl.cty)S.gl.cty[k].g+=.6;
      for(const b of S.biz)b.brand=Math.min(100,b.brand+12);
      News.add('速報',`🌍 ${pName()}、世界復興基金を${yen(amount)}円で設立`,'世界規模の危機に対し、一企業として史上最大の支援を表明した。',null,1,{lv:2,imp:['世界各国の成長率が改善します','グローバルブランドが大きく向上します','半額は費用として計上されます']});}
    Store.auto(true);return null;},
  monthly(){const N=this.st();if(N.jgb>0){const it=N.jgb*(S.econ.rate+.3)/1200;S.co.cash+=it;S.flows.div+=it;}   /* 国債の利息 */
    N.infl=this.influence();}
};

/* =====================================================================
   MODULE: Stage — 企業の成長ステージと経営者の肩書き
   ===================================================================== */
const STG=[{n:'創業・小規模企業',t:'創業社長',e:0},{n:'成長企業',t:'成長企業のCEO',e:20},{n:'中堅企業',t:'中堅企業のCEO',e:200},{n:'大企業',t:'大企業のCEO',e:2000},{n:'巨大企業グループ',t:'企業グループCEO',e:20000}];
const Stage={
  of(){const C=Co.cons(),e=C.emp,g=MA.subs().length+MA.grand().length;let i=0;for(let k=0;k<STG.length;k++)if(e>=STG[k].e)i=k;if(i===4&&g<3)i=3;if(i<4&&e>=STG[4].e*0&&g>=5&&e>=5000)i=4;
    const nx=STG[i+1],p=nx?clamp(Math.log(Math.max(1,e)/Math.max(1,STG[i].e||1))/Math.log(nx.e/Math.max(1,STG[i].e||1)),0,1):1;
    return{i,n:i+1,name:STG[i].n,title:i===4&&g>=10?'巨大企業グループの総帥':STG[i].t,next:nx,p,need:nx?(i===3?`従業員${nf(nx.e)}人・グループ会社3社`:`従業員${nf(nx.e)}人`):''};}
};
/* =====================================================================
   MODULE: FX — イベント連動の演出（採用・売買・M&A・決算・節目・市場OPEN）

const FX={q:[],busy:false,tm:0,lastOpen:0,
  root(){let r=document.getElementById('fx');if(!r){r=document.createElement('div');r.id='fx';document.body.appendChild(r);}return r;},
  push(o){this.q.push(o);if(!this.busy)this.next();},
  next(){const o=this.q.shift();const r=this.root();if(!o){this.busy=false;r.innerHTML='';return;}this.busy=true;
    r.innerHTML=`<div class="fxbg" data-act="fxX"></div><div class="fxc" data-act="fxX">${o.html}</div>`;tweens();if(o.run)o.run(r);
    clearTimeout(this.tm);this.tm=setTimeout(()=>this.close(),o.ms||3200);},
  close(){const c=document.querySelector('#fx .fxc');if(c&&!c.classList.contains('out')){c.classList.add('out');setTimeout(()=>this.next(),230);}else if(!c)this.next();},
  // 数字を前の値から新しい値へ動かす行
  row(label,a,b,f=yen,u='円'){const up=b>=a;return `<div class="fxr"><span>${label}</span><em>${f(a)}${u}</em>→ <b class="${b===a?'':up?'value-up':'value-down'}" data-n0="${a}" data-n1="${b}" data-f="${f===yen?'yen':'nf'}">${f(a)}</b>${u}</div>`;},
  count(r){for(const el of r.querySelectorAll('[data-n0]')){const a=+el.dataset.n0,b=+el.dataset.n1,f=FMT[el.dataset.f],t0=performance.now()+350,D=RM?1:900;
      const st=now=>{const k=clamp((now-t0)/D,0,1),e=1-Math.pow(1-k,3);el.textContent=f(a+(b-a)*e);if(k<1)requestAnimationFrame(st);else el.classList.add('number-pop');};requestAnimationFrame(st);}},
  hire(b,n,before){const t=BT[b.type],sal=Biz.sal(b),cap=x=>t.prod*x*(1+.15*b.equip),A=before,Bn=b.staff;
    this.push({ms:4200,html:`<div class="fxh">RECRUITING</div><div class="fxt">${esc(BT[b.type].n)}事業で${nf(n)}人を採用</div>
      <div class="steps2">${['採用活動','内定','入社'].map((x,i)=>`<div data-s="${i}"><i>${i+1}</i>${x}</div>`).join('')}</div>
      ${this.row('従業員',A,Bn,nf,'人')}${this.row('人件費／月',A*sal,Bn*sal)}${this.row('生産能力（人・件／月）',cap(A),cap(Bn),nf,'')}${this.row('売上の上限／月',cap(A)*b.price,cap(Bn)*b.price)}
      <p class="note" style="margin-bottom:0">入社した社員は職場ビジュアルにも加わります。採用費として給与の半月分がかかります。</p>`,
      run:r=>{const S2=r.querySelectorAll('.steps2 div');S2.forEach((d,i)=>setTimeout(()=>d.classList.add('on'),RM?0:200+i*420));setTimeout(()=>this.count(r),RM?0:1300);}});},
  trade(side,a,q,px,total){const buy=side==='buy';
    this.push({ms:2800,html:`<div class="fxh">${buy?'ORDER FILLED':'SOLD'}</div><div class="fxt">${buy?'購入完了':'売却完了'}　${esc(a.name)}</div>
      <div class="fxr"><span>数量</span><b>${nf(q)}${a.fund?'口':'株'}</b></div><div class="fxr"><span>約定単価</span><b>@${nf(px,px<100?2:0)}円</b></div><div class="fxr"><span>${buy?'投資額':'受取額'}</span><b>${yen(total)}円</b></div>
      <div class="flow"><span class="bx">${buy?'💴 現金':'📈 株式'}</span><span class="ln"><i></i></span><span class="bx">${buy?'📈 株式':'💴 現金'}</span></div>`});},
  deal(o){const d=(k,f,u)=>this.row(k,o.b[k2[k]],o.a[k2[k]],f,u),k2={'売上高（年換算）':'rev','営業利益':'op','従業員':'emp','総資産':'assets','有利子負債':'debt','グループ会社':'n'};
    this.push({ms:5200,html:`<div class="fxh">M&amp;A COMPLETED</div><div class="fxt">${esc(o.target)}を${o.pct>=.999?'完全子会社化':'子会社化'}</div>
      <div class="deal"><div class="co">${esc(o.buyer)}</div><div class="lk"></div><div class="co company-grow" style="animation-delay:.6s">${esc(o.target)}<br><span class="mut3" style="font-weight:400">${pctp(o.pct,0)}取得</span></div></div>
      ${d('売上高（年換算）')}${d('営業利益')}${d('従業員',nf,'人')}${d('総資産')}${d('有利子負債')}${d('グループ会社',nf,'社')}
      ${o.share!=null?`<div class="fxr"><span>対象の市場シェア</span><b>${pctp(o.share,1)}</b></div>`:''}`,run:r=>this.count(r)});},
  ms(v,st){this.push({ms:4200,html:`<div class="ms"><div class="fxh">MILESTONE</div><div class="mut" style="font-size:13px;margin-top:6px">グループ総資産</div><div class="big company-grow">${yen(v)}円</div><div style="font-size:15px;font-weight:700">突破</div>
      <p class="mut" style="font-size:12.5px;margin-bottom:0">${esc(pName())}・${st.name}<br>${esc(S.player.ceo)}さんは「${st.title}」になりました</p></div>`});},
  open(){if(!S||RM||Date.now()-this.lastOpen<20000)return;this.lastOpen=Date.now();const d=document.createElement('div');d.className='mopen market-open';
    const h=S.mkt.hist,pv=h.length>1?h[h.length-2]:S.mkt.idx,x=S.mkt.idx/pv-1;d.innerHTML=`<b>09:00</b>🇯🇵 東京市場 OPEN<span class="${tone(x)}">日経平均 ${nf(S.mkt.idx)} ${x>=0?'▲':'▼'}${pct(x)}</span>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1900);},

/* =====================================================================
   MODULE: Store — セーブ（localStorage。adapterを差し替えればサーバー保存へ移行可）
   ===================================================================== */
const Store={
  err:null,ok2:null,lastSize:0,lastAt:0,lastSlot:null,lastErrName:'',
  adapter:{get:k=>{try{return localStorage.getItem(k);}catch(e){Store.err=e;return null;}},
    set:(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){Store.err=e;Store.lastErrName=e&&e.name||'Error';console.error('[CAPITAL SAVE ERROR]',e&&e.name,e&&e.message);return false;}},
    del:k=>{try{localStorage.removeItem(k);}catch(e){console.error('[CAPITAL DELETE ERROR]',e);}}},
  slots:['auto','1','2','3'],
  key:s=>'capital.v1.'+s,
  // 保存が使える環境かを確かめる（プライベートブラウジングや設定で使えないことがある）
  check(){if(this.ok2!=null)return this.ok2;
    try{const k='capital.storage.test',v='ok'+Date.now();localStorage.setItem(k,v);const r=localStorage.getItem(k)===v;localStorage.removeItem(k);this.ok2=r;if(!r)this.lastErrName='ReadBackFailed';}
    catch(e){this.ok2=false;this.err=e;this.lastErrName=e&&e.name||'Error';console.error('[CAPITAL STORAGE UNAVAILABLE]',e&&e.name,e&&e.message);}
    return this.ok2;},
  // 保存用のJSON。小数を丸め、再現できるデータは間引いて容量を抑える
  pack(o){const rep2=(k,v)=>{if(typeof v==='number'){if(!isFinite(v))return 0;const x=Math.abs(v);return x>=1e4?Math.round(v):x>=100?Math.round(v*10)/10:Number(v.toPrecision(5));}return v;};
    return JSON.stringify(o,rep2);},
  // 保存用のデータ。実データは変えず、保有していない会社の古いチャートなどをコピー上で間引く
  slim(){const o={...S};o.news=(S.news||[]).slice(0,250);o.disc=(S.disc||[]).slice(0,250);
    if(S.board)o.board={...S.board,hist:(S.board.hist||[]).slice(0,40)};
    o.cos=(S.cos||[]).map(c=>{const mine=(S.hold&&S.hold[c.t])||c.merged||c.par||(S.tob&&S.tob.t===c.t);if(mine)return c;
      const n=60,d={...c};if(c.hist&&c.hist.length>n){d.hist=c.hist.slice(-n);if(c.oh)d.oh=c.oh.slice(-n);if(c.vh)d.vh=c.vh.slice(-n);}
      if(c.qr&&c.qr.length)d.qr=c.qr.slice(-4).map(r=>{const q={...r};delete q.seg;return q;});return d;});
    return o;},
  trim(){},
  // 保存：JSON化 → 書き込み → 読み返して一致を確認、の順に検証する
  save(slot){if(!S)return false;this.err=null;this.lastErrName='';
    if(!this.check()){this.lastErrName='Unavailable';return false;}
    S.rng=RNG.s;S.savedAt=Date.now();this.trim();
    let json;try{json=this.pack(this.slim());}catch(e){this.lastErrName='JSON';console.error('[CAPITAL SAVE ERROR] JSON',e);return false;}
    const kb=Math.round(json.length/1024);console.log(`[CAPITAL SAVE] slot=${slot} size=${kb}KB`);
    let ok=this.adapter.set(this.key(slot),json);
    if(!ok&&this.lastErrName.indexOf('Quota')>=0){   /* 容量オーバー：ニュースと開示を削って再挑戦 */
      const bk={news:S.news,disc:S.disc};S.news=(S.news||[]).slice(0,80);S.disc=(S.disc||[]).slice(0,80);
      try{json=this.pack(this.slim());ok=this.adapter.set(this.key(slot),json);}catch(e){}
      S.news=bk.news;S.disc=bk.disc;
      if(ok)console.warn('[CAPITAL SAVE] 容量不足のため履歴を一部削って保存しました');}
    if(!ok)return false;
    const back=this.adapter.get(this.key(slot));   /* 読み返して検証 */
    if(back!==json){this.lastErrName='Verify';console.error('[CAPITAL SAVE ERROR] 読み返しが一致しません');return false;}
    this.adapter.set('capital.v1.last',slot);this.lastSize=json.length;this.lastAt=S.savedAt;this.lastSlot=slot;
    try{this.adapter.set('capital.v1.info',JSON.stringify({slot,at:S.savedAt,size:json.length}));}catch(e){}
    return true;},
  // 自動保存（短時間に何度も書き込まない）
  auto(force){if(!S||S.over&&!force)return false;const t=Date.now();if(!force&&t-(this._at||0)<2500)return false;this._at=t;return this.save('auto');},
  raw(slot){return this.adapter.get(this.key(slot));},
  read(slot){const raw=this.adapter.get(this.key(slot));if(!raw)return null;try{return JSON.parse(raw);}catch(e){console.error('[CAPITAL LOAD ERROR] 破損したセーブデータ',slot,e);return{__corrupt:true};}},
  load(slot){const o=this.read(slot);if(o&&o.__corrupt)return 'corrupt';if(!o||!o.co)return false;return this.apply(o);},
  apply(o){if(!o||o.v!==1||!o.co||!o.cos)return false;S=o;RNG.s=S.rng||1;this.migrate();reindex();return true;},
  // 旧バージョンのセーブを最新形式へ（ローソク足の始高安・M&A状態）
  migrate(){const fix=x=>{if(!x.oh||x.oh.length!==x.hist.length)x.oh=x.hist.map((v,i)=>{const p=i?x.hist[i-1]:v;return[p,Math.max(p,v),Math.min(p,v)];});};
    for(const c of S.cos)fix(c);for(const k in S.funds)fix(S.funds[k]);fix(S.mkt);
    Market.usedNames=new Set(S.cos.map(c=>c.name));Market.usedCodes=new Set(S.cos.map(c=>+c.t));   // 読込後の新規上場で名前・コードが重複しないように
    for(const c of S.cos){if(!c.pf)Prof.make(c);if(c.edge==null)c.edge=clamp(c.g-.02,-.2,.6);}
    if(!S.mkt.nk){S.mkt.nk=1;const f=38,d=x=>x*f;S.mkt.idx*=f;S.mkt.m0*=f;S.mkt.hist=S.mkt.hist.map(d);S.mkt.oh=S.mkt.oh.map(o=>o.map(d));for(const n of S.news)if(n.ix)n.ix*=f;}   // 旧指数を日経平均の水準へ
    if(!S.pxV){S.pxV=1;for(const c of Market.listed()){const tg=Market.pxTarget(c.price*c.shares,c.arch),k=tg/c.price;if(k>=3&&c.shares>=1e6*Math.round(k)){const m=[3,5,10,20,50,100].reduce((a,x)=>Math.abs(Math.log(x/k))<Math.abs(Math.log(a/k))?x:a,3);Market.split(c,1/m,1);}}}   // 旧セーブ：株価水準を現実的な帯へ（株式併合）
    if(!S.shV){S.shV=1;for(const c of S.cos){const tg=Math.exp(.28*Math.log(c.price*c.shares)-.7),k=Math.round(c.price/tg);if(k<2)continue;   // 旧セーブ：株数を現実的な水準へ株式分割
      const d=x=>x/k;c.shares*=k;c.price/=k;c.prev/=k;c.m0/=k;c.dps/=k;c.hist=c.hist.map(d);c.oh=c.oh.map(o=>o.map(d));if(c.tobPx)c.tobPx/=k;
      if(S.hold[c.t])S.hold[c.t].q*=k;for(const o of S.offers||[])if(o.t===c.t)o.px/=k;if(S.tob&&S.tob.t===c.t){S.tob.px/=k;S.tob.need*=k;S.tob.p0/=k;}}}
    if(S.exec&&S.exec.CIO){const e=S.exec.CIO;delete S.exec.CIO;if(S.me&&!S.me.adv){S.me.adv={name:e.name,ab:e.ab,pol:e.pol,sal:Math.round(e.sal*.5),since:e.since,sk:{sele:e.ab,risk:60,macro:55,re:50}};S.me.advAuto=!!S.co.invAuto;}}   /* 旧CIOは個人の投資担当へ */
    if(!S.exec)S.exec={};if(S.fx==null)S.fx=[];Global.st();Me.st();Sports.st();for(const c of S.cos){if(c.q===((S.month-0)%3)&&c.repDone==null)c.repDone=S.month;}if(!S.execC)S.execC={m:-99,c:{}};
    if(!S.offers)S.offers=[];if(!S.eq)S.eq={listed:false,shares:1e4,founder:1e4,price:0,hist:[],oh:[],divPolicy:0,mood:0,jump:0};if(!S.props)S.props=[];if(!S.reMkt){S.reMkt=[];Prop.refresh();}if(S.tob===undefined)S.tob=null;S.flash=[];if(S.flows)for(const k in newFlows())if(S.flows[k]==null)S.flows[k]=0;},
  meta(slot){const o=this.read(slot);if(o&&o.__corrupt)return{corrupt:true,name:'破損したデータ',date:'—',diff:'',size:(this.raw(slot)||'').length};
    if(!o||!o.player)return null;const raw=this.raw(slot)||'';
    let assets=0,rev=0;try{assets=(o.co?o.co.cash:0)+0;const h=o.co&&o.co.hist||[];rev=h.length?h[h.length-1].pl.rev:0;}catch(e){}
    return{name:o.player.name,date:`${o.y}年${o.m}月`,diff:o.diff,at:o.savedAt,over:!!o.over,size:raw.length,cash:assets,rev,emp:o.co?o.co.emp:0,biz:(o.biz||[]).length,y:o.y,m:o.m};},
  info(){try{return JSON.parse(this.adapter.get('capital.v1.info')||'null');}catch(e){return null;}},
  // 開発用：保存状態をコンソールに出す
  debug(){const L=['CAPITAL SAVE DEBUG','localStorage: '+(this.check()?'OK':'NG ('+this.lastErrName+')')];
    for(const s of this.slots){const r=this.raw(s);L.push(`${s}: ${r?Math.round(r.length/1024)+'KB':'EMPTY'}`);}
    L.push('last: '+(this.last()||'—'));if(S)L.push('current: '+Math.round(this.pack(S).length/1024)+'KB');console.log(L.join('\n'));return L.join('\n');},
  del(slot){this.adapter.del(this.key(slot));},
  last(){return this.adapter.get('capital.v1.last');}
};

/* ---------- charts ---------- */
function spark(vals,o={}){const w=o.w||320,h=o.h||64,col=o.col||'var(--ai)';
  if(!vals||vals.length<2)return `<svg class="chart" viewBox="0 0 ${w} ${h}"></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const p=vals.map((v,i)=>[i/(vals.length-1)*w,h-4-(v-mn)/r*(h-8)]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img">${o.fill!==false?`<path d="${d}L${w} ${h}L0 ${h}Z" fill="${col}" opacity=".1"/>`:''}<path d="${d}" fill="none" stroke="${col}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`;}
// 週番号 → 日付（hist の最新＝直前に終わった週）
function wkIdx(j){return (S.y*12+S.m-1)*4+(S.week-1)-1-j;}
function wkLbl(ix,mon){const y=Math.floor(ix/48),r=((ix%48)+48)%48;return `${y}年${Math.floor(r/4)+1}月${mon?'':` 第${r%4+1}週`}`;}
// ローソク足チャート。n本（週足）。n>60 のときは月足にまとめる。key はタップ選択の識別子
function candles(o,n,key,sm){const H=o.hist||[],OH=o.oh||[],N=H.length,mon=n>60;
  let B=[];for(let i=Math.max(0,N-n);i<N;i++){const c=H[i],x=OH[i]||[c,c,c];B.push({o:x[0],h:Math.max(x[1],c,x[0]),l:Math.min(x[2],c,x[0]),c,ix:wkIdx(N-1-i)});}
  if(mon){const g=[];for(const b of B){const k=Math.floor(b.ix/4),L=g[g.length-1];if(L&&L.k===k){L.h=Math.max(L.h,b.h);L.l=Math.min(L.l,b.l);L.c=b.c;}else g.push({...b,k});}B=g;}
  if(B.length<2)return `<div class="empty">データが不足しています</div>`;
  const W=320,Hh=sm?120:170,pw=W*.86,pad=8,hi=Math.max(...B.map(b=>b.h)),lo=Math.min(...B.map(b=>b.l)),rg=(hi-lo)||hi*.01||1;
  const Y=v=>pad+(hi-v)/rg*(Hh-2*pad),bw=pw/B.length,body=Math.max(.9,bw*.62);
  const sel=UI.cdl&&UI.cdl.k===key&&UI.cdl.i<B.length?UI.cdl.i:B.length-1;
  const P=mon?6:13,ma=[];for(let i=0;i<B.length;i++){if(i>=P-1){let t=0;for(let k=i-P+1;k<=i;k++)t+=B[k].c;ma.push([i,t/P]);}}
  let g='';for(const f of [0,.5,1]){const yy=pad+f*(Hh-2*pad);g+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>`;}
  g+=`<rect x="${sel*bw}" y="0" width="${bw}" height="${Hh}" fill="var(--ai)" opacity=".1"/>`;
  B.forEach((b,i)=>{const x=i*bw+bw/2,up=b.c>=b.o,col=up?'var(--up)':'var(--dn)',y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c));
    g+=`<line x1="${x}" x2="${x}" y1="${Y(b.h)}" y2="${Y(b.l)}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/><rect ${i===B.length-1?'class="lc"':''} x="${x-body/2}" y="${y1}" width="${body}" height="${Math.max(.8,y2-y1)}" fill="${up?col:'var(--sf)'}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;});
  if(ma.length>1)g+=`<path d="${ma.map((p,k)=>(k?'L':'M')+(p[0]*bw+bw/2).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="var(--warn)" stroke-width="1.3" vector-effect="non-scaling-stroke" opacity=".85"/>`;
  const V=o.vh&&!sm?o.vh.slice(-B.length*(mon?4:1)):null;if(V&&V.length){const vv=[];if(mon){for(let i=0;i<B.length;i++)vv.push(sum(V.slice(i*4,i*4+4),x=>x));}else vv.push(...V.slice(-B.length));const vm=Math.max(1,...vv);
    vv.forEach((v,i)=>{const hh=v/vm*Hh*.18;g+=`<rect x="${i*bw+bw*.2}" y="${Hh-hh}" width="${bw*.6}" height="${hh}" fill="var(--ink3)" opacity=".28"/>`;});}
  B.forEach((b,i)=>{g+=`<rect x="${i*bw}" y="0" width="${bw}" height="${Hh}" fill="transparent" data-act="cdl" data-ck="${key}" data-v="${i}" style="cursor:pointer"/>`;});
  const d=v=>nf(v,v<100?2:v<1e4?0:0),s=B[sel],pv=sel?B[sel-1].c:s.o;
  return `<div class="cw ${sm?'sm':''}" data-k="${key}-${n}"><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="ローソク足チャート">${g}</svg>
   <span class="cl" style="top:${pad/Hh*100}%">${d(hi)}</span><span class="cl" style="top:50%">${d((hi+lo)/2)}</span><span class="cl" style="top:${(1-pad/Hh)*100}%">${d(lo)}</span></div>
   <div class="cinfo"><span>${wkLbl(s.ix,mon)}</span><span>始 <b>${d(s.o)}</b></span><span>高 <b>${d(s.h)}</b></span><span>安 <b>${d(s.l)}</b></span><span>終 <b>${d(s.c)}</b></span><span class="${tone(s.c-pv)}">${pct(chg(s.c,pv))}</span>${o.vh&&!mon&&o.vh.length?`<span>出来高 <b>${nf(o.vh[Math.max(0,o.vh.length-B.length+sel)]||0)}</b></span>`:''}<span class="mut3" style="margin-left:auto">${mon?'月足':'週足'}・<span style="color:var(--warn)">━</span> ${P}${mon?'ヶ月':'週'}平均</span></div>`;}
function rangeChips(act,cur,opts){return `<div class="chips" style="margin-top:6px">${(opts||[[13,'3ヶ月'],[52,'1年'],[156,'3年']]).map(r=>`<button class="chip ${cur===r[0]?'on':''}" data-act="${act}" data-v="${r[0]}">${r[1]}</button>`).join('')}</div>`;}
function pchart(vals){if(!vals||vals.length<2)return spark(vals);return spark(vals,{col:vals[vals.length-1]>=vals[0]?'var(--up)':'var(--dn)',h:90});}
function barsChart(rows,h=96){if(!rows.length)return '<div class="empty">最初の月次決算後に表示されます</div>';
  const w=320,mx=Math.max(1,...rows.map(r=>Math.max(r.a,Math.abs(r.b)))),mn=Math.min(0,...rows.map(r=>r.b));
  const range=mx-mn,zero=h-4-(-mn)/range*(h-8),bw=w/rows.length;
  const y=v=>h-4-(v-mn)/range*(h-8);
  let s='';rows.forEach((r,i)=>{const x=i*bw;s+=`<rect x="${x+bw*.12}" y="${y(r.a)}" width="${bw*.76}" height="${Math.max(0,zero-y(r.a))}" fill="var(--ai)" opacity=".18" rx="1.5"/>`;
    const yb=r.b>=0?y(r.b):zero,hb=Math.abs(y(r.b)-zero);s+=`<rect x="${x+bw*.3}" y="${yb}" width="${bw*.4}" height="${Math.max(.5,hb)}" fill="${r.b>=0?'var(--up)':'var(--dn)'}" rx="1"/>`;});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${s}<line x1="0" x2="${w}" y1="${zero}" y2="${zero}" stroke="var(--line)"/></svg><div class="row mut3" style="font-size:11px;gap:12px;margin-top:4px"><span>■ 売上</span><span style="color:var(--up)">■ 利益</span><span style="color:var(--dn)">■ 損失</span></div>`;}
function waterfall(pl){if(!pl)return '<div class="empty">「次の月へ」で最初の月次決算を行うと、売上から利益までの流れがここに表示されます。</div>';
  const items=[['売上',pl.rev],['原価',-pl.cogs],['人件費',-pl.labor],['家賃・固定',-pl.rent],['広告',-pl.ad],['研究開発',-pl.rd],['償却・他',-(pl.dep+pl.other)]];
  const lo=Math.min(0,pl.op),hi=Math.max(pl.rev,1),rg=hi-lo,X=v=>(v-lo)/rg*100;let cur=0,s='';
  for(const [n,v] of items){const a=cur,b=cur+v;cur=b;const l=X(Math.min(a,b)),wd=Math.max(.6,Math.abs(X(b)-X(a)));
    s+=`<div class="wf-row"><span class="mut">${n}</span><div class="wf-track"><i style="left:${l}%;width:${wd}%;background:${v>=0?'var(--ai)':'var(--ink3)'};opacity:${v>=0?1:.45}"></i></div><span class="v">${yen(v)}</span></div>`;}
  s+=`<div class="wf-row" style="font-weight:700"><span>営業利益</span><div class="wf-track"><i style="left:${X(Math.min(0,pl.op))}%;width:${Math.max(.6,Math.abs(X(pl.op)-X(0)))}%;background:${pl.op>=0?'var(--up)':'var(--dn)'}"></i></div><span class="v ${tone(pl.op)}">${yen(pl.op)}</span></div>`;
  return s;}

// DOMを丸ごと置き換えず差分だけ反映する。スクロール位置・開いているセレクト・入力中の文字・アニメーションが保たれる
const FMT={yen:v=>yen(v),nf:v=>nf(v),nf1:v=>nf(v,1),nf2:v=>nf(v,2),nf4:v=>nf(v,4),px:v=>nf(v,v<100?2:0),pct:v=>pct(v)};
// 数字をなめらかに変化させる要素（前回値との差を補間）
const N=(v,f='yen')=>`<span class="tw" data-n="${isFinite(v)?v:0}" data-f="${f}">${FMT[f](v)}</span>`;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tweens(){for(const el of document.querySelectorAll('[data-n]')){const v=+el.dataset.n;if(el._v===undefined){el._v=v;el._s=v;continue;}
    if(el._v===v){if(!el._a&&el.textContent!==FMT[el.dataset.f](v))el.textContent=FMT[el.dataset.f](v);continue;}
    const from=el._s??el._v,up=v>el._v;el._v=v;if(RM){el._s=v;continue;}
    const f=FMT[el.dataset.f],t0=performance.now(),D=650;el._a=1;
    el.animate([{backgroundColor:up?'color-mix(in srgb,var(--up) 22%,transparent)':'color-mix(in srgb,var(--dn) 22%,transparent)'},{backgroundColor:'transparent'}],{duration:900,easing:'ease-out'});
    const step=now=>{if(el._v!==v)return;const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3),x=from+(v-from)*e;el._s=x;el.textContent=f(x);if(k<1)requestAnimationFrame(step);else{el._a=0;el._s=v;}};requestAnimationFrame(step);}}
function morph(root,html){const t=document.createElement('template');t.innerHTML=html;patchKids(root,t.content);}
function patchKids(a,b){const an=[...a.childNodes],bn=[...b.childNodes];
  for(let i=0;i<bn.length;i++){const o=an[i],n=bn[i];
    if(!o){a.appendChild(n);continue;}
    if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName||(o.nodeType===1&&o.getAttribute('data-k')!==n.getAttribute('data-k'))){a.replaceChild(n,o);continue;}
    if(o.nodeType!==1){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;continue;}
    patchEl(o,n);}
  for(let i=an.length-1;i>=bn.length;i--)a.removeChild(an[i]);}
function patchEl(o,n){const oa=o.attributes,na=n.attributes;
  for(let i=oa.length-1;i>=0;i--){const x=oa[i].name;if(!n.hasAttribute(x))o.removeAttribute(x);}
  for(let i=0;i<na.length;i++){const x=na[i];if(o.getAttribute(x.name)!==x.value)o.setAttribute(x.name,x.value);}
  const tag=o.nodeName,foc=o===document.activeElement;
  if(tag==='INPUT'){if(!foc){const v=n.getAttribute('value')??'';if(o.value!==v)o.value=v;}o.checked=n.hasAttribute('checked');return;}
  if(tag==='TEXTAREA'){if(o.readOnly&&o.value!==n.value)o.value=n.value;return;}
  if(tag==='SELECT'){patchKids(o,n);if(!foc){const op=n.querySelector('option[selected]')||n.querySelector('option');if(op&&o.value!==op.value)o.value=op.value;}return;}
  patchKids(o,n);}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
function err(m){if(m){toast(m);return true;}return false;}
function logoEl(p,sz=30){return `<div class="logo" style="background:${esc(p.color)};width:${sz}px;height:${sz}px">${esc(p.logo)}</div>`;}
function chg(a,b){return b?a/b-1:0;}
// 今月決算を発表した銘柄の横に付ける「決」マーク（赤＝予想超え、緑＝予想割れ、灰＝予想通り）
function kb(c){if(!c||c.fund||c.repM!==S.month||!c.lastQ)return '';const x=c.lastQ.s,cl=x>.03?'up':x<-.03?'dn':'';

function nGrp(n){const t=n.title;if(n.cat==='未上場')return'未上場';if(n.cat==='世界経済')return'世界経済';if(n.cat==='自社'||(S.player&&t.startsWith(S.player.name)))return'自社';if(n.cat==='決算')return'決算';if(/新規上場|IPO/.test(t))return'IPO';if(/金利/.test(t))return'金利';if(n.cat==='海外')return'海外';if(n.cat==='為替'||/為替|円安|円高|ドル/.test(t))return'為替';if(/政策金利|中央銀行|金融緩和|引き締め/.test(t))return'金融政策';
  if(/TOB|買収|M&A|子会社|合併/.test(t))return'M&A';if(n.cat==='決算'||n.cat==='市場'||/株|日経平均|上場/.test(t))return'株式';if(n.cat==='経済')return'国内経済';if(/業界|ブーム|バブル|需要/.test(t))return'業界';if(n.t&&CM[n.t]&&S.biz.some(b=>BT[b.type]?.sec===CM[n.t].sec))return'競合企業';return n.t?'企業':'その他';}

function newsRow(n){const L=nLv(n);return `<button class="nl p${L}" data-act="newsD" data-v="${n.id}"><span class="tm">${nTime(n)}</span><span class="sp" style="min-width:0"><span class="hd">${L===3?'🔴 ':''}${n.tn>0?'<span class="up">▲</span> ':n.tn<0?'<span class="dn">▼</span> ':''}${esc(n.title)}</span>

/* ---------- alerts: 今月の判断ポイント ---------- */
function alerts(){const a=[],last=S.co.hist[S.co.hist.length-1];
  if(S.co.cash<0)a.push(['bad','現金がマイナスです。借入・株式売却・事業縮小で早急に資金を確保してください。']);
  if(last){const burn=-(last.cf.op+last.cf.fin+Math.min(0,-last.cf.d.capex*0));if(last.cf.op<0&&S.co.cash>0){const mo=S.co.cash/-last.cf.op;if(mo<8)a.push(['w',`営業キャッシュフローが赤字。今のペースだと現金は約${mo.toFixed(1)}ヶ月分です。`]);}}
  for(const b of S.biz){const t=BT[b.type];if(!b.last)continue;const n=t.n;
    if(t.model!=='sub'&&b.util>.95&&b.demand>b.cap*1.15)a.push(['',`${n}：需要が供給能力を${pctp(b.demand/b.cap-1,0)}上回っています。値上げか増員${t.locCap?'・出店':''}のチャンスです。`]);
    if(t.model==='sub'&&b.customers>b.cap)a.push(['w',`${n}：サポート人員が不足し、解約率が上がっています。増員してください。`]);
    if(t.model!=='sub'&&b.util<.6&&b.hist.length>1)a.push(['',`${n}：稼働率${pctp(b.util,0)}。人員が余っているか、集客が足りません。`]);
    const h=b.hist.slice(-3);if(h.length===3&&h.every(x=>x.op<0))a.push(['w',`${n}：3ヶ月連続の営業赤字。価格・コスト・撤退を検討する時期です。`]);
    if(b.price>Biz.ref(b)*1.35)a.push(['',`${n}：価格が相場の${pctp(b.price/Biz.ref(b),0)}。ブランドが削られています。`]);}
  const E=S.econ,eh=E.hist,pr=eh.length>3?eh[eh.length-4].rate:E.rate;
  if(E.rate>pr&&S.co.loans.length)a.push(['w','金利上昇局面です。新規借入の金利が上がっています。']);
  if(E.phase==='不況'||E.phase==='後退')a.push(['','景気後退局面。株価が割安になった優良企業を探す好機かもしれません。']);
  if(E.phase==='過熱')a.push(['w','景気過熱。株価の割高感と金融引き締めに注意。']);
  if(last&&S.co.cash>Math.max(3e7,(last.pl.rev-last.pl.op)*4)&&!Object.keys(S.hold).length)a.push(['','手元資金に余裕があります。投資・新規事業・出店を検討できます。']);
  if(S.board&&S.board.pend)a.unshift(['w',`社長、経営会議から上申があります：「${S.board.pend.ag.ttl}」（会社→会議で判断してください）`]);
  for(const o of S.offers)if(CM[o.t])a.unshift(['w',`買収提案：${CM[o.a]?.name||'他社'}が${CM[o.t].name}を1株${nf(o.px)}円で買収したいと打診。今月末までに応じるか決めてください（会社→連結）。`]);
  if(S.tob&&CM[S.tob.t]){const T=S.tob,need=T.need*T.px+T.fee;a.unshift([S.co.cash<need?'bad':'',`${CM[T.t].name}へのTOBを実施中。今月末に決済（必要資金 ${yen(need)}円）。`]);}
  for(const e of S.events)if(e.stage==='rumor')a.push(['w',`兆候：${Events.fill(EVD[e.id].name,e)}の可能性。関連業種の動きに注意。`]);
  if(S.biz.length<Co.slots()&&Object.keys(BT).some(k=>Co.unlocked(k)&&!S.biz.some(b=>b.type===k)))a.push(['',`事業枠が空いています（${S.biz.length}/${Co.slots()}）。新規事業に参入できます。`]);
  return a.slice(0,6);}

  const reAssets=sum(S.biz,b=>Biz.reValue(b))+Prop.totalValue();

/* ---------- ストーリー型チュートリアル（本編データをそのまま使う） ---------- */
const TSTEPS=[
 {t:'ようこそ',b:'はじめまして、経営アドバイザーの佐藤です。あなたは25歳。ここから会社を育てるのも、投資家として生きるのも自由です。まずは基本を一緒に確認しましょう。',next:1},
 {t:'あなたのお金',b:'下の「個人」をタップしてください。あなた自身のお金が見られます。',sel:'nav button:nth-child(2)',ok:()=>UI.tab==='me'},
 {t:'個人と会社は別',b:'ここがあなた個人の財布です。会社の現金とは完全に別で、勝手には使えません。会社からは「役員報酬」と「配当」であなたのお金になります。',next:1},
 {t:'会社を見る',b:'次は「会社」をタップ。会社の現金・資産・決算はこちらで管理します。',sel:'nav button:nth-child(3)',ok:()=>UI.tab==='co'},
 {t:'事業',b:'「事業」タブには、あなたが運営している事業が並びます。価格・広告・人員・設備を調整して育てていきます。',sel:'nav button:nth-child(4)',ok:()=>UI.tab==='biz'},
 {t:'時間を進める',b:'このゲームでは、右上の「⏩ 進める」を押したときだけ時間が進みます。まずは1週間進めてみましょう。',sel:'.hadv',ok:()=>S.week>1||S.month>0},
 {t:'期間レポート',b:'進めた期間に起きたことは、このレポートにまとまります。ニュースも決算も、ここで確認してから次の判断をします。',next:1},
 {t:'月次決算',b:'毎月の第4週末に決算が確定します。もう少し進めて、最初の決算を見てみましょう。',sel:'.hadv',ok:()=>S.co.hist.length>=1},
 {t:'利益は誰のもの？',b:'会社が稼いだ利益は「会社のお金」です。あなたのお金にするには、役員報酬・配当・株式売却の3つがあります。個人タブで役員報酬を決めてみましょう。',sel:'nav button:nth-child(2)',ok:()=>Me.st().salary>0&&UI.tab==='me'},
 {t:'株式と持株比率',b:'あなたは会社の株式を持つオーナーでもあります。株を売れば個人資産は増えますが、持株比率が下がると経営権を失うことがあります。',next:1},
 {t:'役員と経営会議',b:'会社が育つと、CFO・COOなどを招へいできます。役員は事業を自動で運営し、毎月の経営会議で提案をしてきます。最後に決めるのはあなたです。',next:1},
 {t:'ここから先は自由です',b:'世界一の企業を作るのも、会社を売って投資家になるのも、球団やゲーム会社を持つのもあなた次第。あなたの人生を始めましょう。',fin:1}];
const Tut={
  st(){if(!S)return null;if(!S.tut)S.tut={step:0,done:false};return S.tut;},
  active(){const T=this.st();return T&&!T.done&&T.step<TSTEPS.length;},
  start(){const T=this.st();if(!T)return;T.step=0;T.done=false;this.draw();},
  skip(){const T=this.st();if(!T)return;T.done=true;this.draw();Store.auto(true);toast('チュートリアルを終了しました（設定からいつでも見られます）');},
  next(){const T=this.st();if(!T)return;T.step++;if(T.step>=TSTEPS.length){T.done=true;Store.auto(true);}this.draw();},
  // 画面を描いたあとに呼ぶ：条件を満たしていれば次のステップへ進める
  check(){const T=this.st();if(!T||T.done)return;const s2=TSTEPS[T.step];if(s2&&s2.ok&&s2.ok()){T.step++;if(T.step>=TSTEPS.length)T.done=true;}this.draw();},
  draw(){let r=document.getElementById('tut');if(!r){r=document.createElement('div');r.id='tut';document.body.appendChild(r);}
    const T=this.st();if(!T||T.done||!S){r.innerHTML='';return;}const s2=TSTEPS[T.step];if(!s2){r.innerHTML='';return;}
    const el=s2.sel?document.querySelector(s2.sel):null,b=el?el.getBoundingClientRect():null;
    const top=b?(b.top>innerHeight*.55?12:Math.min(innerHeight-230,b.bottom+14)):Math.round(innerHeight*.28);
    r.innerHTML=`${b?`<div class="spot" style="left:${b.left-6}px;top:${b.top-6}px;width:${b.width+12}px;height:${b.height+12}px"></div><div class="ring2" style="left:${b.left-8}px;top:${b.top-8}px;width:${b.width+16}px;height:${b.height+16}px"></div>`:'<div class="spot" style="left:50%;top:50%;width:0;height:0"></div>'}
     <div class="card2" style="top:${top}px"><div class="who2"><i>佐</i>経営アドバイザー 佐藤・${T.step+1}/${TSTEPS.length}</div>
      <b style="font-size:14.5px">${esc(s2.t)}</b><div class="tx2" style="margin-top:4px">${esc(s2.b)}</div>
      <div class="btns">${s2.next||s2.fin?`<button class="btn sp" data-act="tutNext">${s2.fin?'自分の人生を始める':'次へ'}</button>`:'<span class="mut" style="font-size:12px;align-self:center">光っているところをタップしてください</span>'}<button class="sk" data-act="tutSkip">スキップ</button></div></div>`;}
};

/* ---------- 🌑 SHADOW EMPIRE（間接支配のネットワーク） ---------- */
function shShadow(){return()=>{const M=Me.st(),rows=[];
  const add=(n,path,pct,rev,emp,t)=>rows.push({n,path,pct,rev,emp,t});
  // 本体グループ
  if(Life.hasCo()){const C=Co.cons();add(pName(),'あなた → 本体',Eq.founderPct(),C.rev,C.emp,null);
    for(const c of MA.subs()){add(c.name,`${pName()} → 子会社`,Trade.own(c.t)*Eq.founderPct(),c.rev,c.emp,c.t);
      for(const g of MA.kids(c.t))add(g.name,`${pName()} → ${c.name} → 孫会社`,Trade.own(c.t)*(g.parOwn||1)*Eq.founderPct(),g.rev,g.emp,g.t);}
    for(const c of MA.affs())add(c.name,`${pName()} → 持分法`,Trade.own(c.t)*Eq.founderPct(),c.rev,c.emp,c.t);
    for(const t in S.hold){const c=CM[t];if(!c||Trade.own(t)<.05||Trade.own(t)>.5)continue;add(c.name,`${pName()} → 株式保有`,Trade.own(t)*Eq.founderPct(),c.rev,c.emp,t);}}
  // 個人が直接持つ会社・株式
  for(const c of Me.cos())add(c.name,'あなた → 個人所有',c.meOwn||1,c.rev,c.emp,c.t);
  for(const t in M.hold){const c=CM[t];if(!c)continue;const p=M.hold[t].q/c.shares;if(p<.02)continue;add(c.name,'あなた → 個人の持株',p,c.rev,c.emp,t);}
  rows.sort((a,b)=>b.pct*b.rev-a.pct*a.rev);
  const rev=sum(rows,r=>r.rev*r.pct),emp=Math.round(sum(rows,r=>r.emp*r.pct)),n=rows.length;
  const al=(S.ally&&S.ally.list)||[];
  return ['🌑 SHADOW EMPIRE',`<div class="view" data-k="shadow">
   <div class="card" style="background:linear-gradient(135deg,color-mix(in srgb,var(--ink) 12%,var(--sf)),var(--sf))"><div class="grid3" style="font-size:12px"><div><div class="mut3">実質支配の売上</div><b class="num">${yen(rev)}</b></div><div><div class="mut3">実質の従業員</div><b class="num">${nf(emp)}人</b></div><div><div class="mut3">関係する企業</div><b class="num">${n}社</b></div></div>
    <p class="note" style="margin-bottom:0">あなた個人の持分をたどって、間接的に支配・影響している企業を集計しています（持株比率×売上）。表向きは別々の会社でも、たどればひとつのネットワークです。</p></div>
   <h3>支配のネットワーク</h3><div class="nbox">${rows.slice(0,30).map(r=>`<button class="nl" ${r.t?`data-act="stock" data-t="${r.t}"`:''}><span class="tm">${pctp(r.pct,1)}</span><span class="sp"><span class="hd">${esc(r.n)}</span><span class="mt"><span>${esc(r.path)}</span><span>売上 ${yen(r.rev)}</span><span>${nf(r.emp)}人</span></span></span></button>`).join('')||'<div class="empty">まだネットワークはありません</div>'}</div>
   ${al.length?`<h3>提携関係</h3><div class="card" style="font-size:12.5px">${al.map(a=>`<div class="row"><span class="sp">${esc(a.n)}</span><span class="mut3">残り${a.m}ヶ月</span></div>`).join('')}</div>`:''}
   ${Rival.list().length?`<h3>因縁のある経営者</h3><div class="nbox">${Rival.list().map(r=>`<div class="nl"><span class="tm">${r.t?'🔥':'—'}</span><span class="sp"><span class="hd">${esc(r.name)}${r.t&&CM[r.t]?` → ${esc(CM[r.t].name)}`:'（再起を準備中）'}</span><span class="mt"><span>元 ${esc(r.from)}</span><span>${SECTORS[r.sec].n}</span><span>${r.how==='hostile'?'敵対的買収された':'買収された'}</span></span></span></div>`).join('')}</div>`:''}</div>`];};}

/* ---------- 経営会議（判断ポイント→議論→社長決裁→即時実行） ---------- */
const Meet={
  // 会社の状況から「会議にかける案件」を作る。Board.agendas を土台に、案件ごとの選択肢を付ける
  items(){const c=Board.ctx(),L=[],done=(S.board&&S.board.done)||{},id=k=>`${S.y}-${S.m}-${k}`;
    const add=(o)=>{o.id=id(o.key);o.done=!!done[o.id];L.push(o);};
    if(c.cash<0||c.runway<3)add({key:'cash',sev:'h',cat:'資金',ttl:'資金繰りの立て直し',rs:c.cash<0?`現金がマイナスです（${yen(c.cash)}円）`:`このままだと約${c.runway.toFixed(1)}ヶ月で現金が尽きます`,k:'borrow',
      opts:[{l:'借入で資金を確保',d:`借入枠 ${yen(Co.limit())}円・金利${pctp(Co.rate()/100,2)}`,amt:0,run:()=>Co.borrow(Math.min(Co.limit(),Math.max(1e6,burnNeed())))},
        {l:'保有株を売って現金化',d:`保有株の評価額 ${yen(Co.secMV())}円`,run:()=>{const t=Object.keys(S.hold)[0];if(!t)return '保有株がありません';return Trade.sell(t,S.hold[t].q);}},
        {l:'広告・研究開発費を圧縮',d:'当面の支出を抑えて現金を残す',run:()=>{for(const b of S.biz){b.ad=Math.round(b.ad*.5);b.rd=Math.round(b.rd*.5);}return null;}},
        {l:'今回は何もしない',d:'様子を見る',run:()=>null}]});
    for(const b of S.biz){const t=BT[b.type];if(!b.last)continue;
      if(b.util>.93&&b.demand>b.cap*1.1)add({key:'cap'+b.id,sev:'g',cat:'供給能力',ttl:`${t.n}事業の供給能力の拡大`,rs:`需要が供給能力を${pctp(b.demand/b.cap-1,0)}上回っています（稼働率${pctp(b.util,0)}）`,k:'capex',biz:b.id,amount:Biz.equipCost(b),
        opts:[{l:'増員する',d:`${Math.max(1,Math.round(b.staff*.15))}人を採用・月の人件費+${yen(Math.max(1,Math.round(b.staff*.15))*Biz.sal(b))}円`,run:()=>Biz.hire(b,Math.max(1,Math.round(b.staff*.15)))},
          ...(t.locCap&&b.locs<t.locCap?[{l:`${t.locN}を増やす`,d:`${yen(Biz.openCost(b))}円・供給能力が増える`,amt:Biz.openCost(b),run:()=>Biz.openLoc(b)}]:[]),
          {l:'設備を増強する',d:`${yen(Biz.equipCost(b))}円・Lv${b.equip+1}へ`,amt:Biz.equipCost(b),run:()=>Biz.upgrade(b)},
          {l:'値上げする',d:`${nf(b.price)}円 → ${nf(Math.round(b.price*1.05))}円・需要は減るが利益率は上がる`,run:()=>{b.price=Math.round(b.price*1.05);return null;}},
          {l:'現状を維持する',d:'今は動かない',run:()=>null}]});
      const h=b.hist.slice(-3);
      if(h.length===3&&h.every(x=>x.op<0))add({key:'bad'+b.id,sev:'h',cat:'不採算',ttl:`${t.n}事業の立て直し`,rs:'3ヶ月続けて営業赤字です',k:'exit',biz:b.id,
        opts:[{l:'コストを削減する',d:'広告・研究開発費を4割減らす',run:()=>{b.ad=Math.round(b.ad*.6);b.rd=Math.round(b.rd*.6);return null;}},
          {l:'値上げして採算を取る',d:`${nf(b.price)}円 → ${nf(Math.round(b.price*1.08))}円`,run:()=>{b.price=Math.round(b.price*1.08);return null;}},
          {l:'規模を縮小する',d:`人員を2割減らす${b.locs>1?`・${t.locN}も1つ閉じる`:''}`,run:()=>{Biz.hire(b,-Math.max(1,Math.round(b.staff*.2)));if(b.locs>1&&Biz.closeLoc)Biz.closeLoc(b);return null;}},
          {l:'この事業から撤退する',d:'資産を売却し、従業員には退職金を支払う',run:()=>{Biz.exit(b);return null;}},
          {l:'継続して様子を見る',d:'何もしない',run:()=>null}]});
      if(b.util<.6&&b.hist.length>1)add({key:'low'+b.id,sev:'m',cat:'稼働率',ttl:`${t.n}事業の稼働率の改善`,rs:`稼働率${pctp(b.util,0)}。人が余っているか集客が足りません`,k:'ad',biz:b.id,
        opts:[{l:'広告を増やす',d:`広告費 ${yen(b.ad)}円 → ${yen(Math.round(Math.max(b.ad*1.6,(b.last?.rev||0)*.04)))}円`,run:()=>{b.ad=Math.round(Math.max(b.ad*1.6,(b.last?.rev||0)*.04));return null;}},
          {l:'値下げして客を呼ぶ',d:`${nf(b.price)}円 → ${nf(Math.round(b.price*.95))}円`,run:()=>{b.price=Math.round(b.price*.95);return null;}},
          {l:'人員を減らす',d:`${Math.max(1,Math.round(b.staff*.1))}人を削減`,run:()=>Biz.hire(b,-Math.max(1,Math.round(b.staff*.1)))},
          {l:'現状を維持する',d:'様子を見る',run:()=>null}]});}
    // 大きな案件（新規事業・海外・M&A・IPOなど）は Board の議題から取り込む
    for(const a of Board.agendas()){if(['crisis','exit','loc','capex'].includes(a.k))continue;
      if(a.big){add({key:'big',sev:'h',cat:'超大型投資',ttl:a.ttl,rs:a.note,k:'bigbet',amount:a.amount,ag:a,
        opts:[{l:`${yen(a.amount)}円を投じる`,d:'成功すれば企業価値が跳ね上がる',amt:a.amount,run:()=>Big.accept()},
          {l:'規模を半分にして挑む',d:'損失も成果も半分になる',amt:Math.round(a.amount/2),run:()=>{Big.st().offer.amt=Math.round(a.amount/2);Big.st().offer.p=Math.max(.1,Big.st().offer.p-.06);return Big.accept();}},
          {l:'見送る',d:'堅実に本業へ投資する',run:()=>{Big.reject();return null;}}]});continue;}
      if(a.nat){add({key:a.k,sev:'h',cat:'国家規模',ttl:a.ttl,rs:a.note,k:a.k,amount:a.amount,ag:a,
        opts:[{l:`全額（${yen(a.amount)}円）を拠出する`,d:'最大の効果を狙う',amt:a.amount,run:()=>Nation.run(a.nat,a.amount)},
          {l:`半額（${yen(Math.round(a.amount/2))}円）に抑える`,d:'財務への影響を小さくする',amt:Math.round(a.amount/2),run:()=>Nation.run(a.nat,Math.round(a.amount/2))},
          {l:'今回は見送る',d:'本業への投資を優先する',run:()=>null}]});continue;}
      const o={key:a.k+(a.biz||a.cty||a.tgt||''),sev:a.k==='ipo'||a.k==='ma'?'m':'g',cat:{biz:'新規事業',global:'海外',ma:'M&A',ipo:'上場',vc:'投資',buyback:'資本政策',borrow:'資金'}[a.k]||'経営',ttl:a.ttl,rs:a.note||'',k:a.k,amount:a.amount,ag:a,
        opts:[{l:'実行する',d:a.amount?`投資額 ${yen(a.amount)}円`:'会議の決定どおり実行',amt:a.amount,run:()=>Board.run(a)},
          ...(a.k==='biz'?[{l:'小規模で試す',d:'初期の広告・研究開発を抑えて立ち上げる',amt:a.amount,run:()=>{const e=Biz.start(a.biz);if(e)return e;const b=S.biz[S.biz.length-1];b.ad=Math.round(b.ad*.5);b.rd=Math.round(b.rd*.5);return null;}}]:[]),
          ...(a.k==='vc'?[{l:'金額を半分にする',d:`${yen(Math.round(a.amount/2/1e6)*1e6)}円で出資`,amt:a.amount/2,run:()=>VC.invest(a.vc,Math.max(VC.minTicket(VC.st().list.find(x=>x.id===a.vc)),Math.round(a.amount/2/1e6)*1e6))}]:[]),
          {l:'今回は見送る',d:'条件が整うまで待つ',run:()=>null}]};
      add(o);}
    const ord={h:0,m:1,g:2};return L.filter(x=>!x.done).sort((a,b)=>(b.cat==='国家規模')-(a.cat==='国家規模')||ord[a.sev]-ord[b.sev]).slice(0,6);},   /* 緊急・国家規模を先に */
  // 会議の進行状態
  open(id){const it=this.items().find(x=>x.id===id);if(!it)return toast('この案件はすでに決裁済みです');
    UI.meet={it,phase:'intro',i:0,said:[],sel:0,cond:null};openSheet(shMeet());},
  ops(){const M=UI.meet;if(!M)return[];if(M._ops)return M._ops;
    const c=Board.ctx(),team=Board.team();M._ops=team.map(o=>{const op=Board.opinion(o,{k:M.it.k,amount:M.it.amount||0,biz:M.it.biz,ttl:M.it.ttl},c);
      op.pref=this.pref(o,M.it);return op;});return M._ops;},
  // 役員ごとに推したい選択肢を決める（役職と性格で変わる）
  pref(o,it){const n=it.opts.length,t=o.t,c=Board.ctx();let best=0,sc=-9;
    it.opts.forEach((x,i)=>{const amt=x.amt||0;let v=0;
      if(o.r==='CFO')v=-amt/Math.max(1,c.cash)*2+(x.l.includes('見送')||x.l.includes('現状')?.5:0)+(x.l.includes('借入')&&c.runway<3?1:0)+t.risk*.4;
      if(o.r==='COO')v=(x.l.includes('増員')||x.l.includes('設備')||x.l.includes('拠点')||x.l.includes('店')?1:0)+(x.l.includes('撤退')&&c.bad.length?.8:0)+t.growth*.5-(x.l.includes('現状')?.3:0);
      if(o.r==='CTO')v=(x.l.includes('設備')||x.l.includes('研究')||x.l.includes('小規模')?1:0)+t.innov*.6-amt/Math.max(1,c.cash);
      if(o.r==='CMO')v=(x.l.includes('広告')||x.l.includes('値上げ')||x.l.includes('実行')||x.l.includes('店')?1:0)+t.growth*.5-(x.l.includes('値下げ')?.2:0);
      v+=(n-i)*.01;if(v>sc){sc=v;best=i;}});
    return best;},
  // 会議としての推奨（役員の推し×立場で多数決）
  rec(){const M=UI.meet,ops=this.ops();if(!ops.length)return 0;const sc=M.it.opts.map(()=>0);
    ops.forEach(o=>{sc[o.pref]+=1+o.st*.35;});let b=0;sc.forEach((v,i)=>{if(v>sc[b])b=i;});return b;},
  concl(){const ops=this.ops();if(!ops.length)return['社長判断','役員がいないため、社長が単独で決めます'];
    const t=sum(ops,o=>o.st),y=ops.filter(o=>o.st>0).length,n=ops.filter(o=>o.st<0).length;
    return t>=3?['承認を推奨',`${y}名が賛成`]:t>=1?['条件付きで承認を推奨',`賛成${y}名・慎重${n}名`]:t<=-2?['見送りを推奨',`${n}名が慎重・反対`]:['意見が分かれています',`賛成${y}名・慎重${n}名。社長の判断を求めます`];},
  // 決裁して即実行
  execute(kind){const M=UI.meet;if(!M||M.phase==='exec'||M.phase==='done')return;const it=M.it,opt=it.opts[M.sel];
    const B=Board.st();if(!B.done)B.done={};if(B.done[it.id])return toast('この案件はすでに決裁済みです');
    let err2=null,note='';
    if(kind==='no'){note='否決';}
    else{if(kind==='cond'&&M.cond==='half'&&opt.amt&&it.ag&&it.k==='vc')err2=it.opts.find(x=>x.l.includes('半分'))?.run()??opt.run();
      else err2=opt.run();
      if(kind==='cond'&&M.cond==='test'&&!err2&&it.k==='biz'){const b=S.biz[S.biz.length-1];if(b){b.ad=Math.round(b.ad*.5);b.rd=Math.round(b.rd*.5);}}
      note=kind==='cond'?'条件付き承認':'承認';}
    B.done[it.id]=true;
    const rec={y:S.y,m:S.m,ttl:it.ttl,opt:kind==='no'?'否決':opt.l,res:kind==='no'?'ceoNo':err2?'no':'ceoOK',amount:opt.amt||it.amount||0,err:err2,
      items:[{ttl:it.ttl,k:it.k,amount:opt.amt||it.amount||0,note:it.rs,ops:this.ops(),res:kind==='no'?'ceoNo':err2?'no':'ceoOK'}],n:++B.n,meet:1};
    B.hist.unshift(rec);if(B.hist.length>60)B.hist.length=60;
    if(!err2&&kind!=='no'&&((opt.amt||0)>Math.max(3e6,Co.bs().equity*.03)||['biz','ma','ipo','global'].includes(it.k)))
      News.add('自社',`${pName()}、${it.ttl.replace(/の検討|検討/,'')}を決定`,`経営会議での審議を経て「${opt.l}」を決定しました。${it.rs}`,null,1,{lv:1,imp:[`決裁：${note}`,opt.amt?`投資額 ${yen(opt.amt)}円`:'',this.concl()[0]].filter(Boolean)});
    M.err=err2;M.kind=kind;M.phase='exec';M.step=0;renderSheets();
    const steps=4;const tick=()=>{M.step++;renderSheets();if(M.step<steps)setTimeout(tick,RM?0:280);else{M.phase='done';renderSheets();Store.auto(true);}};
    setTimeout(tick,RM?0:280);}
};

function execOpinions(o){const E=Exec.st(),L=[],cash=S.co.cash,eq=Math.max(1,Co.bs().equity),amt=o.amount||0;
  const add=(r,ok,txt)=>{const e=E[r];if(!e)return;L.push([r,e.name,ok,txt]);};
  add('CFO',amt>cash*.6||amt>eq*.5?0:1,amt>cash*.6?`手元資金の${pctp(amt/Math.max(1,cash),0)}を使います。資金繰りに注意が必要です。`:amt>eq*.5?'自己資本に対して投資額が大きく、財務の健全性が下がります。':`資金繰りに問題はありません。投資後の現金は${yen(cash-amt)}円です。`);
  add('COO',o.kind==='exit'||o.kind==='biz'?1:2,o.kind==='exit'?'現場の負担は減りますが、人員の配置転換が必要です。':o.kind==='biz'?'立ち上げには既存事業から人を回す必要があります。':'実行体制は整えられます。');
  add('CTO',2,o.kind==='biz'||o.kind==='vc'?'技術面では相乗効果が見込めます。':'システム面の対応は可能です。');
  add('CMO',2,o.kind==='global'?'現地でのブランド構築には時間がかかります。':'販促の準備を進めます。');
  return L;}

   <p class="note" style="margin-bottom:0">${UI.acct==='me'?'あなた個人の現金で売買します。利益はあなたのものです（会社の決算には入りません）。':'会社の資金で売買します。売却損益と配当は会社の営業外収益になります。'}</p></div>`}
  ${nws.length?`<h3>関連ニュース</h3><div class="nbox">${nws.map(newsRow).join('')}</div>`:''}`}`];};}

/* ---------- ニュース詳細 ---------- */
const GLOSS=[
  [/政策金利|利上げ|利下げ|金融緩和|引き締め/,'政策金利','中央銀行が決める基準の金利です。上がると借入の利息が増え、企業の利益と株価・不動産価格の重しになります。下がるとその逆で、株式や不動産に資金が向かいやすくなります。'],
  [/TOB|公開買付/,'TOB（公開買付）','期間・価格・株数を公表して、市場の外で株主から一括して株を買い取る方法です。買付価格には市場価格より高い「プレミアム」が上乗せされるため、対象企業の株価は買付価格の近くまで上がります。'],
  [/上場廃止/,'上場廃止','株式市場で売買できなくなることです。完全子会社化や経営破綻で起こります。破綻による上場廃止では、株の価値はほぼ失われます。'],
  [/破綻|倒産/,'経営破綻','借入を返せなくなった状態です。株主は最後に残った財産しか受け取れないため、株価はほぼゼロになります。直前には「倒産懸念」のニュースが出ることが多いです。'],
  [/倒産懸念|資金繰り|危機/,'資金繰りの悪化','手元の現金が足りなくなっている状態です。増資（新しい株を発行して資金を集めること）で株が薄まったり、破綻に至ったりする危険があります。'],
  [/決算|四半期/,'決算と市場予想','株価はすでに「市場予想」を織り込んでいます。そのため、増益でも予想に届かなければ株価は下がり、減益でも予想ほど悪くなければ上がることがあります。'],
  [/増資|公募/,'公募増資','新しい株を発行して資金を集めることです。会社の現金は増えますが、1株あたりの価値が薄まる（希薄化）ため、株価は下がりやすくなります。'],
  [/自社株買い/,'自社株買い','会社が自分の株を市場から買い戻すことです。出回る株が減り1株あたりの利益が増えるため、株価の支えになります。'],
  [/配当/,'配当','利益の一部を株主に現金で分配することです。配当利回り（株価に対する年間配当の割合）が高い株は、下落局面で買われやすくなります。'],
  [/上場|IPO|初値/,'新規上場（IPO）','会社が初めて株式市場に株を公開することです。最初に付く株価を「初値」といいます。公開価格を下回ると「公募割れ」と呼ばれます。'],
  [/アクティビスト|株主提案/,'アクティビスト','株を買い集めて、経営陣に株主還元などを要求する投資家です。要求が通らないと、株主総会で反対票を投じたり、社長の解任を求めたりします。'],
  [/株主総会/,'株主総会','株主が会社の重要事項を決める会議です。社長の選任議案に過半数の賛成が得られないと、社長は退任になります。'],
  [/急落|急騰/,'相場の急変動','短期間に大きく動いた相場は、反動で逆に動くこともよくあります。業績の良い会社まで売られていれば、割安に買える場面でもあります。'],
  [/ブーム|流行|高騰|危機|災害|地政学|規制|補助金|新技術|半導体|バブル|SNS/,'景気イベント','経済全体や特定の業種に影響する出来事です。多くの場合、先に兆候のニュースが出て、発生し、数ヶ月から数年で終息します。関連する業種の需要と株価が大きく動きます。'],
  [/買収|M&A/,'M&A（合併・買収）','他社を買い取ることです。買い手が高すぎる価格を払ったと見られると、買い手側の株価が下がることもあります。']];
function weeksAgo(n){return (S.y*48+(S.m-1)*4+S.week)-(n.y*48+(n.m-1)*4+n.w);}
function shNews(id){return()=>{const n=S.news.find(x=>x.id===id);if(!n)return['ニュース','<div class="empty">このニュースは表示期間を過ぎました</div>'];
  const a=n.t?asset(n.t):null,wa=weeksAgo(n),E=S.econ;const gl=GLOSS.filter(g=>g[0].test(n.title+n.body)).slice(0,2);
  let rel=n.t?S.news.filter(x=>x.t===n.t&&x.id!==n.id):n.ev?S.news.filter(x=>x.ev===n.ev&&x.id!==n.id):S.news.filter(x=>x.cat===n.cat&&x.lv&&x.id!==n.id);rel=rel.slice(0,5);
  const cmp=(k,a0,b0,f)=>`<div class="row" style="font-size:12.5px"><span class="mut sp">${k}</span><span class="num mut3">${f(a0)}</span><span style="margin:0 6px" class="mut3">→</span><b class="num">${f(b0)}</b></div>`;
  let mk='';
  if(a){const ch=n.px?a.price/n.px-1:null;mk=`<h3>市場の反応</h3><div class="card"><div class="row"><div class="sp"><b>${esc(a.name)}</b><div class="mut" style="font-size:12px">${a.fund?'ファンド':(a.t+'・'+SECTORS[a.sec].n)}</div></div><div class="r"><div class="num" style="font-size:18px;font-weight:600">${N(a.price,'px')}円</div>${ch!=null?`<div class="num ${tone(ch)}" style="font-size:12px">報道時から ${pct(ch)}</div>`:''}</div></div>
     ${n.px?cmp('報道時 → 現在',n.px,a.price,v=>nf(v,v<100?2:0)):''}${candles(a,13,'nd'+id,1)}<button class="btn w" style="margin-top:10px" data-act="stock" data-t="${a.t}">この銘柄を見る</button></div>`;}
  else if(CM[n.t]===undefined&&n.t){mk=`<h3>市場の反応</h3><div class="card"><p class="note" style="margin:0">この銘柄はすでに上場廃止されています${n.px?`（報道時の株価 ${nf(n.px)}円）`:''}。</p></div>`;}
  if(!a&&n.ix)mk+=`<h3>市場の反応</h3><div class="card">${cmp('日経平均（報道時 → 現在）',n.ix,S.mkt.idx,v=>nf(v,1))}<div class="row" style="font-size:12.5px"><span class="mut sp">変化率</span><b class="num ${tone(S.mkt.idx-n.ix)}">${pct(S.mkt.idx/n.ix-1)}</b></div>${wa<=13?candles(S.mkt,13,'ndm'+id,1):''}</div>`;
  const ec=n.ec?`<h3>報道時の経済指標</h3><div class="card">${cmp('GDP成長率',n.ec[0],E.gdp,v=>pctp(v/100,1))}${cmp('インフレ率',n.ec[1],E.infl,v=>pctp(v/100,1))}${cmp('政策金利',n.ec[2],E.rate,v=>pctp(v/100,2))}${cmp('ドル円',n.ec[3],E.fx,v=>nf(v,1)+'円')}<p class="note" style="margin-bottom:0">左が報道時、右が現在の値です。</p></div>`:'';
  const evc=n.ev&&S.events.find(e=>e.id===n.ev);
  return ['ニュース',`<div class="view" data-k="nd${id}"><div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px"><span class="tag ${({速報:'b',自社:''})[n.cat]??'g'}">${n.cat}</span>${n.lv===2?'<span class="brk-tag">CRITICAL</span>':n.lv?'<span class="tag" style="background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)">重要</span>':''}<span class="mut3" style="font-size:12px">${n.y}年${n.m}月 第${n.w}週・${wa<=0?'今週':wa+'週間前'}</span></div>
   <div style="margin-bottom:4px"><span class="lvb l${nLv(n)}">${LVN[nLv(n)]}</span> <span class="mut3" style="font-size:11px">${nGrp(n)}・${nTime(n)}配信</span></div><div style="font-size:16px;font-weight:700;line-height:1.5">${n.tn>0?'<span class="up">▲</span> ':n.tn<0?'<span class="dn">▼</span> ':''}${esc(n.title)}</div>
   ${n.body?`<p style="font-size:14px;line-height:1.75;color:var(--ink2);margin:8px 0 0">${esc(n.body)}</p>`:''}
   ${n.imp?`<h3>あなたへの影響</h3><div class="card"><ul class="impl" style="font-size:13px">${n.imp.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
   ${evc?`<div class="alert w" style="margin-top:10px"><span class="dot"></span><span>この出来事は現在「${({rumor:'兆候',active:'発生',peak:'拡大',fade:'終息へ'})[evc.stage]||'進行中'}」の段階です（ホームの「進行中の出来事」で進み具合を確認できます）。</span></div>`:''}
   ${mk}${ec}
   ${gl.map(g=>`<h3>解説：${g[1]}</h3><div class="card"><p style="margin:0;font-size:13px;line-height:1.75">${g[2]}</p></div>`).join('')}
   ${rel.length?`<h3>関連ニュース</h3><div class="nbox">${rel.map(newsRow).join('')}</div>`:''}</div>`];};}

function bkKind(n){if(n.earn)return n.earn.s>0?['📈','GOOD NEWS','gd']:['📉','BAD NEWS','bd'];if(/政策金利|中央銀行/.test(n.title))return['🏦','CENTRAL BANK','cb'];

function earnHTML(n){const e=n.earn,r=(k,v,sub)=>`<div class="fxr"><span>${k}</span><b>${v}</b>${sub?`<em style="margin:0 0 0 8px">${sub}</em>`:''}</div>`;const vs=e.eOp?e.op/e.eOp-1:null;

/* ---------- 速報バナー ---------- */
const Brk={q:[],cur:null,timer:0,
  pump(){if(!S)return;S.brk=[];return;const ids=[];if(!ids.length)return;S.brk=[];for(const id of ids){const n=S.news.find(x=>x.id===id);if(n)this.q.push(n);}if(this.q.length>5)this.q=this.q.slice(-5);if(!this.cur)this.next();else this.draw();},
  next(){this.cur=this.q.shift()||null;this.draw();clearTimeout(this.timer);clearTimeout(this.t2);if(this.cur){this.t2=setTimeout(()=>{const el=document.querySelector('#brk .bk');if(el)el.classList.add('mini');},5000);this.timer=setTimeout(()=>this.close(),this.q.length?7000:12000);}},
  close(){const el=document.querySelector('#brk .bk');if(el&&!el.classList.contains('out')){el.classList.add('out');setTimeout(()=>this.next(),250);}else if(!el)this.next();},
  clear(){this.q=[];this.cur=null;clearTimeout(this.timer);clearTimeout(this.t2);this.draw();},
  draw(){let r=document.getElementById('brk');if(!r){r=document.createElement('div');r.id='brk';document.body.appendChild(r);}const n=this.cur;
    if(!n){r.innerHTML='';return;}const cls=n.tn<0?'neg':n.tn>0?'pos':'';const ic=/急落|破綻|倒産|危機|感染|災害|地震|金融危機|地政学/.test(n.title)?'⚠️':/金利/.test(n.title)?'🏦':/急騰|ブーム|最高/.test(n.title)?'🚀':/TOB|買収|上場/.test(n.title)?'🤝':'📰';
    const same=r.firstElementChild&&r.firstElementChild.dataset.id==n.id;
    const K=bkKind(n);const html=`<div class="bk ${cls}" data-id="${n.id}" data-act="brkOpen" role="alert"><div class="bk-h"><span class="bk-l ${K[2]}"><i></i>${K[1]}</span><span>${n.y}年${n.m}月 第${n.w}週</span><button class="bk-x" data-act="brkX" aria-label="閉じる">×</button></div>
      <div class="bk-t">${K[0]||ic} ${esc(n.title)}</div>${n.earn?earnHTML(n):''}${n.body&&!n.earn?`<div style="padding:4px 12px 0;font-size:12.5px;color:var(--ink2)">${esc(n.body)}</div>`:''}${n.imp&&!n.earn?`<ul>${n.imp.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      <div class="bk-f"><span>${this.q.length?`ほかに${this.q.length}件の速報`:''}</span><span>タップで詳細</span></div>${same?'':'<div class="bk-p"></div>'}</div>`;
    if(same){const f=r.querySelector('.bk-f span');if(f)f.textContent=this.q.length?`ほかに${this.q.length}件の速報`:'';return;}r.innerHTML=html;}};

function render(){const app=$('#app');

  const v={home:vHome,me:vMe,co:vCompany,biz:vBiz,inv:vInvest,mkt:vMarket,news:vNews}[UI.tab]();
  const vk=UI.tab+(UI.tab==='co'?'-'+UI.coSeg:'')+(UI.tab==='news'?'-'+UI.newsF:'');const fm=flipCap();
  morph(app,vHeader()+`<main><div class="view" data-k="${vk}">${v}</div></main>`+vNav());app.dataset.tab=UI.tab;
  if(S.over&&!UI.overShown){UI.overShown=true;UI.sheet=shOver();}
  renderSheets();flush();tweens();flipPlay(fm);observeWP();Brk.pump();FX.drain();Tut.check();}
function flush(){if(S&&S.flash&&S.flash.length){toast(S.flash.join(' / '));S.flash=[];}}
// 月次決算が締まったら、画面中央ではなく自社名の横に小さく「決」を表示（約3秒）
function stamp(){UI.kbUntil=Date.now()+3000;clearTimeout(UI.kbT);UI.kbT=setTimeout(()=>{if(S)render();},3100);}

// 時間はプレイヤーが「時間を進める」を押したときだけ進む。進めた期間の出来事はレポートにまとめて表示する
const ADV={week:['1週間',1,'週間レポート'],month:['1ヶ月',4,'月間レポート'],half:['6ヶ月',24,'半年レポート'],year:['1年',48,'年間レポート']};
function advance(kind){if(!S||S.over||UI.busy)return;kind=ADV[kind]?kind:({quarter:'half'})[kind]||'week';UI.cdl=null;UI.busy=true;const P0=Rep.snap();
  const ov=document.createElement('div');ov.className='adv-ov';ov.innerHTML=`<div class="adv-c"><div class="adv-d">${fmtDate()}</div><div class="adv-bar"><i style="animation-duration:${kind==='week'?.45:kind==='month'?.7:1}s"></i></div><div class="mut" style="font-size:12px">${ADV[kind][0]}をシミュレーション中…</div></div>`;document.body.appendChild(ov);
  setTimeout(()=>{if(!S){ov.remove();UI.busy=false;return;}let r;try{r=Game.run(ADV[kind][1],true);}catch(e){ov.remove();UI.busy=false;throw e;}finally{UI.busy=false;}S.fx=[];S.brk=[];S.flash=[];const rep=Rep.build(P0,kind,r);S.lastRep=rep;Store.auto(true);   /* 期間を進めたら必ず保存 */
    ov.querySelector('.adv-d').textContent=`${P0.date} → ${fmtDate()}`;setTimeout(()=>{ov.remove();render();if(r.stop==='over')return;UI.sheet=shPeriod(rep);renderSheets();const b=$('#layer .sh-b');if(b)b.scrollTop=0;},RM?0:260);},RM?0:(kind==='week'?380:620));}
// 同期版（テスト・内部用）：演出なしで期間を進めてレポートを作る
function advanceNow(kind='month'){if(!S||S.over)return;const P0=Rep.snap(),r=Game.run(ADV[kind]?ADV[kind][1]:4,true);S.fx=[];S.brk=[];S.flash=[];S.lastRep=Rep.build(P0,ADV[kind]?kind:'month',r);Store.auto(true);render();return r;}
function setAuto(on){on=false;UI.auto=on;   /* 自動進行は廃止（プレイヤーが時間を進める） */clearInterval(UI.timer);UI.timer=null;
  if(on)UI.timer=setInterval(()=>{if(!S||S.over){setAuto(false);return;}if(UI.sheet2)return;const r=Game.run(1);if(UI.pref.pause&&S.brk&&S.brk.some(id=>!S.news.find(n=>n.id===id)?.earn)&&!r.stop){setAuto(false);toast('重大ニュースのため一時停止しました');}if(r.closed)stamp();render();if(r.stop){setAuto(false);if(r.stop!=='over')toast(r.stop);render();}},Math.round(1200/UI.speed));}

  coSeg:d=>{UI.coSeg=d.v;UI.tab='co';closeSheet();render();},sv:d=>{UI.sv=d.v;renderSheets();const b=$('#layer .sh-b');if(b)b.scrollTop=0;},eqRange:d=>{UI.eqRange=+d.v;UI.cdl=null;render();},
  ipoPct:d=>{UI.ipo.pct=+d.v;render();},ipoDisc:d=>{UI.ipo.disc=+d.v;render();},
  ipoGo:()=>{const P=Eq.ipoPlan(UI.ipo.pct,UI.ipo.disc);approveBox({kind:'ipo',title:'新規上場（IPO）の実施',amount:0,rows:[['起案','経営企画部・主幹事証券'],['公開価格',nf(P.px)+'円'],['発行株数',nf(P.newQ)+'株'],['手取り調達額',yen(P.net)+'円'],['上場時の時価総額',yen(P.cap)+'円'],['上場後の社長持株',pctp(P.founder,1),P.founder<.5?'dn':'']],note:'上場後は株価が毎週動き、四半期ごとに決算を発表し、毎年6月に株主総会が開かれます。社長の持株が50%を下回ると、解任や敵対的買収のリスクが生まれます。',

  eqPO:d=>{const P=Eq.poPlan(+d.v);confirmBox(`新株${nf(P.n)}株を1株${nf(P.px)}円で発行し、約${yen(P.net)}円を調達します。株価と社長の持株比率は下がります。`,()=>{if(!err(Eq.po(+d.v)))toast('増資しました');render();},'増資する');},
  reMkt:()=>openSheet(shReMkt()),reItem:d=>openSheet(shReItem(d.v)),prop:d=>openSheet(shProp(d.v)),ltv:d=>{UI.ltv=+d.v;renderSheets();},
  reBuy:d=>{const p=S.reMkt.find(x=>x.id===d.v);if(!p)return;const P=Prop.plan(p,UI.ltv);confirmBox(`${p.city}の${PT[p.type].n}を${yen(p.price)}円で購入します。現金${yen(P.cash)}円${P.loan?`＋ローン${yen(P.loan)}円`:''}。`,()=>{if(!err(Prop.buy(d.v,UI.ltv))){closeSheet();UI.tab='inv';toast('物件を取得しました');}render();},'購入する');},
  reSell:d=>{const p=S.props.find(x=>x.id===d.v);const Q=Prop.sellQuote(p);confirmBox(`この物件を約${yen(Q.v)}円で売却します（損益 ${yen(Q.gain)}円）。`,()=>{if(!err(Prop.sell(d.v))){closeSheet();toast('売却しました');}render();},'売却する',true);},mktRange:d=>{UI.mktRange=+d.v;UI.cdl=null;render();},
  tobOpen:d=>{const c=CM[d.t];if(!c)return;UI.tob.prem=clamp(Math.round((MA.target(c)/c.price-1+.2)*10)/10,.1,.7);if(![.1,.2,.3,.4,.5,.7].includes(UI.tob.prem))UI.tob.prem=.3;openSheet(shTOB(d.t));},
  tobR:d=>{UI.tob.ratio=+d.v;renderSheets();},tobP:d=>{UI.tob.prem=+d.v;renderSheets();},
  tobGo:d=>{const c=CM[d.t],p=MA.plan(d.t,UI.tob.ratio,UI.tob.prem);approveBox({kind:'ma',title:`${c.name}に対する公開買付け（TOB）`,amount:p.total,rows:[['起案','経営企画部'],['対象会社',esc(c.name)+`（${SECTORS[c.sec].n}）`],['買付価格',nf(p.px)+'円（プレミアム '+pctp(UI.tob.prem,0)+'）'],['取得目標',pctp(UI.tob.ratio,1)],['必要資金',yen(p.total)+'円'],['対象の年商',yen(c.rev)+'円'],['対象の営業利益率',pctp(c.opm,0)]],note:'結果は今月末に判明します。取締役会の反応と応募状況によっては不成立となり、手数料の一部は戻りません。',ok:()=>{if(!err(MA.launch(d.t,UI.tob.ratio,UI.tob.prem))){openSheet(shStock(d.t));toast('TOBを開始しました');}render();}});},
  tobCancel:()=>confirmBox('TOBを撤回します。アドバイザー費用の一部は戻りません。',()=>{err(MA.cancel());render();},'撤回する',true),
  maStrat:d=>{err(MA.setStrat(d.t,d.v));render();},maPay:d=>{err(MA.setPay(d.t,+d.v));render();},
  maDiv:d=>confirmBox(`${CM[d.t].name}から特別配当を受け取ります。`,()=>{err(MA.specialDiv(d.t));render();}),
  maGrow:d=>confirmBox(`${CM[d.t].name}に${yen(MA.growCost(CM[d.t]))}円の成長投資を指示します（子会社の資金から支出）。`,()=>{if(!err(MA.grow(d.t)))toast('成長投資を指示しました');render();}),
  maRs:d=>confirmBox(`${CM[d.t].name}でリストラを実施します。人員を15%削減し、費用${yen(MA.rsCost(CM[d.t]))}円がかかります。`,()=>{if(!err(MA.restructure(d.t)))toast('リストラを指示しました');render();},'実施する',true),
  maSq:d=>{const p=MA.sqPlan(d.t);confirmBox(`残り${nf(p.need)}株を1株${nf(p.px)}円で取得し、${CM[d.t].name}を上場廃止します。約${yen(p.total)}円。`,()=>{if(!err(MA.squeeze(d.t)))toast('完全子会社化しました');render();});},
  eqSp:d=>confirmBox(`1株を${d.v}株に分割します。時価総額は変わりません。`,()=>{if(!err(Eq.splitNow(+d.v)))toast('株式分割しました');render();}),
  eqMBO:()=>{const P=Eq.mboPlan();approveBox({kind:'mbo',title:'MBOによる株式の非公開化',amount:P.cost,rows:[['起案','社長室'],['買取価格',nf(P.px)+'円（プレミアム30%）'],['買取株数',nf(P.out)+'株'],['必要資金',yen(P.cost)+'円'],['実施後の社長持株','100%']],note:'上場廃止となり、株価・配当・株主総会はなくなります。市場からの資金調達もできなくなります。',ok:()=>{if(!err(Eq.mbo()))toast('非公開化しました');render();}});},
  maAbs:d=>{const c=CM[d.t];approveBox({kind:'ma',title:`完全子会社 ${c.name} の吸収合併`,amount:0,rows:[['起案','経営企画部'],['対象',esc(c.name)],['年商',yen(c.rev)+'円'],['引き継ぐ現金',yen(c.cash)+'円'],['引き継ぐ借入',yen(c.debt)+'円'],['従業員',nf(c.emp)+'人']],note:'合併後は本体の事業部となり、損益は単体の決算に直接入ります。元には戻せません。',ok:()=>{if(!err(MA.absorb(d.t))){closeSheet();toast('吸収合併しました');}render();}});},
  maSell:d=>{if(!CM[d.t]||Trade.own(d.t)<=.5)return toast('子会社ではありません');const q=MA.saleQuote(d.t);confirmBox(`${CM[d.t].name}の株式${nf(q.q)}株を${q.buyer?q.buyer.name:'投資ファンド'}へ約${yen(q.total)}円で売却します。子会社ではなくなります。`,()=>{if(!err(MA.sell(d.t))){closeSheet();toast('売却しました');}render();},'売却する',true);},
  offerY:d=>{const o=S.offers[+d.v];if(!o)return;const q=S.hold[o.t]?.q||0;confirmBox(`買収提案に応じ、保有株を約${yen(q*o.px)}円で売却します。`,()=>{if(!err(MA.accept(+d.v))){toast('提案に応じました');if(UI.sheet)closeSheet();}render();},'応じる');},
  offerN:d=>{err(MA.rejectI(+d.v));toast('提案を拒否しました');render();},
  auto:()=>{setAuto(!UI.auto);render();},
  speed:()=>{const s=[1,2,5,10];UI.speed=s[(s.indexOf(UI.speed)+1)%4];if(UI.auto)setAuto(true);render();},
  setSpeed:d=>{UI.speed=+d.v;if(UI.auto)setAuto(true);render();},
  biz:d=>openSheet(shBiz(d.id)),newbiz:()=>openSheet(shNewBiz()),newBiz:()=>openSheet(shNewBiz()),   /* 新規事業ボタン（表記ゆれ対応） */
  bPrice:d=>{Biz.setPrice(S.biz.find(b=>b.id===d.id),+d.v);render();},
  bAd:d=>{Biz.setAd(S.biz.find(b=>b.id===d.id),+d.v);render();},
  bRd:d=>{Biz.setRd(S.biz.find(b=>b.id===d.id),+d.v);render();},
  bHire:d=>{const b=S.biz.find(x=>x.id===d.id),n=+d.v,b0=b.staff;if(!err(Biz.hire(b,n))&&n>0)FX.hire(b,n,b0);render();},
  bOpen:d=>{const b=S.biz.find(x=>x.id===d.id);confirmBox(`${BT[b.type].locN}を追加します。${yen(Biz.openCost(b))}円を支払います。`,()=>{if(!err(Biz.openLoc(b)))toast(`${BT[b.type].locN}を追加しました`);render();});},
  bClose:d=>{const b=S.biz.find(x=>x.id===d.id);confirmBox(`${BT[b.type].locN}を1つ閉鎖します。${BT[b.type].reAsset?'物件は時価で売却されます。':'設備の多くは損失になります。'}`,()=>{if(!err(Biz.closeLoc(b)))toast('閉鎖しました');render();},'閉鎖する',true);},
  bEquip:d=>{const b=S.biz.find(x=>x.id===d.id);confirmBox(`設備をLv${b.equip+1}にします。${yen(Biz.equipCost(b))}円を支払います。`,()=>{if(!err(Biz.upgrade(b)))toast('設備投資を実行しました');render();});},
  bExit:d=>{const b=S.biz.find(x=>x.id===d.id);approveBox({kind:'exit',title:`${BT[b.type].n}事業からの撤退`,amount:0,rows:[['起案','経営企画部'],['直近の営業利益',yen(b.last?.op||0)+'円',tone(b.last?.op||0)],['従業員',nf(b.staff)+'人'],['固定資産',yen(b.fixedAssets)+'円'],['退職金など',yen(b.staff*Biz.sal(b))+'円']],note:'資産は売却し、従業員には退職金を支払います。撤退後は事業枠が空きます。',
    ok:()=>{Biz.exit(b);closeSheet();render();toast('撤退しました');}});},
  startBiz:d=>{const t=BT[d.v],c=t.start*S.econ.pIdx*(t.reAsset?S.econ.reIdx:1);
    if(S.biz.length>=Co.slots())return toast('事業枠が足りません。累計売上が増えると枠が広がります');if(!Co.unlocked(d.v))return toast('この事業はまだ解禁されていません');if(S.co.cash<c)return toast('現金が不足しています');
    approveBox({kind:'biz',title:`${t.n}事業への新規参入`,amount:c,rows:[['起案','経営企画部'],['投資額',yen(c)+'円'],['資金の出どころ','手元資金'],['想定の立ち上がり','初年度は赤字、軌道に乗るまで数ヶ月'],['事業枠',`${S.biz.length+1} / ${Co.slots()}`]],note:`${t.n}事業は${t.locCap?'拠点を増やして':'需要に合わせて'}育てていきます。参入後は価格・広告・研究開発・人員を自分で調整できます。`,
    ok:()=>{if(!err(Biz.start(d.v))){closeSheet();UI.tab='biz';render();toast(`${t.n}事業を立ち上げました`);}}});},
  stock:d=>{if(!asset(d.t)){toast('この銘柄はすでに上場廃止されています');return;}if(UI.trade.t!==d.t){UI.trade.q=asset(d.t).fund?10:100;UI.cdl=null;}UI.trade.t=d.t;openSheet(shStock(d.t));},
  range:d=>{UI.trade.range=+d.v;UI.cdl=null;renderSheets();},
  tq:d=>{UI.trade.q=+d.v;renderSheets();},
  tqMax:d=>{if(UI.acct==='me'){const a2=asset(d.t);UI.trade.q=Math.max(100,Math.floor(Me.st().cash/(a2.price*1.001)/100)*100);return renderSheets();}UI.trade.q=Math.max(Trade.lot(asset(d.t)),Trade.maxBuy(d.t));renderSheets();},
  acct:d=>{UI.acct=d.v;renderSheets();},
  buy:d=>{const a=asset(d.t),q=UI.trade.q,o=Trade.quote(d.t,q,'buy'),pers=UI.acct==='me';
    confirmBox(`${pers?'個人の資金で':'会社の資金で'}${a.name}を${nf(q)}${a.fund?'口':'株'}、約${yen(o.total)}円で買います。`,()=>{const e=pers?Me.buy(d.t,q):Trade.buy(d.t,q);if(!err(e))FX.trade('buy',a,q,o.total/q,o.total);render();});},
  sell:d=>{const pers=UI.acct==='me',hold=pers?(Me.st().hold[d.t]?.q||0):(S.hold[d.t]?.q||0),a=asset(d.t),q=Math.min(UI.trade.q,hold),o=Trade.quote(d.t,q,'sell');
    confirmBox(`${pers?'個人の保有から':'会社の保有から'}${a.name}を${nf(q)}${a.fund?'口':'株'}、約${yen(o.total)}円で売ります。`,()=>{const e=pers?Me.sell(d.t,q):Trade.sell(d.t,q);if(!err(e))FX.trade('sell',a,q,o.total/q,o.total);render();});},
  borrow:d=>{const a=+d.v;confirmBox(`${yen(a)}円を金利${pctp(Co.rate()/100,2)}で借ります。毎月${yen(a/60)}円＋利息を返済します。`,()=>{if(!err(Co.borrow(a)))toast('借入を実行しました');render();});},
  repay:d=>{const l=S.co.loans.find(x=>x.id===d.id);confirmBox(`残高${yen(l.bal)}円を一括返済します。`,()=>{if(!err(Co.repay(d.id)))toast('返済しました');render();});},
  mktSec:d=>{UI.mkt.sec=UI.mkt.sec===d.v?'all':d.v;UI.mkt.n=40;render();},mktMore:()=>{UI.mkt.n+=40;render();},
  save:d=>{const ok=Store.save(d.v);
    if(ok)toast(`✓ 保存しました：${S.player.name}・${S.y}年${S.m}月（${Math.round(Store.lastSize/1024)}KB）`);
    else toast(Store.lastErrName.indexOf('Quota')>=0?'⚠ 保存容量を超えています。不要なスロットを削除してください':Store.lastErrName==='Unavailable'?'⚠ このブラウザでは保存機能を使えません（プライベートブラウジングなど）':'⚠ 保存できませんでした（'+Store.lastErrName+'）');
    renderSheets();},
  saveDebug:()=>{toast('コンソールに出力しました');Store.debug();},
  load:d=>{if(Store.read(d.v)&&Store.read(d.v).__corrupt){toast('⚠ このセーブデータは破損しているため読み込めません');return;}const go=()=>{setAuto(false);if(Store.load(d.v)){UI.overShown=false;UI.sheet=null;UI.tab='home';render();toast('読み込みました');}else toast('読み込めませんでした');};S&&!S.over?confirmBox('現在の進行状況は保存されていない場合、失われます。読み込みますか？',go,'読み込む'):go();},
  delSlot:d=>confirmBox(`スロット${d.v}を削除します。`,()=>{Store.del(d.v);renderSheets();},'削除する',true),
  export:()=>openSheet(shExport()),importOpen:()=>openSheet(shImport()),
  copyEx:()=>{const t=$('#exTxt');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('コピーしました'),()=>{document.execCommand('copy');toast('コピーしました');});}catch(e){document.execCommand('copy');toast('コピーしました');}},
  doImport:()=>{try{let o=JSON.parse($('#imTxt').value);if(o&&o.app==='CAPITAL'&&o.state)o=o.state;   /* 新旧どちらの書き出し形式も読める */
    if(Store.apply(o)){UI.sheet=null;UI.overShown=false;render();Store.auto(true);toast('読み込みました');}else toast('データの形式が正しくありません');}catch(e){console.error('[CAPITAL IMPORT ERROR]',e);toast('データの形式が正しくありません（文字列が途中で切れていないか確認してください）');}},
  theme:d=>{if(d.v==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=d.v;try{localStorage.setItem('capital.theme',d.v);}catch(e){}renderSheets();},
  reset:()=>confirmBox('タイトルに戻ります。オートセーブと保存済みスロットは残ります。',()=>{setAuto(false);S=null;UI.sheet=null;UI.overShown=false;render();},'戻る'),
  retry:()=>{const cfg=S.cfg;setAuto(false);Game.newGame(cfg);UI.sheet=null;UI.overShown=false;UI.tab='home';render();toast('新しい市場で再挑戦');},
  ngLogo:d=>{UI.ng.logo=d.v;render();},ngColor:d=>{UI.ng.color=d.v;render();},ngCity:d=>{UI.ng.city=d.v;render();},ngDiff:d=>{UI.ng.diff=d.v;render();},ngType:d=>{UI.ng.type=d.v;render();},
  ngStart:()=>{const g=UI.ng;if(!g.name.trim())return toast('会社名を入力してください');if(!g.ceo.trim())return toast('社長名を入力してください');
    Game.newGame({...g,name:g.name.trim(),ceo:g.ceo.trim()});UI.tab='home';UI.overShown=false;S.tut={step:0,done:false};render();Store.auto(true);}   /* 起業したらすぐ保存 */
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.self&&e.target!==el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset);}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();}if(e.key==='Escape'){if(UI.sheet2)A.close2();else if(UI.sheet)closeSheet();}});
document.addEventListener('input',e=>{const k=e.target.dataset?.inp;if(!k)return;const v=e.target.value;
  if(k==='ngname')UI.ng.name=v;else if(k==='ngceo')UI.ng.ceo=v;
  else if(k==='mfName'){UI.mfName=v;}
    else if(k==='bq'){UI.bq=v;UI.bn=24;render();}
    else if(k==='nYM'){UI.nYM=v;render();}
    else if(k==='mq'){UI.mkt.q=v;UI.mkt.n=40;const l=$('#mlist');if(l)morph(l,mktList());}
  else if(k==='tq'){const n=parseInt(v,10);if(n>0)UI.trade.q=n;}});
document.addEventListener('change',e=>{const k=e.target.dataset?.inp;if(k==='msec'){UI.mkt.sec=e.target.value;UI.mkt.n=40;render();}else if(k==='msort'){UI.mkt.sort=e.target.value;render();}else if(k==='tq'){renderSheets();}});

/* ---------- boot ---------- */
// 最後の安全網：離脱時・バックグラウンド移行時にも保存する
window.addEventListener('beforeunload',()=>{try{if(S&&!S.over)Store.auto(true);}catch(e){}});
document.addEventListener('visibilitychange',()=>{try{if(document.visibilityState==='hidden'&&S&&!S.over)Store.auto(true);}catch(e){}});
window.addEventListener('pagehide',()=>{try{if(S&&!S.over)Store.auto(true);}catch(e){}});
try{const th=localStorage.getItem('capital.theme');if(th&&th!=='auto')document.documentElement.dataset.theme=th;const pf=JSON.parse(localStorage.getItem('capital.prefs')||'null');if(pf)Object.assign(UI.pref,pf);}catch(e){}
render();
</script>
