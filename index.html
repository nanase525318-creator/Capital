      <div class="box"><h4>経済ニュース</h4><ul class="news">${sec.map((n) => `<li><b>${n.y}.${String(Math.max(1, n.m)).padStart(2, '0')}</b><span class="${n.tone === 'good' ? 'up' : n.tone === 'bad' ? 'down' : ''}">${esc(n.text)}</span></li>`).join('') || '<li>大きなニュースはありません。</li>'}</ul></div>`;
  }
  // acquired company detail
  function subDetail(x) {
    const a = x.acq || {}, parent = S.businesses.find((p) => p.id === x.parentId), L = x.last, op = LC.bizOperatingProfit(x), H = x.hist2 || [];
    const myVal = x.parentStake * x.valuation, gain = myVal - (a.paid || 0);
    const issues = S.history.filter((h) => h.cat === 'biz' && (h.desc || '').includes(x.name) && /統合|PMI|退職|文化|相乗|不振/.test(h.title + h.desc)).slice(-8).reverse();
    let html = `<button class="btn sm" data-act="subBack">← ${esc(parent ? parent.name : '会社')}に戻る</button>
      <div class="box"><h4>${esc(x.name)}<span class="tag biz">${LC.INDUSTRIES[x.industry].label}・持分${Math.round(x.parentStake * 100)}%</span></h4>
      <div class="kpis">${kpi('売上（年換算）', Y(x.revenueRun))}${kpi('営業利益（前期）', op != null ? LC.signedYen(op) : '—', '', op != null && op < 0 ? 'bad' : '')}${kpi('現金', Y(x.cash), `借入 ${Y(x.debt)}`)}${kpi('企業価値', Y(x.valuation), `持分の価値 ${Y(myVal)}`, 'gold')}</div></div>`;
    html += `<div class="box"><h4>概要</h4>${kv([['創業', (a.founded || x.foundedYear) + '年'], ['立ち位置', esc(a.position || '—')], ['主力', esc(a.product || '—')], ['顧客', esc(a.clients || '—')], ['社員', x.employees + '人'], ['買収', a.year ? `${a.year}年・${Y(a.price)}（${Math.round((a.stake || x.parentStake) * 100)}%）` : '—'], ['買収時の企業価値', a.startValue ? Y(a.startValue) : '—'], ['統合費用', a.integration ? Y(a.integration) : '—'], ['買収前の調査', a.dd ? '実施した' : '実施しなかった'], ['投資額（累計）', Y(a.paid || 0)], ['持分の評価差', `<span class="${gain >= 0 ? 'up' : 'down'}">${LC.signedYen(gain)}</span>`, 'sum']])}</div>`;
    html += L ? `<div class="box"><h4>${L.year}年の業績</h4>${kv(plRows(L))}</div>` : '';
    if (H.length > 1) html += `<div class="box"><h4>買収後の推移</h4>${svgBars({ labels: H.map((h) => String(h.y)), series: [{ name: '売上', color: 'var(--blue)', values: H.map((h) => h.rev) }, { name: '営業利益', color: 'var(--good)', neg: 'var(--bad)', values: H.map((h) => h.op) }] })}${svgLine({ labels: H.map((h) => String(h.y)), series: [{ name: '企業価値', color: 'var(--pink)', values: H.map((h) => h.value) }, { name: '現金', color: 'var(--gold)', values: H.map((h) => h.cash) }], h: 130 })}</div>`;
    else html += `<p class="hint">推移のグラフは決算を重ねると表示されます。</p>`;
    html += `<div class="box"><h4>経営施策</h4><div class="btn-row"><button class="btn sm" data-act="hire" data-v="${x.id}" data-k="3">3人採用</button><button class="btn sm" data-act="hire" data-v="${x.id}" data-k="-1" ${x.employees > 1 ? '' : 'disabled'}>1人減らす</button></div>
      <div class="form"><div class="two"><label>広告費（年）<select id="ads_${x.id}" data-act="bizAds" data-v="${x.id}">${[0, 0.02, 0.05, 0.1].map((r) => { const v = Math.round(Math.max(x.revenueRun, 5e6) * r); return `<option value="${v}" ${Math.abs(x.ads - v) < 2 ? 'selected' : ''}>${r ? `売上の${r * 100}%` : 'なし'}</option>`; }).join('')}${![0, 0.02, 0.05, 0.1].some((r) => Math.abs(x.ads - Math.round(Math.max(x.revenueRun, 5e6) * r)) < 2) ? `<option value="${x.ads}" selected>現在 ${Y(x.ads)}</option>` : ''}</select></label>
      <label>研究開発費（年）<select id="rnd_${x.id}" data-act="bizRnd" data-v="${x.id}">${[0, 0.02, 0.05].map((r) => { const v = Math.round(Math.max(x.revenueRun, 5e6) * r); return `<option value="${v}" ${Math.abs((x.rnd || 0) - v) < 2 ? 'selected' : ''}>${r ? `売上の${r * 100}%` : 'なし'}</option>`; }).join('')}</select></label></div>
      <div class="two"><label>金額（${curName()}）<input id="amt_${x.id}" type="number" inputmode="numeric" step="any" min="0" value="${ui.bizAmt && ui.bizAmt[x.id] || niceBase(5000000)}"></label><span></span></div>
      <div class="btn-row"><button class="btn sm" data-act="capex" data-v="${x.id}">設備投資</button><button class="btn sm" data-act="repay" data-v="${x.id}" ${x.debt > 0 ? '' : 'disabled'}>借入を返済</button></div></div></div>`;
    html += `<div class="box"><h4>統合（PMI）の課題</h4>${a.issue ? `<p>買収後に分かった問題：${esc(a.issue)}</p>` : ''}${issues.length ? `<ul class="news">${issues.map((h) => `<li><b>${h.year}</b><span class="${h.tone === 'good' ? 'up' : h.tone === 'bad' ? 'down' : ''}">${esc(h.title)}：${esc(h.desc)}</span></li>`).join('')}</ul>` : '<p>いまのところ大きな課題は起きていません。買収から3年ほどは、人材の流出・システム統合・文化の違いなどの課題が出来事として起きることがあります。</p>'}</div>`;
    const st = x.parentStake;
    html += `<div class="box"><h4>持分の管理</h4>${kv([['いまの持分', Math.round(st * 100) + '%'], ['持分の価値', Y(myVal)]])}
      <div class="btn-row">${[0.67, 0.8, 1].filter((t) => t > st + 0.001).map((t) => `<button class="btn sm" data-act="stake" data-v="${x.id}" data-k="${t}">${Math.round(t * 100)}%まで買い増す（約${Y((t - st) * x.valuation * 1.12)}）</button>`).join('')}</div>
      <div class="btn-row"><button class="btn sm" data-act="sellSub" data-v="${x.id}" data-k="0.5">半分を売却</button>${confirmBtn('sellSubAll', x.id, 'すべて売却', `全株を売却（約${Y(myVal)}）`)}</div>
      <p class="hint">買い増しの代金と売却代金は親会社（${esc(parent ? parent.name : '')}）の現金で受け渡しします。あなた個人のお金は動きません。</p></div>`;
    return html;
  }

  // ======================= fusion update: life map, peers, milestones, auto decisions, closing film =======================
  const ARROW = (v) => (v > 0 ? '↑' : '↓');
  const FX_SHORT = { health: '健康', happiness: '幸福', knowledge: '知識', relations: '人間関係', stress: 'ストレス', selfControl: '自制', finLit: '金融', workSkill: '仕事' };
  function focusHint(k) {
    const d = LC.FOCUS[k] && LC.FOCUS[k].d; if (!d) return '';
    return Object.keys(d).filter((x) => FX_SHORT[x] && Math.abs(d[x]) >= 1).sort((a, b) => Math.abs(d[b]) - Math.abs(d[a])).slice(0, 2).map((x) => `${FX_SHORT[x]}${x === 'stress' ? (d[x] > 0 ? '↑' : '↓') : ARROW(d[x])}`).join(' ');
  }
  // ---- 人生地図: one square per year
  function mapGrid(big) {
    const M = LC.lifeMap(S), mode = ui.mapMode || 'hp', byAge = {}; for (const c of M.cells) byAge[c.a] = c;
    const rows = []; const last = Math.ceil((M.span + 1) / 10) * 10;
    for (let d = 0; d < last; d += 10) {
      let cells = '';
      for (let a = d; a < d + 10; a++) {
        const c = byAge[a], past = c && (a < M.current || S.over && a <= M.current), cur = a === M.current && !S.over;
        const v = c ? (mode === 'w' ? c.w : c.hp) : null, alpha = v == null ? 0 : 0.15 + 0.85 * Math.max(0, Math.min(100, v)) / 100;
        const bg = past && v != null ? `background:rgba(${mode === 'w' ? '231,194,106' : '91,191,178'},${alpha.toFixed(2)})` : '';
        const icon = c && c.icons.length ? c.icons[0] : '';
        cells += `<i class="mc ${past ? 'past' : ''} ${cur ? 'cur' : ''} ${a === M.expect ? 'exp' : ''} ${c && c.fav ? 'fav' : ''}" style="${bg}" title="${a}歳${c && c.icons.length ? '・' + c.icons.join('') : ''}">${esc(icon)}</i>`;
      }
      rows.push(`<div class="mrow"><span class="mlab">${d}</span>${cells}</div>`);
    }
    return `<div class="lifemap ${big ? 'big' : ''}">${rows.join('')}</div>
      <p class="hint">1マス＝1年 · 濃いほど${mode === 'w' ? '財産に余裕があった' : '幸福だった'}年 · 金の枠＝平均寿命（${M.expect}歳・ゲーム内の推計） · ★＝☆を付けた思い出<br>学 入学　職 就職　婚 結婚　子 子ども　家 住まい　起 起業　上 上場　¥ 1億・FIRE　病 病気　別 別れ　落 失業・倒産</p>`;
  }
  function renderMap() {
    const el = $('#secMap'); if (!el || !S) return;
    const mode = ui.mapMode || 'hp';
    el.innerHTML = `<div class="card-head"><h3>人生地図</h3><div class="log-tools"><button class="chip-btn ${mode === 'hp' ? 'on' : ''}" data-act="mapMode" data-v="hp">幸福</button><button class="chip-btn ${mode === 'w' ? 'on' : ''}" data-act="mapMode" data-v="w">財産</button></div></div>${mapGrid(false)}`;
  }
  // ---- peers born on the same day
  function rivalRows() {
    const R = LC.cohortRanking(S);
    return `<ol class="rivals">${R.map((x) => `<li class="${x.me ? 'me' : ''} ${x.alive ? '' : 'gone'}"><span class="rk">${x.rank}</span><span class="nm">${esc(x.name)}${x.me ? '<b>（あなた）</b>' : ''}<small>${x.me ? esc(x.job) : `${esc(x.pref)} · ${esc(x.job)}${x.married ? ' · 既婚' : ''}${x.kids ? ` · 子${x.kids}` : ''}`}</small></span><span class="nw num">${Y(x.net)}</span></li>`).join('')}</ol>`;
  }
  function renderRivals() {
    const el = $('#secRivals'); if (!el || !S || !S.rivals) return;
    const recent = S.history.filter((h) => h.rival).slice(-2).reverse();
    el.innerHTML = `<div class="card-head"><h3>同じ日に生まれた人たち</h3><span class="hint">純資産（今の価値）の順</span></div>${rivalRows()}
      ${recent.length ? `<ul class="news rv-news">${recent.map((h) => `<li><b>${h.age}歳</b><span class="${h.tone === 'good' ? 'up' : h.tone === 'bad' ? 'down' : ''}">${esc(h.desc)}</span></li>`).join('')}</ul>` : ''}`;
  }
  // ---- decisions: peek and auto
  function autoBar() {
    const cur = S.flags.auto;
    return `<div class="auto-bar">${cur ? `<span>おまかせ中：<b>${LC.AUTO_STYLES[cur]}</b></span><button class="btn sm" data-act="auto" data-v="">自分で選ぶ</button>` : `<span class="hint">これからの決断をおまかせ：</span>${Object.keys(LC.AUTO_STYLES).map((k) => `<button class="btn sm" data-act="auto" data-v="${k}">${LC.AUTO_STYLES[k]}</button>`).join('')}`}</div>`;
  }
  function peekLayer(v) {
    const layer = $('#eventLayer');
    layer.className = 'event peek'; layer.innerHTML = `<button class="peek-bar" data-act="unpeek"><span class="tag">決断待ち</span><b>${esc(v.title)}</b><span>タップで戻る ▴</span></button>`;
  }
  let autoT = 0;
  function autoStep(dt) {
    if (!S || S.over || !S.flags.auto || !S.events.active || ui.sheet || ui.peek || ui.mode !== 'main') { autoT = 0; return; }
    autoT += dt; if (autoT < 0.9) return; autoT = 0;
    const i = LC.autoPick(S, S.flags.auto); if (i < 0) return;
    const r = LC.chooseEvent(S, i, false, S.events.active.n);
    if (r.ok && r.outcome) showOutcome(Object.assign({}, r.outcome, { title: r.outcome.title + '（おまかせ）' }));
    shownEvent = null; renderEvent();
  }
  // ---- the closing film of a life
  const END = { steps: [], i: 0, t: null };
  function startEnding(replay) {
    const F = LC.lifeFacts(S), H = LC.lifeHighlights(S), P = LC.P(S), snaps = (S.snaps || []).slice().sort((a, b) => a.age - b.age), ev = (S.summary && S.summary.eval) || LC.evaluateLife(S);
    const endSnap = snaps.length ? snaps.length - 1 : -1, days = Math.round(F.age * 365.25);
    END.snaps = snaps;
    END.steps = [{ k: 'title', html: `<h2>最後の年、${F.age}歳</h2><p>${esc(LC.country(S).name)}で、静かに息を引き取りました。</p><p>最後の言葉は「${esc(F.words)}」でした。</p><p>これまでの日々が、ひとつずつ思い出されてきます。</p>`, dur: 4200 }]
      .concat(H.map((h) => ({ k: 'slide', snap: h.snap, html: `<p class="e-age">${h.age}歳${h.fav ? ' ★' : ''}</p><p class="e-cap">${esc(h.title)}</p><p class="e-desc">${esc(h.desc.length > 70 ? h.desc.slice(0, 70) + '…' : h.desc)}</p>`, dur: 2900 })))
      .concat([{ k: 'slide', snap: endSnap, html: `<p class="e-cap">${esc(F.mourners.text)}が、最後の旅立ちを見送りました。</p>`, dur: 3600 },
        { k: 'epitaph', html: `<h2 class="e-name">${esc(P.name)}</h2><p class="e-years">${P.birthYear} – ${S.time.year}</p><p>${esc(LC.country(S).name)}に生まれ、${F.age}年、日数にすると約${days.toLocaleString('ja-JP')}日を生きました。</p><p>同じ年に生まれた人の約${F.outlived}%より長く生きました（ゲーム内の推計）。</p>
          <div class="end-rank"><span class="rank-big r-${ev.rank.rank}">${ev.rank.rank}</span><span>総合 ${ev.total}点 · ${esc(ev.rank.label)}</span></div>
          <p class="e-one">ただ一度きりの、あなただけの人生でした。</p>
          <div class="btn-row"><button class="btn primary" data-act="endHistory">人生ヒストリーを見る</button><button class="btn" data-act="endSkip">閉じる</button></div>`, dur: 0 }]);
    END.i = 0; const el = $('#ending'); el.hidden = false; showEndStep(); void replay;
  }
  function showEndStep() {
    const el = $('#ending'), st = END.steps[END.i]; clearTimeout(END.t); if (!st) return endingFinish();
    const prog = Math.round(END.i / Math.max(1, END.steps.length - 1) * 100);
    el.innerHTML = `<div class="end-in ${st.k}" data-act="${st.k === 'epitaph' ? '' : 'endNext'}">${st.k === 'slide' && st.snap >= 0 ? `<canvas class="end-cv" width="${176 * 3}" height="${146 * 3}"></canvas>` : ''}<div class="end-txt">${st.html}</div>
      ${st.k !== 'epitaph' ? `<div class="end-prog"><i style="width:${prog}%"></i></div><button class="end-skip" data-act="endSkip">スキップ</button>` : ''}</div>`;
    if (st.k === 'slide' && st.snap >= 0) { const cv = el.querySelector('canvas'); const x = END.snaps[st.snap]; if (cv && x) Scene.snapshot(cv, x.m); }
    if (st.dur) END.t = setTimeout(endingNext, st.dur);
  }
  function endingNext() { END.i++; if (END.i >= END.steps.length) END.i = END.steps.length - 1; showEndStep(); }
  function endingFinish() { clearTimeout(END.t); const el = $('#ending'); el.hidden = true; el.innerHTML = ''; }
  // extra blocks used by the history sheet, goals and money card
  function historyFacts() {
    const F = LC.lifeFacts(S), goals = (S.goalLog || []), notes = (S.notes || []);
    let html = `<div class="box"><h4>この人生について</h4>${kv([['いちばん幸せだった年', F.happiest ? `${F.happiest.age}歳（${F.happiest.year}年）` : '—'], ['大人になってから時間を注いだこと', F.focus.join('、') || '—'], S.over && ['最期を見送った人', esc(F.mourners.text)], S.over && ['亡くなった理由', esc(F.cause)], ['平均寿命（ゲーム内の推計）', `${F.expect}歳`], S.over && ['同じ年に生まれた人と比べて', `約${F.outlived}%より長く生きた`]])}</div>`;
    if (S.rivals) html += `<div class="box"><h4>同じ日に生まれた人たち</h4>${rivalRows()}</div>`;
    if (goals.length) html += `<div class="box"><h4>節目で決めた目標</h4><ul class="news">${goals.map((g) => `<li><b>${g.from}→${g.to}歳</b><span class="${g.done ? 'up' : ''}">${g.done ? '達成' : '未達'}：${esc(g.label)}</span></li>`).join('')}</ul></div>`;
    if (notes.length) html += `<div class="box"><h4>書き残した思い</h4><ul class="news">${notes.map((n) => `<li><b>${n.age}歳</b><span>「${esc(n.text)}」</span></li>`).join('')}</ul></div>`;
    return html;
  }
  function goalBox() {
    const g = S.goal10; const next = LC.MILESTONE_AGES.find((x) => x > LC.playerAge(S));
    if (!g || g.judged) return `<div class="box"><h4>10年目標</h4><p>${next ? `${next}歳の節目で次の目標を決められます。` : 'これからは自由に過ごしましょう。'}達成した目標：${S.goalsDone || 0}回</p></div>`;
    const p = LC.goalProgress(S, g);
    return `<div class="box"><h4>10年目標<span class="hint">${g.until}歳で判定</span></h4><p><b>${esc(g.label)}</b></p><p>いま：${p ? esc(p.show) : '—'} ${p && p.done ? '<span class="up">（達成ライン）</span>' : ''}</p><p class="hint">達成した目標：${S.goalsDone || 0}回</p></div>`;
  }
  function peerLine() {
    if (!LC.isIndependent(S) || LC.playerAge(S) < 18) return '';
    const b = LC.budget(S), bs = LC.balanceSheet(S);
    return `<p class="peer">同い年の中で：純資産 <b>${LC.topText(LC.peerTop(S, 'net', bs.net))}</b> · 年収 <b>${LC.topText(LC.peerTop(S, 'income', b.totalIncome))}</b><span class="hint">（ゲーム内の推計）</span></p>`;
  }

  // exchange rates as seen from the player's base currency (one shared rule: LC.fxOf)
  // the economy of the country you were born into (game assumptions, shown as such)
  function countryCard() {
    const C = LC.country(S), e = LC.ecoOf(S), X = LC.countryEconomy(S), lvl = (v) => (v >= 1.3 ? 'しやすい' : v >= 0.95 ? 'ふつう' : v >= 0.75 ? 'やや難しい' : '難しい');
    return `<div class="card"><h3>${esc(C.name)}の暮らしとお金</h3><p class="hint">お金はすべて円で表示します。国ごとに違うのは給与・物価・税金・仕事の見つけやすさです。数値はゲーム用の想定値です。</p>
      ${kv([['平均年収 / 中央値', `${Y(X.avgIncome)} / ${Y(X.medianIncome)}`], ['最低賃金', X.minWageHour ? `時給 ${YP(X.minWageHour)}（年 約${Y(X.minWageYear)}）` : '法定の最低賃金なし'], ['手取りの割合（平均年収で）', `約${Math.round(X.takeHomeRate * 100)}%`],
        ['家賃（アパート・月）', Y(X.rent)], ['新築の家', Y(X.house)], ['食費・日用品（1人・年）', Y(X.food)], ['光熱費・通信（1人・年）', Y(X.util)], ['小型車', Y(X.car)],
        ['大学の学費（年）', Y(X.uniYear)], ['医療費の自己負担（年・目安）', Y(X.medical)], ['消費税・付加価値税', `${(X.vat * 100).toFixed(X.vat * 100 % 1 ? 1 : 0)}%`], ['投資の利益への税', `約${Math.round(X.cgt * 100)}%`],
        ['失業率', `${e.unemp.toFixed(1)}%`], ['就職', lvl(X.jobs)], ['起業資金の目安', Y(X.startupCapital)], ['経済成長率 / インフレ率', `${e.gdp.toFixed(1)}% / ${e.infl.toFixed(1)}%`],
        ['年金', `${C.pensionAge}歳から・現役時代の約${Math.round(X.pensionRate * 100)}%`], ['老後の生活費（夫婦・年）', Y(X.retireLiving)]])}
      <p class="hint" style="margin-top:6px">投資：${esc(X.invest)}<br>社会保障：${esc(X.welfare)}<br>株式市場：${esc(C.market || '')}<br>不動産：${esc(C.estate || '')}</p></div>`;
  }


  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.sheet) closeSheet(); if (e.key === ' ' && !ui.sheet && e.target === document.body) { e.preventDefault(); LC.togglePlay(S); } });
  document.addEventListener('focusin', (e) => { if (e.target.matches && e.target.matches('.sheet input[type=text], .sheet input[type=number]')) ui.typing = true; });
  document.addEventListener('focusout', () => { ui.typing = false; });
  const H = window.claude && window.claude.hot;
  if (H && H.ready) H.ready(start); else start((H && H.data) || {});
})();
</script>
</body>
</html>
