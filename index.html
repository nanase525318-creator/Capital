<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAPITAL — 経営と投資のシミュレーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFF3;--sf:#FFFFFF;--sf2:#F5F6F9;--ink:#131A2C;--ink2:#5A6276;--ink3:#8B92A4;--line:#DFE3EA;--ai:#26408B;--ai2:#E3E8F6;--up:#12875C;--dn:#CC313E;--warn:#B0741A;--warn2:#FBF1DF;
--ff:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;--fn:"Barlow","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1018;--sf:#151A26;--sf2:#1B2130;--ink:#ECEFF5;--ink2:#A3AABB;--ink3:#6E768A;--line:#262D3D;--ai:#93A6EF;--ai2:#1E2742;--up:#3DCB90;--dn:#FF6A72;--warn:#E4AA4A;--warn2:#2B2416}}
:root[data-theme="dark"]{--bg:#0C1018;--sf:#151A26;--sf2:#1B2130;--ink:#ECEFF5;--ink2:#A3AABB;--ink3:#6E768A;--line:#262D3D;--ai:#93A6EF;--ai2:#1E2742;--up:#3DCB90;--dn:#FF6A72;--warn:#E4AA4A;--warn2:#2B2416}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.55;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);position:relative}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--ink2)}.mut3{color:var(--ink3)}
/* header */
.hd{padding:10px 16px 8px;background:var(--bg)}
.hd-top{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.hd-name{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:active{background:var(--sf2)}
.hd-m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.hd-m div{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
.hd-m small{display:block;font-size:10.5px;color:var(--ink3);line-height:1.2}
.hd-m b{display:block;font-family:var(--fn);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* main */
main{flex:1;overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
h2{font-size:19px;margin:14px 0 10px;font-weight:700;letter-spacing:.02em}
h3{font-size:14px;margin:18px 0 8px;font-weight:700;color:var(--ink)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero{border-radius:20px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:11.5px;color:var(--ink2)}
.kpi b{display:block;font-family:var(--fn);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{font-style:normal;font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.list{background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
button.li:active{background:var(--sf2)}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:11.5px;color:var(--ink3)}
.r{text-align:right;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;background:var(--sf2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{padding:6px 12px;font-size:12.5px}
.seg{display:flex;background:var(--sf2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(20,30,60,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:11px;background:var(--ai);color:#fff;font-weight:700;font-size:14px}
.btn.sub{background:var(--sf2);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.dng{background:transparent;color:var(--up);border:1px solid var(--up);font-weight:500}
.btn.up-b{background:var(--up)}.btn.dn-b{background:var(--dn)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.w{width:100%}
.bar{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ai)}
.chart{width:100%;height:auto;display:block}
.kb{display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;font-size:10.5px;font-weight:700;line-height:1;transform:rotate(-12deg);vertical-align:1px;margin-left:4px;flex:none;color:var(--ink3)}
.kb.up{color:var(--up)}.kb.dn{color:var(--dn)}
.kb.new{animation:kbp .6s ease-out}
@keyframes kbp{0%{transform:rotate(-12deg) scale(2.2);opacity:0}60%{transform:rotate(-12deg) scale(.9);opacity:1}100%{transform:rotate(-12deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.kb.new{animation:none}}

/* ==== 海外事業 ==== */
.gb{background:linear-gradient(135deg,color-mix(in srgb,#0E7C86 16%,var(--sf)),var(--sf) 65%);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.gb .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.gb .kp div{background:var(--bg);border-radius:10px;padding:6px 8px}
.gb .kp small{display:block;font-size:10px;color:var(--ink3)}.gb .kp b{font-family:var(--fn);font-size:14px}
.wmap{position:relative;border-radius:14px;overflow:hidden;background:color-mix(in srgb,#0E7C86 8%,var(--bg));border:1px solid var(--line);margin-bottom:12px}
.wmap svg{display:block;width:100%;height:auto}
.wmap .land{fill:color-mix(in srgb,var(--ink3) 22%,var(--bg))}
.wmap .rt{fill:none;stroke:var(--ai);stroke-width:1.2;stroke-dasharray:300;stroke-dashoffset:300;animation:route 1.4s cubic-bezier(.2,.8,.2,1) forwards;opacity:.75}
@keyframes route{to{stroke-dashoffset:0}}
.wmap .dot{fill:var(--ink3);opacity:.5}.wmap .dot.on{fill:var(--ai);opacity:1}
.wmap .hq{fill:var(--dn)}
.wmap .ring{fill:none;stroke:var(--ai);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:ringp 2.4s ease-out infinite}
@keyframes ringp{from{transform:scale(1);opacity:.8}to{transform:scale(3.2);opacity:0}}
.fxrate{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:12px}
.fxrate div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.shg{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.shg i{display:block;height:100%;background:var(--ai);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.star{color:var(--warn);letter-spacing:1px}

.seg{overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:1 0 auto;min-width:44px}
.ir{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px}
.ir .co{font-size:12px;color:var(--ink2)}.ir .tt{font-size:15.5px;font-weight:700;line-height:1.5;margin:6px 0 10px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:8px 0}
.ir h5{font-size:12.5px;margin:12px 0 4px}.ir p{font-size:12.5px;line-height:1.75;margin:0;color:var(--ink2)}
.rt{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}.rt th,.rt td{padding:5px 3px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.rt th{color:var(--ink3);font-weight:500;font-size:10.5px}.rt td:first-child,.rt th:first-child{text-align:left}

.hd-dt{font-size:10.5px;font-weight:500;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hadv{display:flex;align-items:center;flex:none;margin-left:2px;border-radius:12px;background:var(--ai);box-shadow:0 4px 12px color-mix(in srgb,var(--ai) 35%,transparent);overflow:hidden}
.hadv .hk{height:40px;padding:0 8px;background:rgba(255,255,255,.14);color:#fff;border:0;font-size:12px;font-weight:600;white-space:nowrap}
.hadv .hg{height:40px;padding:0 11px;background:none;color:#fff;border:0;font-size:13.5px;font-weight:800;white-space:nowrap}
.hadv button:active{background:rgba(255,255,255,.25)}
.hd-top{gap:8px}

.a-copy::before{animation:nod calc(1.8s*var(--sp)) ease-in-out infinite}
.a-copy b{left:9px;top:12px;width:4px;height:3px;background:#fff;box-shadow:0 0 0 1px var(--ink3);animation:tap calc(.8s*var(--sp)) steps(2) infinite}
.a-room{animation:room calc(9s*var(--sp)) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes room{0%,100%{transform:translateX(0);opacity:1}35%{transform:translateX(34px);opacity:1}45%,70%{transform:translateX(34px);opacity:0}80%{transform:translateX(34px);opacity:1}}
.a-out{animation:goout calc(11s*var(--sp)) ease-in-out infinite;animation-delay:var(--dl)}
.a-out b{left:-4px;top:12px;width:5px;height:6px;background:#3b3b3b;border-radius:1px}
@keyframes goout{0%{transform:translateX(0);opacity:1}40%{transform:translateX(110px);opacity:0}60%{transform:translateX(110px);opacity:0}100%{transform:translateX(0);opacity:1}}

.ring{background:var(--sf);border-radius:14px;border:1px solid var(--line);padding:12px 14px}
.ring .ti{font-size:11px;letter-spacing:.14em;color:var(--ink3);font-weight:800}
.ring h4{font-size:15px;margin:6px 0 10px;line-height:1.5}
.ring .rw{display:flex;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line)}
.ring .rw span{flex:1;color:var(--ink2)}.ring .rw b{font-family:var(--fn)}
.opin{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:7px 0;border-top:1px dashed var(--line)}
.opin i{font-style:normal;font-weight:700;font-size:10.5px;color:#fff;background:var(--ai);border-radius:6px;padding:2px 6px;flex:none}
.opin i.no{background:var(--dn)}.opin i.ok{background:var(--up)}
.stampbox{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px}
.stamp2{width:58px;height:58px;border:3px solid var(--dn);border-radius:50%;display:grid;place-items:center;color:var(--dn);font-weight:800;font-size:15px;transform:rotate(-12deg);opacity:.25}
.stamp2.on{opacity:1;animation:stampIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{0%{transform:rotate(-12deg) scale(2.4);opacity:0}60%{transform:rotate(-12deg) scale(.9);opacity:1}100%{transform:rotate(-12deg) scale(1)}}

.mtg{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mtg .hd2{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink3)}
.mtg .ag{font-size:15px;font-weight:700;margin:6px 0 8px;line-height:1.5}
.spk{display:flex;gap:9px;padding:7px 0;border-top:1px dashed var(--line);font-size:12.5px;animation:newsIn .45s both}
.spk:nth-child(2){animation-delay:.12s}.spk:nth-child(3){animation-delay:.24s}.spk:nth-child(4){animation-delay:.36s}.spk:nth-child(5){animation-delay:.48s}
.spk .rl{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--ai)}
.spk .rl.cfo{background:#C28A1B}.spk .rl.cto{background:#0E8C8C}.spk .rl.coo{background:#34405E}.spk .rl.cmo{background:#D24C8F}
.spk .st{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--line);color:var(--ink2);margin-left:6px}
.spk .st.y{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}.spk .st.n{background:color-mix(in srgb,var(--dn) 18%,transparent);color:var(--dn)}
.rsl{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--bg);font-size:13px;font-weight:600}
.rsl.ok{background:color-mix(in srgb,var(--up) 12%,transparent);color:var(--up)}
.rsl.ng{background:color-mix(in srgb,var(--dn) 10%,transparent);color:var(--dn)}
.rsl.ce{background:color-mix(in srgb,var(--ai) 12%,transparent);color:var(--ai)}

nav button{min-width:0}
nav span{font-size:9.5px}
.me-h{background:linear-gradient(135deg,color-mix(in srgb,#8A6D1E 18%,var(--sf)),var(--sf) 60%);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}

/* ==== チュートリアル（スポットライト式） ==== */
#tut{position:fixed;inset:0;z-index:75;pointer-events:none}
#tut .spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,12,22,.62);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tut .ring2{position:absolute;border:2px solid var(--ai);border-radius:16px;animation:tring 1.6s ease-out infinite;pointer-events:none}
@keyframes tring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.12);opacity:0}}
#tut .card2{position:absolute;left:12px;right:12px;background:var(--sf);border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);pointer-events:auto;animation:cardIn .35s both}
#tut .who2{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);margin-bottom:6px}
#tut .who2 i{width:26px;height:26px;border-radius:50%;background:var(--ai);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
#tut .tx2{font-size:13.5px;line-height:1.7}
#tut .btns{display:flex;gap:8px;margin-top:10px}
#tut .sk{background:none;border:0;color:var(--ink3);font-size:12px;padding:6px}

/* ==== 経営会議（今月の判断ポイント → 会議 → 社長決裁 → 即時実行） ==== */
.ag-li{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer;transition:transform .12s}
.ag-li:active{transform:scale(.985)}
.ag-li .sv{flex:none;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;color:#fff;background:var(--ink3)}
.ag-li .sv.h{background:var(--dn)}.ag-li .sv.m{background:var(--warn)}.ag-li .sv.g{background:var(--up)}
.ag-li .tt{font-size:13.5px;font-weight:600;line-height:1.45}
.ag-li .rs{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.ag-li .go{font-size:11px;color:var(--ai);margin-top:4px}
.ag-li.done{opacity:.5}
.room{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seat{flex:1 1 60px;min-width:60px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;transition:all .3s}
.seat .av2{width:30px;height:30px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:var(--ink3)}
.seat.cfo .av2{background:#C28A1B}.seat.coo .av2{background:#34405E}.seat.cto .av2{background:#0E8C8C}.seat.cmo .av2{background:#D24C8F}.seat.ceo .av2{background:var(--ai)}
.seat .nm2{font-size:10.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .rl2{font-size:9.5px;color:var(--ink3)}
.seat.now{border-color:var(--ai);box-shadow:0 0 0 2px color-mix(in srgb,var(--ai) 30%,transparent);transform:translateY(-2px)}
.seat.now .av2{animation:talkpulse 1.1s ease-in-out infinite}
.seat.done2{opacity:.45}
@keyframes talkpulse{50%{transform:scale(1.12)}}
.bub{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.65;animation:newsIn .4s both;position:relative}
.bub .who{font-size:11px;color:var(--ink3);margin-bottom:3px}
.bub .who b{color:var(--ink)}
.bub .stn{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--line);margin-left:6px}
.bub .stn.y{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.bub .stn.n{background:color-mix(in srgb,var(--dn) 18%,transparent);color:var(--dn)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:dotb 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:inherit;font:inherit}
.opt.on{border-color:var(--ai);background:var(--ai2)}
.opt .rd{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.opt.on .rd{border-color:var(--ai);background:radial-gradient(circle,var(--ai) 45%,transparent 46%)}
.opt .ol{font-size:13.5px;font-weight:600}.opt .od{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.opt .rec{font-size:10px;color:var(--ai);font-weight:700}
.exq{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.exq li{padding:5px 0;opacity:0;animation:fadein .3s forwards}
.exq li.ok::before{content:"✓ ";color:var(--up);font-weight:800}

/* ==== 時間進行（ゲームの中心UI） ==== */
.tb2{flex-direction:column;align-items:stretch;gap:8px;padding:8px 12px}
.tb2 .tb-row{display:flex;align-items:center;gap:8px}
.tb2 .tb-date{flex:1;min-width:0}.tb2 .tb-date span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.advk{display:flex;background:var(--sf2);border:1px solid var(--line);border-radius:11px;padding:2px;flex:none}
.advk button{height:40px;padding:0 9px;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink2);background:none;border:0}
.advk button.on{background:var(--sf);color:var(--ai);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tb2 .go{flex:1;height:44px;border-radius:12px;background:var(--ai);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;border:0;white-space:nowrap}
.tb2 .go:active{transform:scale(.97)}
.adv-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,14,24,.35);animation:fadein .2s}

.adv-d{font-family:var(--fn);font-size:20px;font-weight:700;margin-bottom:10px}
.adv-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:8px}.adv-bar i{display:block;height:100%;background:var(--ai);animation:sweep .6s ease-out forwards}
/* 期間レポート */
.rp h4{font-size:12px;letter-spacing:.12em;color:var(--ink3);margin:14px 0 6px;font-weight:800}

.rp .kv em{font-style:normal;font-size:11px;margin-left:4px}
.cnt{display:flex;gap:6px;margin:6px 0}.cnt span{flex:1;text-align:center;font-size:11px;padding:6px;border-radius:9px;background:var(--sf);border:1px solid var(--line)}
.cnt b{display:block;font-family:var(--fn);font-size:16px}

/* ==== コンパクトなニュースUI ==== */
.nl{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.nl:first-child{border-top:0}
.nl .tm{font-family:var(--fn);font-size:11px;color:var(--ink3);width:34px;flex:none;padding-top:1px}

.nl .mt{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--ink3);margin-top:2px}
.nl.p3{background:color-mix(in srgb,var(--dn) 6%,transparent)}.nl.p2 .hd{font-weight:700}
.lvb{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:0 5px;border-radius:3px;border:1px solid currentColor}
.lvb.l3{color:#fff;background:var(--dn);border-color:var(--dn)}.lvb.l2{color:var(--warn)}.lvb.l1{color:var(--ink3)}.lvb.l0{color:var(--ink3);opacity:.7}
.nbox{background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.nbox .nt{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:11.5px;font-weight:800;letter-spacing:.12em;border-bottom:1px solid var(--line)}
/* 速報通知：小さく出て、数秒で縮む */
#brk{top:calc(env(safe-area-inset-top,0px) + 6px);justify-content:flex-end}
.bk{max-width:340px;border-radius:12px;border-left-width:4px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.bk-h{padding:7px 10px 0;font-size:10px}
.bk-l{padding:1px 6px;font-size:9.5px}
.bk-t{padding:3px 10px 0;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk ul{margin:3px 10px 0;font-size:11.5px}.bk li{padding:1px 0 1px 13px}
.bk li:nth-child(n+3){display:none}
.bk-f{padding:4px 10px 7px;font-size:10px}
.bk .ern{margin:3px 10px 0;font-size:11.5px}
.bk.mini{max-width:200px;border-radius:999px;border-left-width:0;animation:none}
.bk>div[style]{display:none}
.bk.mini .bk-t,.bk.mini ul,.bk.mini .ern,.bk.mini .bk-f,.bk.mini .bk-p,.bk.mini>div[style]{display:none}
.bk.mini .bk-h{padding:6px 10px}
.bk.mini .bk-h>span:nth-child(2){display:none}

/* ==== 共通アニメーション（新しい演出はこのクラス群を使う） ==== */
.fade-in{animation:fadein .3s ease both}
.slide-up{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.card-enter{animation:cardIn .45s cubic-bezier(.2,1.1,.4,1) both}
.modal-enter{animation:modalIn .5s cubic-bezier(.2,1.2,.4,1) both}
.number-pop{animation:npop .45s cubic-bezier(.3,1.6,.5,1)}
.value-up{color:var(--up)}.value-down{color:var(--dn)}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.float{animation:floaty 3s ease-in-out infinite}
.shimmer{position:relative;overflow:hidden}.shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shim 2.2s infinite}
.news-enter{animation:newsIn .5s cubic-bezier(.2,1,.4,1) both}
.company-grow{animation:grow .6s cubic-bezier(.3,1.5,.5,1) both}
.market-open{animation:mopen 1.8s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes npop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes floaty{50%{transform:translateY(-3px)}}
@keyframes newsIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes mopen{0%{opacity:0;transform:translate(-50%,-10px) scale(.9)}15%,75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-6px)}}
/* 司令塔 */
.cmd{background:linear-gradient(135deg,color-mix(in srgb,var(--ai) 16%,var(--sf)),var(--sf) 60%);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.cmd .nm{font-size:17px;font-weight:700;letter-spacing:.02em}
.cmd .ti{font-size:11.5px;color:var(--ink2)}
.stg{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:11.5px}
.stg .bar{flex:1;height:6px}
.stp{display:flex;gap:3px}.stp i{width:16px;height:5px;border-radius:3px;background:var(--line)}.stp i.on{background:var(--ai)}
.cmd .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cmd .kp div{background:var(--bg);border-radius:10px;padding:7px 8px;min-width:0}
.cmd .kp small{display:block;font-size:10px;color:var(--ink3)}.cmd .kp b{font-size:14px;font-family:var(--fn);white-space:nowrap}
.gco{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:13px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.gco .ic{font-size:18px;width:22px;text-align:center}
.nkm{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-radius:12px;background:var(--sf);border:1px solid var(--line);margin-bottom:12px}
.mast{display:flex;align-items:baseline;gap:8px;margin:4px 0 10px}.mast b{font-family:var(--fn);font-weight:800;letter-spacing:.14em;font-size:18px}
.brk-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--dn);padding:1px 6px;border-radius:4px}
/* 演出オーバーレイ */
#fx{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;padding:20px}
#fx .fxc{pointer-events:auto;width:100%;max-width:360px;background:var(--sf);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:18px;animation:modalIn .45s cubic-bezier(.2,1.2,.4,1)}
#fx .fxc.out{animation:fadeout .25s ease forwards}
@keyframes fadeout{to{opacity:0;transform:scale(.96)}}
#fx .fxbg{position:absolute;inset:0;background:rgba(10,14,24,.35);pointer-events:auto;animation:fadein .3s}
.fxh{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--ai)}
.fxt{font-size:19px;font-weight:700;margin:4px 0 10px;line-height:1.4}
.fxr{display:flex;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.fxr span{flex:1;color:var(--ink2)}.fxr em{font-style:normal;color:var(--ink3);font-family:var(--fn);margin-right:6px}.fxr b{font-family:var(--fn)}
.steps2{display:flex;justify-content:space-between;margin:6px 0 12px}
.steps2 div{flex:1;text-align:center;font-size:11.5px;color:var(--ink3);position:relative}
.steps2 div i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:var(--line);font-style:normal;font-weight:700;color:#fff;transition:background .3s,transform .3s}
.steps2 div.on{color:var(--ink)}.steps2 div.on i{background:var(--ai);transform:scale(1.1)}
.flow{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:12px}
.flow .bx{padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600}
.flow .ln{flex:1;height:2px;background:var(--line);position:relative;overflow:hidden}
.flow .ln i{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ai);animation:flowdot 1.1s ease-in-out infinite}
@keyframes flowdot{from{left:-8px}to{left:100%}}
.deal{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.deal .co{flex:1;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:center;font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal .lk{width:40px;height:2px;background:var(--ai);transform-origin:left;animation:linkgrow .7s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes linkgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ms{text-align:center}.ms .big{font-family:var(--fn);font-size:34px;font-weight:800;background:linear-gradient(90deg,#B8862B,#F2D27A,#B8862B);-webkit-background-clip:text;background-clip:text;color:transparent}
.mopen{white-space:nowrap;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:65;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mopen b{font-family:var(--fn);letter-spacing:.06em}
/* 決算カード（速報バナー内） */
.ern{margin:6px 12px 0;font-size:12.5px}.ern .fxr{padding:4px 0}
.bk-l.gd{background:var(--up)!important}.bk-l.bd{background:var(--dn)!important}.bk-l.ev{background:#7B55C7!important}.bk-l.cb{background:#1E2A4A!important}
/* 企業ツリーの接続演出 */
.tree li{animation:cardIn .45s cubic-bezier(.2,1.1,.4,1) both}
.tree li::before{transform-origin:left;animation:linkgrow .5s cubic-bezier(.2,.8,.2,1) both}
/* 職場の追加演出 */
.fac{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px}
.fac span{display:inline-flex;align-items:center;gap:3px;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.fac span i{font-style:normal;animation:grow .5s cubic-bezier(.3,1.5,.5,1) both}
.fxo{position:absolute;pointer-events:none}
.rack{width:14px;height:40px;background:#2a3140;border-radius:2px;display:flex;flex-direction:column;gap:3px;padding:3px}
.rack i{height:3px;border-radius:1px;background:#3DCB90;animation:blink2 1.1s steps(2) infinite}
.rack i:nth-child(2n){animation-delay:.35s;background:#93A6EF}.rack i:nth-child(3n){animation-delay:.7s}
@keyframes blink2{50%{opacity:.25}}
.data{height:2px;width:60px;background:repeating-linear-gradient(90deg,var(--ai) 0 4px,transparent 4px 10px);animation:conv2 .8s linear infinite;opacity:.6}
@keyframes conv2{to{background-position:10px 0}}
.prod{width:8px;height:7px;background:#B98A55;border-radius:1px;animation:prodmv calc(4s*var(--sp)) linear infinite}
@keyframes prodmv{from{transform:translateX(0)}to{transform:translateX(280px)}}
.arm{width:3px;height:18px;background:var(--ink3);transform-origin:50% 100%;animation:armsw calc(1.6s*var(--sp)) ease-in-out infinite alternate}
@keyframes armsw{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
.fork{width:18px;height:10px;background:#E0A21E;border-radius:2px;animation:walkx calc(6s*var(--sp)) ease-in-out infinite alternate;--dx:140px}
.fork::after{content:"";position:absolute;left:18px;top:6px;width:8px;height:2px;background:var(--ink3)}
.cam{width:12px;height:9px;background:var(--ink);border-radius:2px}.cam::after{content:"";position:absolute;left:-3px;top:-4px;width:5px;height:5px;border-radius:50%;background:#e33;animation:blink2 1s steps(2) infinite}
.crane{width:2px;height:44px;background:#E0A21E}.crane::after{content:"";position:absolute;left:0;top:0;width:40px;height:2px;background:#E0A21E;transform-origin:left;animation:armsw 5s ease-in-out infinite alternate}
.bars{display:flex;align-items:flex-end;gap:2px;height:18px}.bars i{width:4px;background:var(--ai);animation:barup 2.4s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.3s}.bars i:nth-child(3){animation-delay:.6s}.bars i:nth-child(4){animation-delay:.9s}
@keyframes barup{0%,100%{height:4px}50%{height:18px}}
.pp.cust::after{background:var(--c);border-radius:5px 5px 2px 2px}
.wp.off *,.wp.off *::before,.wp.off *::after{animation-play-state:paused!important}

/* ---- 職場ビジュアル ---- */
.wp{border-radius:16px;overflow:hidden;background:var(--sf);border:1px solid var(--line);margin-bottom:12px;--sp:1}
.wp-h{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;font-size:12px}
.wp-h{flex-wrap:wrap}.wp-h b{font-size:13.5px;white-space:nowrap}
.wp-st{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink2);white-space:nowrap}
.st-good .wp-st{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.st-boom .wp-st{background:color-mix(in srgb,var(--ai) 18%,transparent);color:var(--ai)}
.st-bad .wp-st{background:color-mix(in srgb,var(--dn) 16%,transparent);color:var(--dn)}
.wp-b{display:flex;gap:6px;padding:0 10px 8px}
.bldg{flex:none;width:34px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start;padding-top:4px}
.bldg i{height:9px;border-radius:2px;background:color-mix(in srgb,var(--ai) 55%,var(--line));position:relative}
.bldg i::after{content:"";position:absolute;inset:3px 4px;background:repeating-linear-gradient(90deg,#fff9 0 3px,transparent 3px 6px);border-radius:1px}
.bldg i.me{background:var(--ai)}
.fls{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{position:relative;height:74px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--ai) 7%,var(--bg)) 0 62%,color-mix(in srgb,var(--ink3) 14%,var(--bg)) 62%)}
.fl svg{position:absolute;inset:0;width:100%;height:100%}
.fl .fn{position:absolute;left:6px;top:4px;font-size:9.5px;color:var(--ink3);z-index:2}
.st-bad .fl{filter:saturate(.55) brightness(.94)}
.st-good .fl,.st-boom .fl{filter:saturate(1.1)}
.st-boom .fl::after{content:"採用中";position:absolute;right:6px;top:4px;font-size:9.5px;font-weight:700;color:#fff;background:var(--ai);padding:1px 6px;border-radius:999px;animation:blink 1.6s steps(2) infinite}
.st-boom{--sp:.75}.st-good{--sp:.9}.st-bad{--sp:1.6}
/* 人 */
.pp{position:absolute;width:10px;height:24px;z-index:1;transform-origin:50% 100%}
.pp::before{content:"";position:absolute;left:1.5px;top:0;width:7px;height:7px;border-radius:50%;background:#E9C3A0;box-shadow:inset 0 2px 0 var(--hc,#3b2a20)}
.pp::after{content:"";position:absolute;left:0;top:8px;width:10px;height:13px;border-radius:4px 4px 2px 2px;background:var(--c)}
.pp b{position:absolute;display:block}
.a-type::before{animation:nod calc(1.3s*var(--sp)) ease-in-out infinite;animation-delay:var(--dl)}
.a-type b{left:9px;top:12px;width:4px;height:2px;background:var(--ink3);animation:tap calc(.35s*var(--sp)) steps(2) infinite}
.a-walk,.a-carry,.a-serve{animation:walkx calc(var(--wd,7s)*var(--sp)) ease-in-out infinite alternate;animation-delay:var(--dl)}
.a-walk::after,.a-carry::after,.a-serve::after{animation:bob calc(.45s*var(--sp)) ease-in-out infinite}
.a-carry b{left:-1px;top:-8px;width:12px;height:8px;background:#B98A55;border-radius:1px}
.a-serve b{left:6px;top:9px;width:10px;height:2px;background:var(--ink3);border-radius:1px}
.a-phone b{left:8px;top:2px;width:3px;height:6px;background:var(--ink);border-radius:1px}
.a-phone::before{animation:tilt calc(2.2s*var(--sp)) ease-in-out infinite;animation-delay:var(--dl)}
.a-meet b,.a-talk b{left:7px;top:-11px;padding:0 3px;font-size:8px;line-height:9px;background:#fff;color:#333;border-radius:4px;animation:talk calc(2.6s*var(--sp)) ease-in-out infinite;animation-delay:var(--dl)}
.a-meet b::after,.a-talk b::after{content:"…"}
.a-work{animation:work calc(.9s*var(--sp)) ease-in-out infinite;animation-delay:var(--dl)}
.a-read b{left:6px;top:10px;width:7px;height:8px;background:#fff;border:1px solid var(--line)}
.a-read::before{animation:nod calc(2.4s*var(--sp)) ease-in-out infinite}
.a-rest b{left:8px;top:11px;width:4px;height:5px;background:#fff;border-radius:0 0 2px 2px;box-shadow:0 0 0 1px var(--ink3)}
.a-rest{animation:sway calc(3.5s*var(--sp)) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes nod{50%{transform:translateY(1.2px)}}
@keyframes tap{50%{opacity:.2}}
@keyframes walkx{from{transform:translateX(0)}to{transform:translateX(var(--dx,60px))}}
@keyframes bob{50%{transform:translateY(-1px)}}
@keyframes tilt{50%{transform:rotate(12deg)}}
@keyframes talk{0%,40%{opacity:0;transform:translateY(2px)}50%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes work{50%{transform:translateY(-2px) rotate(-3deg)}}
@keyframes sway{50%{transform:rotate(3deg)}}
.conv{stroke-dasharray:6 5;animation:conv calc(1.2s*var(--sp)) linear infinite}
@keyframes conv{to{stroke-dashoffset:-11}}
.steam{animation:steam 2.4s ease-in-out infinite;opacity:.5}
@keyframes steam{0%{transform:translateY(0);opacity:.0}40%{opacity:.5}100%{transform:translateY(-8px);opacity:0}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.wp-lg{display:flex;flex-wrap:wrap;gap:3px 10px;padding:0 12px 10px;font-size:11px;color:var(--ink2)}
.wp-lg span{display:inline-flex;align-items:center;gap:4px}
.wp-lg i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.wp-ind{display:flex;gap:10px;padding:0 12px 10px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.wp-ind b{color:var(--ink);font-family:var(--fn);font-weight:600}
/* 経営陣 */
.ex{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:var(--c,var(--ai));flex:none}
.ex .ab{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.ex .ab i{display:block;height:100%;background:var(--ai);transition:width .6s}
/* 企業ツリー */
.tree{font-size:13px}
.tree .nd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--sf);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.tree .nd .pc{font-family:var(--fn);font-weight:700;color:var(--ai);min-width:44px}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.tree ul::before{content:"";position:absolute;left:8px;top:0;bottom:18px;border-left:1.5px solid var(--line)}
.tree li{position:relative;padding-top:6px}
.tree li::before{content:"";position:absolute;left:-10px;top:24px;width:10px;border-top:1.5px solid var(--line)}

/* ---- motion ---- */
.view{animation:vin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view>.card,.view>.list>.li,.view>.alert,.view>.grid2>*,.view>.grid3>*,.view>.ev{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}

/* =====================================================================
   MODULE: Events — 景気イベント（兆候 → 発生 → 終息）
   ===================================================================== */
const Events={
  fill(s,e){return String(s).replace(/\$/g,e.sec?SECTORS[e.sec].n:'');},
  // 出来事があなたの会社・保有株にどう効くかを平易に説明する
  impact(d,e,pre){const m=d.m||{},tr={...(m.trend||{})};if(m.trendS&&e.sec)tr[e.sec]=m.trendS;
    const up=Object.keys(tr).filter(k=>tr[k]>1.02&&SECTORS[k]).sort((a,b)=>tr[b]-tr[a]),dn=Object.keys(tr).filter(k=>tr[k]<.98&&SECTORS[k]).sort((a,b)=>tr[a]-tr[b]);
    const L=[];const sh={...(d.sec||{})};if(d.secS&&e.sec)sh[e.sec]=d.secS;const sk=Object.keys(sh).filter(k=>SECTORS[k]);if(!pre&&sk.length)L.push(sk.map(k=>`${SECTORS[k].n}株 ${sh[k]>=0?'▲':'▼'}${pct(sh[k],1)}`).join('　'));
    if(up.length)L.push(`追い風：${up.map(k=>SECTORS[k].n).join('・')}`);if(dn.length)L.push(`逆風：${dn.map(k=>SECTORS[k].n).join('・')}`);
    const mac=[];if((m.g||0)>.2)mac.push('景気を押し上げる');if((m.g||0)<-.2)mac.push('景気を冷やす');if((m.i||0)>0||(m.c||0)>0)mac.push('物価・原材料費が上がりやすい');if(m.ease)mac.push('金融緩和で金利が下がりやすい');if((m.credit||1)<1)mac.push('銀行の融資が厳しくなる');if(m.re||d.reCrash)mac.push('不動産価格が動く');
    if(mac.length)L.push(mac.join('、'));
    for(const b of S.biz){const v=tr[b.type];if(v&&Math.abs(v-1)>.02)L.push(`あなたの${BT[b.type].n}事業：需要が${v>1?'増える':'減る'}見込み`);}
    let hu=0,hd=0;for(const t in S.hold){const c=CM[t];if(!c)continue;if(up.includes(c.sec))hu++;if(dn.includes(c.sec))hd++;}if(hu||hd)L.push(`保有株：追い風 ${hu}銘柄・逆風 ${hd}銘柄`);
    L.push(pre?`まだ兆候の段階。${d.fizzle?`${Math.round(d.fizzle*100)}%ほどの確率で回避される`:'近く本格化する可能性が高い'}`:`続く期間の目安：${d.dur[0]}〜${d.dur[1]}ヶ月`);return L;},
  month(){
    for(const e of S.events){const d=EVD[e.id];e.t++;
      if(e.stage==='rumor'&&e.t>=e.warn){
        if(R()<(d.fizzle||0)){e.stage='done';News.add('経済',`懸念されていた「${this.fill(d.name,e)}」は回避された模様`,'兆候は見られたが、実際の影響は限定的との見方が広がった。',null,1);}
        else this.begin(e);
      }else if(e.stage==='active'&&e.t>=Math.round(e.dur*.35)){e.stage='peak';e.t=0;
        News.add('経済',`「${this.fill(EVD[e.id].name,e)}」の影響が拡大`,'当初の想定を超えて広がっており、関連業種の変動が大きくなっている。',null,(EVD[e.id].m.g||0)<0?-1:1,{lv:2,imp:this.impact(EVD[e.id],e,0),ev:e.id});
      }else if(e.stage==='peak'&&e.t>=Math.round(e.dur*.4)){e.stage='fade';e.t=0;
        News.add('経済',`「${this.fill(EVD[e.id].name,e)}」はピークを越えた模様`,'影響は残るものの、落ち着きに向かい始めている。',null,(EVD[e.id].m.g||0)<0?1:-1,{lv:1,ev:e.id});
      }else if(e.stage==='fade'&&e.t>=Math.round(e.dur*.35)){e.stage='done';this.finish(e);}
    }
    S.events=S.events.filter(e=>e.stage!=='done');
    for(const d of EVDEF){
      if(S.events.some(e=>e.id===d.id))continue;

      if(R()<p){const e={id:d.id,sec:d.secs?pick(d.secs):null,stage:'rumor',t:0,warn:d.warn?ri(d.warn[0],d.warn[1]):0,dur:ri(d.dur[0],d.dur[1])};
        S.events.push(e);
        if(d.pre)News.add('経済',this.fill(d.pre,e),'今後の動向次第で関連業種に大きな影響が出る可能性がある。',null,0,{lv:1,imp:this.impact(d,e,1),ev:e.id});else this.begin(e);}
    }
  },
  begin(e){const d=EVD[e.id];e.stage='active';e.t=0;S.newEvent=true;
    News.add('速報',this.fill(d.start,e),'',null,(d.m.g||0)<0||(d.m.trendS||1)<1?-1:1,{lv:2,imp:this.impact(d,e,0),ev:e.id});
    const sh={};Object.assign(sh,d.sec||{});if(d.secS&&e.sec)sh[e.sec]=d.secS;
    Market.shock(d.mkt||0,sh);if(d.gold)S.funds.GOLD.jump=(S.funds.GOLD.jump||0)+d.gold;
    if(d.quake){for(const b of S.biz){if(BT[b.type].model==='local'||BT[b.type].locCap){b.customers*=.72;b.quality=Math.max(5,b.quality-6);}}
      if(S.biz.length)News.add('自社',`災害で${S.player.name}の店舗・拠点に被害`,'一時的に顧客数と品質が低下した。',null,-1);}
    if(d.grant&&e.sec){const bs=S.biz.filter(b=>BT[b.type].sec===e.sec);
      for(const b of bs){const g=Math.max(300e4,sum(b.hist.slice(-12),h=>h.rev)*.05);S.co.cash+=g;S.flows.sub+=g;
        News.add('自社',`${S.player.name}の${BT[b.type].n}事業に補助金${yen(g)}円`,'営業外収益として計上される。',null,1);}}
    if(d.tech&&e.sec){for(const b of S.biz){if(BT[b.type].sec===e.sec&&b.quality<70){b.quality=Math.max(5,b.quality-12);
      News.add('自社',`新技術の登場で${BT[b.type].n}事業の競争力が低下`,'研究開発で品質を取り戻す必要がある。',null,-1);}}}
  },
  finish(e){const d=EVD[e.id];News.add('経済',this.fill(d.end,e),'',null,0,{lv:1,ev:e.id,imp:['出来事の影響は徐々に薄れていく',d.endSec?'期待で上がっていた銘柄は反落しやすい':'落ち込んでいた業種は回復に向かう']});if(d.endSec)Market.shock(0,d.endSec);if(d.reCrash)S.econ.reIdx*=d.reCrash;},
  mods(){const o={g:0,i:0,c:0,s:0,re:0,ease:0,credit:1,trend:{}};
    for(const e of S.events){if(!['active','peak','fade'].includes(e.stage))continue;const m=EVD[e.id].m,w=e.stage==='peak'?1.45:e.stage==='fade'?.5:1;   /* 段階で強さが変わる */
      o.g+=(m.g||0)*w;o.i+=(m.i||0)*w;o.c+=(m.c||0)*w;o.s+=(m.s||0)*w;o.re+=(m.re||0)*w;o.ease+=(m.ease||0)*w;o.credit*=1-(1-(m.credit||1))*w;
      if(m.trend)for(const k in m.trend)o.trend[k]=(o.trend[k]||1)*(1+(m.trend[k]-1)*w);
      if(m.trendS&&e.sec)o.trend[e.sec]=(o.trend[e.sec]||1)*(1+(m.trendS-1)*w);}
    return o;}
};

/* =====================================================================
   MODULE: Economy — 景気循環・インフレ・金利(テイラー則)・為替・資源・地価
   ===================================================================== */
const Econ={
  init(){const E=S.econ={gdp:rn(.6,1.6),infl:rn(.8,2.2),rate:rn(.25,1.25),sent:0,commod:1,fx:rn(140,155),pIdx:1,wIdx:1,reIdx:1,cyc:rn(0,Math.PI*2),cycSp:2*Math.PI/ri(84,120),trend:{},hist:[],phase:''};
    E.rate=Math.round(E.rate*4)/4;for(const s in SECTORS)E.trend[s]=1;this.phase();},
  month(){const E=S.econ,D=DIFF[S.diff],ev=Events.mods();
    E.cyc+=E.cycSp*rn(.6,1.4);
    const tg=1.0+1.5*Math.sin(E.cyc)-.55*(E.rate-E.infl-.3)+ev.g;
    const pc=E.commod,pr=E.rate,pg=E.gdp;
    E.gdp=clamp(E.gdp+.3*(tg-E.gdp)+gauss()*.22*D.vol,-6,6);
    E.commod=Math.exp(Math.log(E.commod)*.96+.004*(E.gdp-1)+ev.c+gauss()*.025*D.vol);

    const taylor=clamp(.5+1.4*(E.infl-1.2)+.5*(E.gdp-1)-ev.ease,0,8);
    if(Math.abs(taylor-E.rate)>=.25&&R()<.5){const st=Math.abs(taylor-E.rate)>1.5?.5:.25;E.rate=clamp(E.rate+Math.sign(taylor-E.rate)*st,0,8);
      News.add('経済',E.rate>pr?`中央銀行、政策金利を${pctp(st/100,2)}引き上げ ${pctp(E.rate/100,2)}へ`:`中央銀行、政策金利を${pctp(st/100,2)}引き下げ ${pctp(E.rate/100,2)}へ`,E.rate>pr?'物価上昇への警戒から金融引き締めを決定。借入コストの上昇は企業収益の重しに。':'景気下支えのため金融緩和を決定。株式・不動産には追い風。',null,E.rate>pr?-1:1,{lv:2,imp:[E.rate>pr?'借入の金利が上がる（新規・既存とも）':'借入の金利が下がる',`あなたの借入残高：${yen(Co.debt())}円`,E.rate>pr?'不動産・高成長株に逆風、銀行株に追い風':'株式・不動産に追い風']});}
    E.fx=clamp(E.fx+.08*((152-9*(E.rate-1.2))-E.fx)+gauss()*2.2*D.vol,80,220);
    E.pIdx*=1+E.infl/1200;E.Y=(E.Y||1)*(1+(E.gdp+E.infl)/1200);/* 名目GDPの水準（各業種の市場規模の基準） */E.wIdx*=1+(.6*E.infl+.3*Math.max(0,E.gdp))/1200;

    const pp=E.phase;this.phase();
    if(pp!==E.phase)News.add('経済',`景気局面が「${E.phase}」に移行`,this.phaseHint(E.phase),null,['好景気','回復'].includes(E.phase)?1:['後退','不況'].includes(E.phase)?-1:0);
    if(S.m%3===0)News.add('経済',`GDP成長率 ${pct(E.gdp/100)}、消費者物価 ${pct(E.infl/100)}`,`前期のGDPは${pct(pg/100)}。政策金利は${pctp(E.rate/100,2)}。`,null,E.gdp>pg?1:-1);
    E.hist.push({gdp:r2(E.gdp),infl:r2(E.infl),rate:E.rate,fx:r2(E.fx),commod:r2(E.commod),re:r2(E.reIdx)});if(E.hist.length>240)E.hist.shift();
    S.cityG*=1+CITIES[S.player.city].pop/12;},
  phase(){const E=S.econ,h=E.hist,prev=h.length?h[h.length-1].gdp:E.gdp;
    E.phase=E.gdp>2.2&&E.infl>3?'過熱':E.gdp>1.4?'好景気':E.gdp<-1?'不況':E.gdp<.3?'後退':E.gdp>=prev?'回復':'減速';},

/* =====================================================================
   MODULE: Market — 上場企業(Stock)・株価・決算・企業AI・M&A・IPO・ファンド

const Market={
  usedNames:null,usedCodes:null,

  pxTarget(cap,arch){const L=Math.log10(Math.max(1e8,cap/((S.econ&&S.econ.Y)||1)));   /* 経済規模で割り、長期でも株価帯がずれないように */const adj={theme:1.3,growth:.9,startup:.3,mature:.1,cyclical:0,value:-.3}[arch]||0;

  // 週足ローソク：始値・高値・安値を生成（終値は hist）。日次5本のブラウン橋から高安を作る
  push(o,p0,op,cl,sd){const a=Math.log(op),b=Math.log(cl);let mx=Math.max(op,cl),mn=Math.min(op,cl);

    while(o.hist.length>L)o.hist.shift();while(o.oh.length>o.hist.length)o.oh.shift();},
  ni(c){const op=c.rev*c.opm,it=c.debt*(S.econ.rate+1.2)/100,p=op-it;return p>0?p*.7:p;},
  // 株価の基本は EPS × PER。PERは企業タイプごとの上下限の中で、成長率（平方根で逓減）・金利・センチメント・業種で動く
  PEB:{theme:[30,80,42],growth:[25,50,32],startup:[25,50,35],mature:[8,20,12],cyclical:[12,30,16],value:[8,20,11]},

  fair(c){const ni=this.ni(c),gx=Math.max(0,(c.expG??c.g)-this.gNom()),psr=clamp(.4+1.5*Math.sqrt(gx),.2,5);

  make(sec,af,q){const a=af||pick(SECTORS[sec].a),A=ARCH[a],Yn=(S.econ&&S.econ.Y)||1;   // 名目経済の規模に合わせて新規企業の規模も調整

  create(type){const t=BT[type],id='b'+(S.bid++);
    const b={id,type,price:t.price*S.econ.pIdx,ad:t.adRef*.5,rd:t.rdRef*.25,staff:t.staff0,locs:t.loc0||0,equip:0,quality:40,brand:10,customers:t.cust0||0,fixedAssets:0,cumRev:0,hist:[],last:null,pend:0,hit:1,demand:0,cap:0,util:0,since:S.month};

    const qF=Math.pow(Math.max(5,b.quality)/50,.7),bF=.5+b.brand/40,pF=Math.pow(ref/b.price,t.elas);
    const AL=Ally.mods(),SY=Syn.mods(b),XM=Exec.mods(),adF=1+t.adSens*Math.log(1+b.ad/(t.adRef*E.pIdx))*XM.ad*SY.ad;   /* グループのシナジーを反映 */
    const eF=clamp(1+SECTORS[t.sec].cyc*(E.gdp-1)*.035,.55,1.35),trF=E.trend[t.sec]||1;
    if(t.hit)b.hit=clamp(.6*b.hit+.4*Math.exp(gauss()*.35)*(.7+b.quality/150),.3,3);
    const att=qF*bF*pF*adF*eF*trF*D.demand/D.compete*(t.hit?b.hit:1);

    const mg=1+S.month*.0006;let demand,served;

      b.churn=clamp(t.churn*(1.6-b.quality/100)*Math.pow(b.price/ref,.8)*(over?1.7:1),.005,.4);

    else{demand=t.model==='local'?b.locs*t.local*C.d*S.cityG/(1+b.locs/150)*att:t.national*mg*(t.share*att)/(1+t.share*att);
      b.customers=b.customers*.35+Math.min(demand,cap)*.65;served=Math.min(b.customers,cap);}
    b.demand=demand;b.cap=cap;b.util=cap>0?served/cap:0;
    const rev=served*b.price;
    const cogs=rev*t.cogs*Math.max(.7,1-.02*b.equip)*(1+(t.commod||0)*SY.commod*(E.commod-1))*XM.cost*SY.cogs*AL.cogs;
    const labor=b.staff*this.sal(b);

    const dep=b.fixedAssets*t.dep;b.fixedAssets-=dep;

    b.quality=clamp(b.quality+b.rd/(t.rdRef*E.pIdx)*1.6*XM.rd*Syn.mods(b).rd*Ally.mods().rd*(1-b.quality/110)-.35-(t.model!=='sub'&&b.util>.97?1:0),5,100);
    const pr=b.price/ref;

    b.last=r;b.served=served;b.hist.push({rev:Math.round(rev),op:Math.round(r.op),c:Math.round(served)});if(b.hist.length>36)b.hist.shift();b.cumRev+=rev;
    return r;},
  // ---- プレイヤーの経営判断 ----

  borrow(a){if(a<=0)return '借入可能額がありません';if(a>this.limit())return '借入枠を超えています';const rate=this.rate();

  plan(t,ratio,prem){const c=CM[t];const tgt=Math.min(c.shares,Math.ceil(c.shares*ratio/100)*100),held=S.hold[t]?.q||0;

  launch(t,ratio,prem){const c=CM[t];if(!c||c.priv)return '対象企業が見つかりません';if(S.tob)return '同時に実施できるTOBは1件までです';
    const p=this.plan(t,ratio,prem);if(p.need<=0)return 'すでに目標の比率を保有しています';if(S.co.cash<p.total)return `現金が不足しています（必要 ${yen(p.total)}円）`;

  cancel(){const T=S.tob;if(!T)return 'TOBは実施されていません';const c=CM[T.t];const f=T.fee*.4;S.co.cash-=f;S.flows.fee+=f;S.tob=null;

/* =====================================================================
   MODULE: Eq — 自社の株式（IPO・株価・配当・自社株買い・公募増資・株主総会・アクティビスト）
   ===================================================================== */
const Eq={
  sector(){let best=null,v=-1;for(const b of S.biz){const r=b.last?.rev||0;if(r>v){v=r;best=b.type;}}return SECTORS[best]?best:'it';},
  // 自社の理論株価：連結業績を上場企業と同じ評価式にかけ、保有株式（子会社以外）の価値を加える
  fair(){const C=Co.cons(),b=Co.bs();const p={rev:Math.max(C.rev,1),opm:C.rev>0?C.op/C.rev:0,debt:C.debt,expG:clamp(Co.growth(),-.3,.6),arch:Co.growth()>.15?'growth':'value',sec:this.sector(),mood:S.eq.mood||0,equity:b.equity,cash:S.co.cash,crisis:S.co.cash<0?1:0};
    const subMV=sum(MA.subs(),c=>c.price*S.hold[c.t].q);return Math.max(1,Market.fair(p)+.7*(Co.secMV()-subMV));},
  fairPS(){return this.fair()/S.eq.shares;},
  founderPct(){return S.eq.founder/S.eq.shares;},
  reqs(){const C=Co.cons(),b=Co.bs();return[['創業から12ヶ月以上',S.month>=12,`${S.month}ヶ月`],['連結売上高（年換算）10億円以上',C.rev>=1e9,yen(C.rev)+'円'],['連結営業利益が黒字',C.op>0,yen(C.op)+'円'],['純資産がプラス',b.equity>0,yen(b.equity)+'円'],['信用力50以上',S.co.credit>=50,String(Math.round(S.co.credit))],['資金ショートがない',S.co.cash>=0&&S.co.distress===0,S.co.cash>=0?'問題なし':'現金がマイナス']];},
  canIPO(){return this.reqs().every(r=>r[1]);},
  // 上場前に株式分割をして、公開価格を1,000〜2,000円台に合わせる（実在の新規上場と同じ慣行）
  splitK(){return Math.max(1,Math.round(this.fairPS()/1500));},
  ipoPlan(pct,disc){const k=this.splitK(),sh=S.eq.shares*k,pre=this.fair()/sh,newQ=Math.round(sh*pct/(1-pct)/100)*100,px=pre*(1-disc),gross=newQ*px,net=gross*.94;
    return{k,newQ,px,gross,net,cap:px*(sh+newQ),founder:S.eq.founder*k/(sh+newQ)};},
  ipo(pct,disc){if(S.eq.listed)return 'すでに上場しています';if(!this.canIPO())return '上場審査の条件を満たしていません';
    const P=this.ipoPlan(pct,disc),E=S.econ;S.eq.shares*=P.k;S.eq.founder*=P.k;S.eq.shares+=P.newQ;S.co.cash+=P.net;S.co.capital+=P.net;S.flows.issue+=P.net;
    const pop=Math.exp(disc*.9+E.sent*.15-.05+gauss()*.1),p0=P.px*pop;chron(`${pName()}が新規上場（公開価格${nf(P.px)}円）`,'上場');S.eq.listed=true;S.eq.ipoM=S.month;S.eq.ipoPx=P.px;S.eq.price=p0;S.eq.prev=p0;
    S.eq.hist=[r2(p0)];S.eq.oh=[[r2(P.px),r2(Math.max(P.px,p0)*1.02),r2(Math.min(P.px,p0)*.98)]];S.eq.expG=Co.growth();S.eq.mood=pop>1?.05:-.08;S.eq.jump=0;

  weekly(ms){const q=S.eq,D=DIFF[S.diff],p0=q.price,f=this.fairPS(),sd=.38/Math.sqrt(260)*D.vol,jm=q.jump||0;q.jump=0;q.prev=p0;q.shares=q.shares||1;

/* =====================================================================
   MODULE: Prop — 不動産投資（物件の売買・賃料・稼働率・キャップレート・不動産ローン）
   ===================================================================== */
const PT={apt:{n:'賃貸マンション',ic:'🏢',cap:.045,cyc:.3,occ:.95},office:{n:'オフィスビル',ic:'🏙️',cap:.04,cyc:.9,occ:.92},retail:{n:'商業施設',ic:'🛍️',cap:.055,cyc:1.1,occ:.9},logi:{n:'物流倉庫',ic:'📦',cap:.047,cyc:.4,occ:.96,tr:'ec'},hotel:{n:'ホテル',ic:'🏨',cap:.058,cyc:1.8,occ:.8,tr:'ent'}};
const Prop={
  capRate(p){const E=S.econ,t=PT[p.type];return clamp(t.cap+(E.rate-1)*.006-(E.reIdx-1)*.025+p.age*.0004+(CITIES[p.city]?0:0),.025,.12);},
  noi(p){return p.rent*p.occ*(1-p.opex);},        // 月次の純収益（固定資産税は別）
  value(p){return this.noi(p)*12/this.capRate(p);},
  targetOcc(p){const E=S.econ,t=PT[p.type];return clamp(t.occ+t.cyc*(E.gdp-1)*.02-p.age*.002+(t.tr?((E.trend[t.tr]||1)-1)*.3:0),.35,.995);},
  make(){const E=S.econ,type=pick(Object.keys(PT)),t=PT[type],city=pick(Object.keys(CITIES)),age=ri(0,35);
    const p={id:'P'+(S.bid++),type,city,age,occ:0,opex:.22+age*.003,rent:0,listM:S.month};p.occ=clamp(this.targetOcc(p)+rn(-.08,.03),.3,1);
    const v0=Math.exp(rn(Math.log(1.5e7),Math.log(2e10)))*E.reIdx;p.rent=v0*this.capRate(p)/12/(p.occ*(1-p.opex));
    p.price=Math.round(v0*(1+rn(-.12,.14)-E.sent*.05)/1e5)*1e5;return p;},
  refresh(){S.reMkt=(S.reMkt||[]).filter(p=>S.month-p.listM<4);while(S.reMkt.length<6)S.reMkt.push(this.make());},
  loanRate(){return Math.max(.4,Co.rate()-.3);},
  plan(p,ltv){const loan=Math.round(p.price*ltv/1e5)*1e5,cost=p.price*1.04;return{loan,cash:cost-loan,cost};},
  buy(id,ltv){const i=S.reMkt.findIndex(x=>x.id===id);if(i<0)return '物件が見つかりません';const p=S.reMkt[i];
    if(ltv>0&&S.co.credit<30)return '信用力が低く、不動産ローンを組めません';const P=this.plan(p,ltv);if(S.co.cash<P.cash)return `現金が不足しています（必要 ${yen(P.cash)}円）`;
    S.reMkt.splice(i,1);S.co.cash-=P.cost;S.flows.reBuy+=P.cost;p.cost=P.cost;p.buyM=S.month;p.buyPx=p.price;
    if(P.loan>0){const rate=this.loanRate();S.co.loans.push({id:'L'+(S.bid++),p:P.loan,bal:P.loan,rate,term:300,mp:P.loan/300,m0:S.month,pid:p.id});S.co.cash+=P.loan;S.flows.borrow+=P.loan;}
    S.props.push(p);News.add('自社',`${S.player.name}、${p.city}の${PT[p.type].n}を${yen(p.price)}円で取得`,P.loan?`うち${yen(P.loan)}円を不動産ローン（25年）で調達。`:'全額を自己資金で支払い。',null,0);return null;},
  sellQuote(p){const v=this.value(p)*.97,loan=sum(S.co.loans.filter(l=>l.pid===p.id),l=>l.bal);return{v,loan,net:v-loan,gain:v-p.cost};},
  sell(id){const p=S.props.find(x=>x.id===id);if(!p)return '物件が見つかりません';const Q=this.sellQuote(p);
    S.co.cash+=Q.v;S.flows.reSell+=Q.v;S.flows.realized+=Q.gain;
    for(const l of S.co.loans.filter(l=>l.pid===id)){S.co.cash-=l.bal;S.flows.repay+=l.bal;}S.co.loans=S.co.loans.filter(l=>l.pid!==id);
    S.props=S.props.filter(x=>x!==p);News.add('自社',`${S.player.name}、${p.city}の${PT[p.type].n}を${yen(Q.v)}円で売却`,`売却損益 ${yen(Q.gain)}円。${Q.loan?`ローン残高${yen(Q.loan)}円を返済。`:''}`,null,Q.gain>=0?1:-1);return null;},
  // 月次：稼働率・賃料・経年を更新し、純賃料（固定資産税控除後）を返す
  monthly(){let net=0;const E=S.econ;for(const p of S.props||[]){p.occ=clamp(p.occ+.3*(this.targetOcc(p)-p.occ)+gauss()*.012,.3,1);p.rent*=1+E.infl/1200*.7;p.age+=1/12;
      const inc=p.rent*p.occ,ox=inc*p.opex,tax=p.cost*.014/12,n=inc-ox-tax;p.last={inc,ox,tax,n};net+=n;}
    this.refresh();return net;},
  totalValue(){return sum(S.props||[],p=>this.value(p));}
};

/* =====================================================================

  // 決算：海外拠点の損益（Co.close から呼ぶ）
  close(){const G=this.st(),D=DIFF[S.diff];let R0={rev:0,cogs:0,labor:0,other:0,dep:0,op:0,reg:{}};

      const dep=o.fixed*.06/12;o.fixed-=dep;const opPre=rev-cogs-labor-ad-up-regc-hedge,ltax=opPre-dep>0?(opPre-dep)*Math.max(0,C.tax-D.tax):0;

  st(){if(!S.vc)S.vc={list:[],next:1,inv:0,exit:0,win:0,lose:0};return S.vc;},
  gen(){const V=this.st(),sec=pick(['ai','it','saas','semi','health','ec','logi','ent','food','energy','re','auto','material','fin']);

      raise:0,founder:pick(FAM)+' '+pick(GIV),hist:[],news:[],round:st};

  invest(id,amt){const s=this.st().list.find(x=>x.id===id);if(!s||s.status!=='raising')return 'この案件は募集を終えています';

  // 月次：成長・資金繰り・次のラウンド・EXIT・失敗
  monthly(){const V=this.st(),E=S.econ,fund=clamp(1+E.sent*.6-(E.rate-1)*.08,.4,1.6);   /* 資金調達環境（金利が高いと冬の時代） */

          s.hist.push({m:S.month,e:'資金が尽き事業停止'});}}

        if(b&&s.own>=.05){b.quality=Math.min(100,b.quality+.12+.4*s.own);b.brand=Math.min(100,b.brand+.04+.2*s.own);s.syn=BT[b.type].n;}
        if(R()<.09){const ev=pick(['big','churn','press','patent','rival','pivot','hire']);const E2={
          big:()=>{s.g=Math.min(4,s.g+.12);s.rev*=1.06;return['大型顧客の獲得','大手企業との契約が決まり、売上が伸びる見通し。',1];},
          churn:()=>{s.g=Math.max(.02,s.g-.08);s.q=Math.max(10,s.q-4);return['主要メンバーが離脱','開発の中心メンバーが退職。計画の遅れが懸念される。',-1];},
          press:()=>{s.q=Math.min(99,s.q+2);s.val*=1.03;return['メディアで大きく取り上げられる','採用と資金調達に追い風。',1];},
          patent:()=>{s.risk=Math.max(.05,s.risk-.05);s.val*=1.04;return['基幹技術の特許を取得','競合に対する参入障壁ができた。',1];},
          rival:()=>{s.g=Math.max(.02,s.g-.06);s.risk=Math.min(.85,s.risk+.05);return['競合が同じ市場に参入','大手の参入で価格競争が激しくなる。',-1];},
          pivot:()=>{s.g=Math.max(.05,s.g*(R()<.5?.7:1.5));s.q+=R()<.5?-3:3;return['事業の方向転換（ピボット）','主力プロダクトを切り替える。結果が出るかは未知数。',0];},

  impair(s,r){if(s.own<=0)return;const loss=s.cost*r;s.cost-=loss;S.flows.extraLoss+=loss;if(r>=1){s.own=0;}},
  ipo(s){const px=Market.pxTarget(s.val,'startup'),sh=Math.max(1e6,Math.round(s.val/px/1000)*1000);

/* =====================================================================
   MODULE: Board — 役員会議（議題の発見・議論・決議・自動実行・社長上申）

      const md=c.stage>=3?'sub':c.stage>=2?'branch':'export',cost=Global.entryCost(k,md);if(k&&cost*3<c.cash)A.push({k:'global',pri:70,ttl:`${CTY[k].n}への進出（${GMODE[md].n}）`,amount:cost,cty:k,mode:md,note:`市場規模は日本の約${CTY[k].size.toFixed(1)}倍`});}
    if(c.stage>=2&&c.cash>1e10){const t=Market.listed().filter(x=>!x.crisis&&Trade.own(x.t)<=.05&&x.price*x.shares*1.5<c.cash*.8&&x.opm>.05).sort((a,b)=>b.opm-a.opm)[Math.floor(hs('ma'+S.month)%3)];

    if(c.listed&&c.cash>c.eq*.25&&Co.value()<c.eq)A.push({k:'buyback',pri:50,ttl:'自社株買いの実施',amount:c.cash*.05,note:'株価が純資産を下回っています'});
    if(c.runway<4&&c.credit>40&&Co.limit()>0)A.push({k:'borrow',pri:90,ttl:'運転資金の借入',amount:Math.min(Co.limit(),Math.max(1e7,burnNeed())),note:'当面の資金を確保します'});
    if(Big.st().offer){const o=Big.st().offer;A.push({k:'bigbet',pri:88,ttl:o.n,amount:o.amt,note:`${o.d}。成功確率の目安${pctp(o.p,0)}・${o.m}ヶ月後に結果`,big:1});}
    if(Sports.unlocked()&&!Sports.st().team&&Sports.offer()&&c.cash>Sports.offer().price*2)A.push({k:'sports',pri:45,ttl:`プロ野球球団「${Sports.offer().n}」の買収`,amount:Sports.offer().price,note:'グループのブランド価値を高める',sp:'buy'});
    if(Sports.st().team&&!Sports.st().team.stad.own&&c.cash>Sports.stadCost()*2)A.push({k:'sports',pri:35,ttl:'新球場の建設',amount:Sports.stadCost(),note:'入場料とグッズ収入の拡大',sp:'build'});
    for(const n of Nation.agendas())A.push(n);   /* 国家・世界規模のプロジェクト */

  // 役員の意見（役職・能力・性格・会社状況・議題から生成し、毎回同じ文にならないようにする）
  opinion(o,ag,c){const r=o.r,t=o.t,e=o.e,KN=Exec.kn(r),SY=Syn.active(),H=Syn.have(),
    newB=S.biz.filter(b=>S.month-(b.since??0)<10).map(b=>BT[b.type].n)[0],pick2=(L)=>L[hs(r+ag.k+S.month+e.name)%L.length],big=ag.amount>c.eq*.25,mid=ag.amount>c.eq*.08;
    const tight=c.runway<6||ag.amount>c.cash*.5,heavy=c.dr>1.2,rich=c.cash>c.eq*.4&&c.runway>12,grow=c.g>.12,shrink=c.g<-.03;
    let st=0,tx='';
    if(r==='CFO'){st=(tight?-2:heavy?-1:rich?1:0)+(t.finance>.6?-0+(tight?-1:0):0)+(t.risk>.6?1:0)+(ag.k==='borrow'&&c.runway<4?2:0);
      tx=tight?pick2([`手元資金は${yen(c.cash)}円、このままだと${Math.round(c.runway)}ヶ月で尽きます。${yen(ag.amount)}円の支出は重すぎます。`,`投資額が手元資金の${pctp(ag.amount/Math.max(1,c.cash),0)}に達します。資金繰りを優先すべきです。`,`いまは守りの局面です。${yen(ag.amount)}円を使うより、現金を厚くしておきたい。`])
        :heavy?pick2([`有利子負債が自己資本の${c.dr.toFixed(1)}倍です。追加投資より財務体質の改善が先です。`,`金利${pctp(c.rate/100,2)}の局面で借入残高${yen(c.debt)}円は重い。慎重に見たい案件です。`])
        :rich?pick2([`直近12ヶ月の営業利益は${yen(c.op)}円。この投資負担は十分に吸収できます。`,`現金${yen(c.cash)}円に対して投資額は${pctp(ag.amount/Math.max(1,c.cash),0)}。財務面の支障はありません。`,`資金効率の観点でも、現金を寝かせるより投資に回すべきです。`])
        :pick2([`投資額は自己資本の${pctp(ag.amount/c.eq,0)}です。回収期間を見極めたうえでなら賛成できます。`,`数字の上では実行可能ですが、想定を下回った場合の下振れも見ておきたい。`]);}
    if(r==='COO'){const u=c.util;st=(u>.9?1:u<.6?-1:0)+(t.growth>.6?1:0)+(ag.k==='exit'?1:0)-(ag.k==='biz'&&S.biz.length>=3?1:0);
      tx=ag.k==='exit'?pick2([`現場の負担が大きく、立て直しには時間がかかります。整理する判断も現実的です。`,`人員は他の事業へ配置転換できます。撤退しても現場は回ります。`])
        :ag.k==='loc'||ag.k==='capex'?pick2([`稼働率は${pctp(u,0)}。これ以上は品質が落ちるため、能力を増やすべきです。`,`現場は限界です。設備と人を入れれば受注をこぼさずに済みます。`])
        :u>.9?pick2([`既存事業の稼働率は${pctp(u,0)}と高水準です。人を割くなら採用を先に進めたい。`,`現場は回っていますが、余力は多くありません。立ち上げ要員の確保が条件です。`])
        :pick2([`いまは既存事業に余力があります。${ag.k==='biz'?'立ち上げ要員は内部から回せます。':'実行体制は組めます。'}`,`稼働率${pctp(u,0)}なので、現場の負担は許容範囲です。`]);}
    if(r==='CTO'){st=(t.innov>.6?1:0)+(ag.k==='biz'&&BT[ag.biz]?.sec==='it'?1:0)+(e.ab>75?1:0)-(ag.k==='global'?1:0);
      tx=ag.k==='ipo'?pick2([`上場には内部統制とシステム監査への対応が必要です。準備に半年は見てください。`,`セキュリティ体制は整えつつあります。上場基準にも対応できます。`])
        :ag.k==='ma'?pick2([`システム統合には時間がかかります。統合効果が出るのは1年後でしょう。`,`相手方の基幹システムは当社と重複しています。統合すれば運用費を減らせます。`])
        :ag.k==='biz'?pick2([`既存システムの大部分を流用でき、初期の開発費は想定より抑えられます。`,`必要な技術が現在の開発体制では不足しています。先に採用を進めるべきです。`,`研究開発の蓄積を使えば、他社より早く立ち上げられます。`])
        :pick2([`技術面での支障はありません。既存の基盤で対応できます。`,`いまは研究開発への投資が手薄です。将来の競争力が心配です。`]);}
    if(r==='CMO'){const br=S.biz.length?sum(S.biz,b=>b.brand)/S.biz.length:0;st=(br>40?1:0)+(t.growth>.6?1:0)+(ag.k==='global'&&t.overseas>.6?1:0)+(grow?1:0)-(shrink?1:0);
      tx=ag.k==='global'?pick2([`現地でのブランドはゼロからです。認知を取るまで広告費がかかります。`,`ブランド力${Math.round(br)}なら、現地パートナー次第で十分戦えます。`])
        :ag.k==='biz'?pick2([`既存顧客へのクロスセルが期待できます。販売チャネルはそのまま使えます。`,`ブランド力${Math.round(br)}では新市場での認知獲得に時間がかかります。広告予算の確保が前提です。`])
        :ag.k==='ipo'?pick2([`上場による信用力の向上で、法人顧客の獲得が進みます。`,`上場は採用にも効きます。ブランド価値の面で前向きです。`])
        :pick2([`市場の空気は${c.phase}です。需要の動きを見ながら販促を合わせます。`,`顧客の反応は悪くありません。販売面から見て支持できます。`]);}
    // 学習途中なら慎重に、グループのシナジーがあれば具体的に語る

    else if(KN>.6&&r==='CFO'&&S.gl&&Global.n()>0)tx+=`　海外売上の円換算は為替次第です（現在 ${nf(S.econ.fx,1)}円）。`;
    return{r,name:e.name,st:clamp(st,-2,2),tx};},
  stName(v){return v>=2?'強く賛成':v===1?'賛成':v===0?'中立':v===-1?'慎重':'反対';},
  decide(ag,ops,c){const B=this.st(),big=ag.amount>c.eq*.3||['ma','ipo','global'].includes(ag.k)&&ag.amount>c.eq*.15;
    const sum2=sum(ops,o=>o.st),cfo=ops.find(o=>o.r==='CFO');
    if(!ops.length)return'social';
    if(ag.k==='crisis')return'auto';
    if(ag.nat)return'ceo';   /* 国家規模の案件は必ず社長判断 */
    if(cfo&&cfo.st<=-2&&ag.amount>c.eq*.1)return'ceo';
    if(big)return'ceo';
    if(sum2>=2)return'auto';
    if(sum2<=-2)return'no';
    if(sum2<0)return'hold';

  gate(ag,c){const B=this.st();if(B.lvl===0)return false;if(B.lvl===1)return false;
    if(B.lvl===2)return ag.amount<=c.eq*.05&&!['ma','ipo','global'].includes(ag.k);
    if(B.lvl===3)return ag.amount<=c.eq*.25;

  run(ag){const c=this.ctx();
    if(ag.k==='biz')return Biz.start(ag.biz);
    if(ag.k==='exit'){const b=S.biz.find(x=>x.id===ag.biz);if(!b)return '対象がありません';Biz.exit(b);return null;}
    if(ag.k==='loc'){const b=S.biz.find(x=>x.id===ag.biz);return b?Biz.openLoc(b):'対象がありません';}
    if(ag.k==='capex'){const b=S.biz.find(x=>x.id===ag.biz);return b?Biz.upgrade(b):'対象がありません';}
    if(ag.k==='ipo')return Eq.ipo(.2,.15);
    if(ag.k==='global')return Global.enter(ag.cty,ag.mode,S.biz.sort((a,b)=>(b.last?.rev||0)-(a.last?.rev||0))[0]?.type);
    if(ag.k==='ma')return MA.launch(ag.tgt,.51,.3);

    if(ag.k==='crisis'){const b=S.biz.slice().sort((a,b2)=>(a.last?.op||0)-(b2.last?.op||0))[0];if(b&&(b.last?.op||0)<0&&S.biz.length>1){Biz.exit(b);return null;}const l=Math.min(Co.limit(),Math.max(1e6,-S.co.cash+1e7));return l>0?Co.borrow(l):'打つ手がありません';}
    return null;},
  // 毎月：会議を開くか判断し、議題を1〜2件処理する
  month(){const B=this.st(),team=this.team(),c=this.ctx();
    if(!team.length){if(B.pend||S.month-B.lastM<6)return;B.lastM=S.month;return;}
    if(S.month-B.lastM<this.interval())return;B.lastM=S.month;
    const dn=B.done||{};const A=this.agendas().filter(a=>a.k!=='none'&&!dn[`${S.y}-${S.m}-${a.k}${a.biz||a.cty||a.tgt||''}`]).slice(0,2);if(!A.length)return;   /* 社長が会議で決裁済みの案件は重複させない */
    B.n++;const rec={n:B.n,y:S.y,m:S.m,w:S.week,items:[]};
    for(const ag of A){const ops=team.map(o=>this.opinion(o,ag,c));let d=this.decide(ag,ops,c);
      if(d==='auto'&&!this.gate(ag,c))d='ceo';

        if(ag.amount>c.eq*.1)Disc.add('ME',ag.k==='ma'||ag.k==='global'?'再編':'事業',`${ag.ttl.replace(/の検討|検討/,'')}に関するお知らせ`,{sum:`取締役会において、${ag.ttl}を決議しました。`,sec:[['目的',ag.note||'企業価値の向上のため。'],['投資額',yen(ag.amount)+'円']]});}}

  // 社長判断

  reject(){const P=this.st().pend;if(!P)return;this.st().pend=null;const h=this.st().hist[0];if(h)h.items.push({ttl:P.ag.ttl,k:P.ag.k,amount:P.ag.amount,ops:P.ops,res:'ceoNo'});},
  resName:{auto:'取締役会で承認・実行',no:'見送り',hold:'継続検討',ceo:'社長判断へ上申',ceoOK:'社長決裁で承認',ceoNo:'社長決裁で却下',social:'役員不在のため社長判断'}
};
function burnNeed(){return Math.max(1e6,sum(S.co.hist.slice(-3),x=>Math.max(0,x.pl.rev-x.pl.op))/3*3);}

const IPN1=['スカイ','ドラゴン','ネオ','クリスタル','ゼノ','ルミナ','オルタ','グラン','エターナル','ヒーロー'];
const IPN2=['クエスト','サーガ','ウォーズ','ランド','ストーリー','クロニクル','レジェンド','ヒーローズ','アドベンチャー'];
const IPX=[{k:'anime',n:'アニメ化',c:8e8,pop:12,d:'映像展開で認知が広がる'},{k:'movie',n:'映画化',c:40e8,pop:18,d:'世界的な認知を狙う'},{k:'goods',n:'グッズ展開',c:4e8,pop:6,d:'物販の収益が積み上がる'},{k:'park',n:'テーマパーク展開',c:200e8,pop:20,d:'パーク事業の集客が大きく伸びる'},{k:'global',n:'海外展開',c:20e8,pop:15,d:'海外売上に寄与する'}];
const IPm={
  st(){if(!S.ip)S.ip=[];return S.ip;},
  // ゲーム・エンタメ・メディア事業からヒットが生まれる
  monthly(){const L=this.st();const src=S.biz.filter(b=>['gameB','ent','media','ad'].includes(b.type));
    for(const b of src){if(R()<.02+(b.quality/100)*.03){const n=pick(IPN1)+pick(IPN2),pop=Math.round(clamp(20+b.quality*.5+rn(-10,25),10,95));
      L.unshift({id:'I'+(S.bid++),n,pop,from:BT[b.type].n,y:S.y,m:S.m,x:[],rev:0});if(L.length>24)L.length=24;
      News.add('自社',`${S.player.name}の新作「${n}」がヒット`,`${BT[b.type].n}事業から生まれた作品。人気度${pop}。`,null,1,{lv:1,imp:['IPとして育て、映像・グッズ・パークへ広げられます']});}}
    let add=0;
    for(const x of L){x.pop=clamp(x.pop*(1-.006)+ (x.x.length?.15:0),3,100);
      const r=x.pop*x.pop*4e5*S.econ.pIdx/12*(1+x.x.length*.35);x.rev=r;add+=r;
      const pk=S.biz.find(b=>b.type==='park');if(pk&&x.x.includes('park'))pk.brand=Math.min(100,pk.brand+x.pop/900);
      const gl=S.gl&&Global.n()?1:0;if(gl&&x.x.includes('global'))for(const [k,o] of Global.ops())o.brand=Math.min(100,o.brand+x.pop/1500);}
    if(add>0){S.co.cash+=add;S.flows.div+=add;}   /* ライセンス収入は営業外収益 */
    return add;},
  expand(id,k){const x=this.st().find(v=>v.id===id),X=IPX.find(v=>v.k===k);if(!x||!X)return '対象が見つかりません';
    if(x.x.includes(k))return 'すでに展開しています';if(S.co.cash<X.c)return `現金が不足しています（必要 ${yen(X.c)}円）`;
    S.co.cash-=X.c;S.flows.capex+=X.c;S.co.mfixed=(S.co.mfixed||0)+X.c*.5;S.flows.extraLoss+=X.c*.5;
    x.x.push(k);x.pop=clamp(x.pop+X.pop,3,100);
    News.add('自社',`「${x.n}」の${X.n}が決定`,`投資額 ${yen(X.c)}円。${X.d}。`,null,1,{lv:1});
    Disc.add('ME','事業',`${x.n}の${X.n}に関するお知らせ`,{sum:`人気IP「${x.n}」を${X.n}します。投資額は${yen(X.c)}円です。`});return null;},
  value(){return sum(this.st(),x=>x.pop*x.pop*3e6);}
};

/* =====================================================================
   MODULE: BigBet — 超大型投資（成功すれば企業価値が跳ね上がり、失敗すれば巨額損失）
   ===================================================================== */
const BBET=[{k:'ai',n:'次世代AI基盤への集中投資',d:'世界最高水準のモデルを自社で開発する',p:.4,up:.9,sec:'ai'},
 {k:'semi',n:'最先端半導体工場の建設',d:'次世代プロセスの量産ラインを立ち上げる',p:.42,up:.8,sec:'semi'},
 {k:'space',n:'再使用型ロケットの開発',d:'宇宙輸送のコストを一気に下げる',p:.3,up:1.3,sec:'semi'},
 {k:'pharma',n:'新薬の第III相治験',d:'成功すれば特許で長期の収益源になる',p:.32,up:1.1,sec:'health'},
 {k:'energy',n:'次世代エネルギー（核融合・水素）',d:'エネルギーの構造を変える賭け',p:.28,up:1.4,sec:'energy'},
 {k:'game',n:'超大型タイトルの開発',d:'世界規模のヒットを狙う',p:.45,up:.7,sec:'ent'},
 {k:'res',n:'大規模鉱山の開発権取得',d:'資源を自前で押さえる',p:.5,up:.6,sec:'material'},
 {k:'fin',n:'デジタル金融プラットフォーム',d:'決済と与信を自社で握る',p:.45,up:.7,sec:'fin'}];
const Big={
  st(){if(!S.big)S.big={list:[],offer:null};return S.big;},
  monthly(){const B=this.st(),eq=Math.max(1,Co.bs().equity);
    for(const b of B.list.slice()){b.m--;if(b.m>0)continue;B.list=B.list.filter(x=>x!==b);const D=BBET.find(x=>x.k===b.k);
      const q=S.eq,ok=R()<b.p;
      if(ok){const gain=Math.round(b.amt*D.up*1.5);S.co.mfixed=(S.co.mfixed||0)+gain;S.co.retained+=gain;   /* 成果は資産として計上 */
        for(const x of S.biz)x.quality=Math.min(100,x.quality+8),x.brand=Math.min(100,x.brand+6);
        if(q.listed){q.jump+=clamp(D.up*.6,.2,.9);q.expG=(q.expG||0)+.08;}
        News.add('速報',`🚀 ${pName()}の${D.n}が成功`,`巨額投資が実を結び、企業価値が大きく跳ね上がった。`,null,1,{lv:2,imp:['株価が急騰します','技術力とブランドが大きく向上','関連事業の成長が加速します']});
        Disc.add('ME','事業',`${D.n}の成功に関するお知らせ`,{sum:`${D.n}が計画どおり成功しました。`,lv:2});chron(`${D.n}に成功`,'投資');}
      else{const loss=Math.round(b.amt*.75);S.co.mfixed=Math.max(0,(S.co.mfixed||0)-loss);S.flows.extraLoss+=loss;
        if(q.listed){q.jump-=clamp(D.up*.35,.1,.5);q.mood-=.15;}S.co.credit=Math.max(0,S.co.credit-10);
        News.add('速報',`⚠️ ${pName()}の${D.n}が失敗`,`投資額の大半${yen(loss)}円を特別損失に計上する。`,null,-1,{lv:2,imp:['株価が急落します','信用力が低下します','再挑戦には時間と資金が必要です']});
        Disc.add('ME','決算',`${D.n}に係る特別損失の計上に関するお知らせ`,{sum:`${yen(loss)}円の特別損失を計上します。`,tn:-1,lv:2});chron(`${D.n}に失敗`,'投資');}}
    if(!B.offer&&R()<.04&&S.co.cash>eq*.25&&Co.bs().equity>1e10){const D=pick(BBET);
      B.offer={k:D.k,n:D.n,d:D.d,amt:Math.round(Math.min(S.co.cash*.4,eq*.5)),p:clamp(D.p+(Exec.eff('CTO')*.12)+(S.biz.some(b=>BT[b.type].sec===D.sec)?.12:0),.15,.75),m:9+ri(0,9)};}
    if(B.offer&&B.offer.exp&&B.offer.exp<S.month)B.offer=null;},
  accept(){const B=this.st(),o=B.offer;if(!o)return '案件がありません';if(S.co.cash<o.amt)return '現金が不足しています';
    S.co.cash-=o.amt;S.flows.capex+=o.amt;S.co.mfixed=(S.co.mfixed||0)+o.amt;   /* 投資中は資産として持つ */
    B.list.push({...o,amt:o.amt});B.offer=null;
    News.add('速報',`${pName()}、${o.n}に${yen(o.amt)}円を投じる`,`成否は${o.m}ヶ月後に判明する。`,null,0,{lv:2,imp:[`成功確率の目安 ${pctp(o.p,0)}`,'成功すれば企業価値が跳ね上がります','失敗すれば投資額の大半が損失になります']});
    Disc.add('ME','事業',`${o.n}への大型投資に関するお知らせ`,{sum:`${yen(o.amt)}円を投じます。`,lv:2});chron(`${o.n}へ${yen(o.amt)}円を投資`,'投資');return null;},
  reject(){this.st().offer=null;return null;}
};

/* =====================================================================
   MODULE: Ally — ライバル企業との共同事業
   ===================================================================== */
const Ally={
  st(){if(!S.ally)S.ally={list:[],offer:null};return S.ally;},
  monthly(){const A=this.st();for(const a of A.list){a.m--;if(a.m<=0){}}A.list=A.list.filter(a=>a.m>0);
    if(A.offer&&A.offer.exp<S.month)A.offer=null;
    if(!A.offer&&R()<.05&&Co.cons().rev>5e10){const big=Market.listed().filter(c=>c.price*c.shares>Co.value()*.3&&!c.crisis);if(!big.length)return;
      const c=pick(big),kind=pick([{k:'lab',n:'共同AI研究所の設立',c:Math.round(Co.cons().rev*.03),e:'研究開発の効果が高まる'},{k:'plant',n:'海外での共同工場建設',c:Math.round(Co.cons().rev*.05),e:'原価が下がる'},{k:'tv',n:'スポーツ放映権の共同取得',c:Math.round(Co.cons().rev*.02),e:'ブランドと球団収入が伸びる'}]);
      A.offer={t:c.t,n:c.name,...kind,exp:S.month+3};
      News.add('企業',`${c.name}、${S.player.name}に${kind.n}を打診`,'共同での投資を提案している。経営会議での判断が求められる。',c.t,0,{lv:1,imp:[`必要な投資額 ${yen(kind.c)}円`,kind.e]});}},
  accept(){const A=this.st(),o=A.offer;if(!o)return '提案がありません';if(S.co.cash<o.c)return '現金が不足しています';
    S.co.cash-=o.c;S.flows.capex+=o.c;S.co.mfixed=(S.co.mfixed||0)+o.c*.6;S.flows.extraLoss+=o.c*.4;
    A.list.push({...o,m:36});A.offer=null;const c=CM[o.t];if(c){c.edge=(c.edge??0)+.01;c.jump+=.02;}
    for(const b of S.biz){if(o.k==='lab')b.quality=Math.min(100,b.quality+3);if(o.k==='plant')b.pend=(b.pend||0)-0;if(o.k==='tv')b.brand=Math.min(100,b.brand+4);}
    if(o.k==='plant')S.co.allyCost=(S.co.allyCost||0)+1;
    News.add('速報',`${S.player.name}と${o.n}、${o.n2||o.n}で提携`,`${o.n}を共同で進める。投資額 ${yen(o.c)}円。`,null,1,{lv:2});
    Disc.add('ME','再編',`${o.n}に関する業務提携のお知らせ`,{sum:`${CM[o.t]?.name||''}と共同で${o.n}を行います。`,lv:2});return null;},
  reject(){this.st().offer=null;return null;},
  mods(){const A=this.st();return{cogs:1-A.list.filter(a=>a.k==='plant').length*.03,rd:1+A.list.filter(a=>a.k==='lab').length*.15};}
};

/* =====================================================================
   MODULE: Me — プレイヤー個人（会社のお金とは完全に別勘定）
   ===================================================================== */
const LIFE=[{k:'apt',n:'賃貸マンション',c:0,up:18e4,d:'標準的な住まい'},{k:'house',n:'一戸建て',c:6000e4,up:25e4,d:'ブランド+2'},{k:'tower',n:'タワーマンション',c:2.5e8,up:60e4,d:'ブランド+5'},{k:'mansion',n:'高級邸宅',c:15e8,up:250e4,d:'ブランド+10'},
  {k:'car',n:'高級車',c:2500e4,up:15e4,d:'ブランド+3'},{k:'jet',n:'プライベートジェット',c:40e8,up:2000e4,d:'ブランド+12・海外出張が速い'},{k:'yacht',n:'クルーザー',c:12e8,up:600e4,d:'ブランド+6'},{k:'art',n:'美術品コレクション',c:8e8,up:50e4,d:'資産として値上がりする'}];
const Me={
  st(){if(!S.me)S.me={cash:5e6,age:25,role:'CEO',salary:0,hold:{},items:[],rep:50,inc:{sal:0,div:0,sell:0},exp:0,hist:[],founderSold:0};return S.me;},
  // 個人の純資産＝現金＋個人で持つ上場株＋自社の持株＋所有物
  secMV(){let v=0;const M=this.st();for(const t in M.hold){const a=asset(t);if(a)v+=a.price*M.hold[t].q;}return v;},
  ownVal(){const q=S.eq;if(!q)return 0;return q.listed?q.founder*q.price:Math.max(0,Co.value())*Eq.founderPct();},
  items(){return sum(this.st().items,k=>{const it=LIFE.find(x=>x.k===k);return it?it.c*(k==='art'?1.4:.6):0;});},
  net(){return this.st().cash+this.secMV()+this.ownVal()+this.items()+this.coVal();},
  upkeep(){return sum(this.st().items,k=>(LIFE.find(x=>x.k===k)||{up:0}).up)+30e4;},   /* 生活費 */
  brand(){const M=this.st();return sum(M.items,k=>({house:2,tower:5,mansion:10,car:3,jet:12,yacht:6,art:4})[k]||0);},
  // 会社 → 個人：役員報酬（毎月）
  setSalary(v){const M=this.st();const cap=Math.max(6e6,Co.ttm('op')*.02);if(v>cap)return `役員報酬の上限は年${yen(cap)}円です（営業利益の2%まで）`;M.salary=v;
    Disc.add('ME','その他','役員報酬の改定に関するお知らせ',{sum:`代表取締役の年間報酬を${yen(v)}円とします。`,lv:1});return null;},
  monthly(){const M=this.st(),q=S.eq;
    if(M.salary>0){const pay=M.salary/12;if(S.co.cash>pay){S.flows.sal=(S.flows.sal||0)+pay;M.cash+=pay*.55;M.inc.sal+=pay*.55;}}   /* 会社側の現金は決算の人件費として引かれる（二重に引かない） */   /* 税引後55%が手取り */
    const up=this.upkeep();M.cash-=up;M.exp+=up;
    if(M.cash<0){const sell=Math.min(this.secMV(),-M.cash);if(sell>0){for(const t in M.hold){const a=asset(t);if(!a)continue;const need=Math.ceil(sell/a.price/100)*100,q2=Math.min(M.hold[t].q,need);M.hold[t].q-=q2;M.cash+=q2*a.price;if(M.hold[t].q<=0)delete M.hold[t];break;}}}
    this.advRun();
    if(S.m===4){M.age++;if(M.age%10===0)News.add('自社',`${esc(S.player.ceo)}氏、${M.age}歳に`,M.age>=65?'後継者の育成が課題となる年齢に。':'経営者として脂が乗る時期。',null,0,{lv:1});}},
  // 配当：創業者持分は個人の収入になる
  dividend(total){const M=this.st(),q=S.eq;if(!q||!q.shares)return;const mine=total*(q.founder/q.shares)*.8;M.cash+=mine;M.inc.div+=mine;
    if(mine>0)M.hist.unshift({y:S.y,m:S.m,e:`配当 ${yen(mine)}円を受け取り`});},
  // 個人での株式売買（会社の投資とは別勘定）
  buy(t,q2){const a=asset(t),M=this.st();if(!a)return '銘柄が見つかりません';if(a.priv)return '非上場のため売買できません';
    const cost=a.price*q2*1.001;if(cost>M.cash)return `個人資金が足りません（必要 ${yen(cost)}円）`;
    M.cash-=cost;const h=M.hold[t]||(M.hold[t]={q:0,cost:0});h.q+=q2;h.cost+=cost;M.hist.unshift({y:S.y,m:S.m,e:`個人で${a.name}を${nf(q2)}株購入`});return null;},
  sell(t,q2){const a=asset(t),M=this.st(),h=M.hold[t];if(!h||q2>h.q)return '保有していません';
    const pr=a.price*q2*.999;M.cash+=pr;const cb=h.cost*q2/h.q;h.cost-=cb;h.q-=q2;if(h.q<=0)delete M.hold[t];
    M.inc.sell+=pr-cb;M.hist.unshift({y:S.y,m:S.m,e:`個人で${a.name}を${nf(q2)}株売却（損益 ${yen(pr-cb)}円）`});return null;},
  // 自社株を売って個人資産にする（持株比率は下がる）
  sellOwn(pct){const q=S.eq,M=this.st();if(!q.listed)return '上場後に売却できます';const n=Math.floor(q.founder*pct/100/100)*100;
    if(n<100||n>=q.founder)return '売却できる株数がありません';const pr=n*q.price*.97;
    q.founder-=n;M.cash+=pr*.8;M.inc.sell+=pr*.8;M.founderSold+=n;q.jump-=pct*.4;
    News.add('速報',`創業者の${esc(S.player.ceo)}氏、保有株の${pctp(pct,0)}を売却`,`売却額は約${yen(pr)}円。持株比率は${pctp(Eq.founderPct(),1)}に低下した。`,null,-1,{lv:2,imp:['創業者の売却は市場で嫌気されやすい','持株比率が下がると、解任や買収のリスクが高まる']});
    Disc.add('ME','資本政策','主要株主の異動に関するお知らせ',{sum:`代表取締役が保有株式の一部（${nf(n)}株）を売却しました。`,tn:-1,lv:2});
    M.hist.unshift({y:S.y,m:S.m,e:`自社株 ${nf(n)}株を売却（${yen(pr*.8)}円）`});return null;},
  // 個人から会社への出資（持株比率が上がる）
  invest(amt){const q=S.eq,M=this.st();if(amt>M.cash)return '個人資金が足りません';if(amt<1e6)return '100万円以上で出資できます';
    const val=Math.max(1,q.listed?q.price*q.shares:Co.value()),add=Math.round(q.shares*amt/val/100)*100||100;
    M.cash-=amt;S.co.cash+=amt;S.co.capital+=amt;q.shares+=add;q.founder+=add;
    M.hist.unshift({y:S.y,m:S.m,e:`会社へ ${yen(amt)}円を出資（${nf(add)}株）`});
    News.add('自社',`創業者、私財${yen(amt)}円を会社に出資`,'経営への強い意思として受け止められている。',null,1,{lv:1});return null;},
  // 個人で雇う投資担当（あなたの個人資金で株式を運用する）
  advCands(){const b=hs('adv'+Math.floor(S.month/6));return[0,1,2].map(i=>{const h=hs(b+':'+i),ab=45+(h>>>7)%50;
    return{name:FAM[h%FAM.length]+' '+GIV[(h>>>5)%GIV.length],ab,pol:Object.keys(EXP)[(h>>>11)%3],sal:Math.round(clamp(this.net()*.002+ab*4e4,3e6,3e8)/1e5)*1e5,
      sk:{sele:40+(h>>>3)%55,risk:35+(h>>>9)%60,macro:35+(h>>>13)%60,re:30+(h>>>17)%65}};});},
  hireAdv(i){const M=this.st(),k=this.advCands()[i];if(!k)return '候補者が見つかりません';if(M.adv)return 'すでに雇っています';
    if(M.cash<k.sal)return '個人資金が足りません';M.cash-=k.sal;M.adv={...k,since:S.month};M.advAuto=true;
    News.add('自社',`${esc(S.player.ceo)}氏、個人の資産運用に${k.name}氏を起用`,`能力${k.ab}。個人の余剰資金で株式を運用する。`,null,0,{lv:1});
    M.hist.unshift({y:S.y,m:S.m,e:`投資担当に${k.name}氏（年俸${yen(k.sal)}円）`});return null;},
  fireAdv(){const M=this.st();if(!M.adv)return '雇っていません';M.adv=null;M.advAuto=false;return null;},
  advToggle(){const M=this.st();if(!M.adv)return '投資担当がいません';M.advAuto=!M.advAuto;return null;},
  // 毎月：個人の資金で割安株を買い、割高になったら売る（能力で精度が変わる）
  advRun(){const M=this.st(),a=M.adv;if(!a||!M.advAuto)return;const sk=clamp(a.ab/100,.3,.95),log=[];
    M.cash-=a.sal/12;M.exp+=a.sal/12;
    const keep=Math.max(3e6,this.upkeep()*12);
    for(const t in M.hold){const c=asset(t);if(!c||c.fund||c.priv)continue;const h=M.hold[t],fair=Market.fair(c)/c.shares;
      if(c.price/Math.max(1,fair)>1.25+(1-sk)*.25){const q=Math.max(100,Math.floor(h.q*.6/100)*100);if(q>=100&&!this.sell(t,q))log.push(`${c.name}を${nf(q)}株売却`);}}
    const free=M.cash-keep;if(free>5e6){
      const cands=Market.listed().filter(c=>!c.crisis&&c.price*c.shares>5e9).map(c=>{const fair=Market.fair(c)/c.shares;
        return{c,sc:(fair/c.price)*(1+c.expG*.4)*(Market.ni(c)>0?1.1:.85)*(1+gauss()*(1-sk)*.4)};}).sort((x,y)=>y.sc-x.sc).slice(0,2+Math.round(sk*3));
      let bud=free*(.2+sk*.3);
      for(const{c,sc}of cands){if(bud<3e6||sc<1.05)continue;const q=Math.floor(Math.min(bud,free*.25)/(c.price*1.001)/100)*100;

/* =====================================================================
   MODULE: Syn — 事業間シナジー（資源→製造、電力→工場、物流、メディア、金融、半導体→AI）
   ===================================================================== */
const SYNDEF=[
  {id:'res',need:['mining'],to:['mfg','battery','semi','autoM','energyB'],n:'資源の内製',d:'自社の鉱山から原材料を調達',eff:{cogs:-.07,commod:-.5}},
  {id:'pow',need:['energyB'],to:['semi','battery','autoM','mfg','cloud','aiB'],n:'電力の内製',d:'自社発電で電力コストを抑制',eff:{cogs:-.05}},
  {id:'log',need:['logi'],to:'all',n:'物流の内製',d:'グループ物流で配送費を削減',eff:{other:-.06}},
  {id:'med',need:['media','ad'],to:'all',n:'広告の内製',d:'自社メディア・代理店で広告を出稿',eff:{ad:.3}},
  {id:'fin',need:['finB'],to:'all',n:'グループ金融',d:'グループ内金融で資金調達が有利に',eff:{rate:.5,credit:6}},
  {id:'chip',need:['semi'],to:['cloud','aiB','telecom','autoM'],n:'半導体の内製',d:'GPU・制御チップを自社調達',eff:{cogs:-.06,rd:.2}},
  {id:'bat',need:['battery'],to:['autoM'],n:'電池の内製',d:'車載電池を自社供給',eff:{cogs:-.08}},
  {id:'dx',need:['cloud','aiB','it'],to:'all',n:'グループDX',d:'自社IT基盤で全事業を効率化',eff:{other:-.04,rd:.15}}];
const Syn={
  // グループが持っている事業（本体・吸収合併した事業部・子会社の業種）
  have(){const H=new Set(S.biz.map(b=>b.type));
    for(const c of (S.cos||[])){const mine=c.merged||Trade.own(c.t)>.5;if(!mine)continue;
      for(const k in BT)if(BT[k].sec===c.sec)H.add(k);}
    return H;},
  active(){if(this._m===S.month&&this._a)return this._a;const H=this.have();
    this._a=SYNDEF.filter(d=>d.need.some(x=>H.has(x)));this._m=S.month;return this._a;},
  // ある事業に効いているシナジー
  mods(b){const A=this.active(),m={cogs:1,other:1,ad:1,rd:1,commod:1},L=[];
    for(const d of A){if(d.to!=='all'&&!d.to.includes(b.type))continue;const e=d.eff;
      if(e.cogs)m.cogs*=1+e.cogs;if(e.other)m.other*=1+e.other;if(e.ad)m.ad*=1+e.ad;if(e.rd)m.rd*=1+e.rd;if(e.commod!=null)m.commod*=1+e.commod;L.push(d);}
    m.list=L;return m;},
  group(){const A=this.active();return{rate:sum(A,d=>d.eff.rate||0),credit:sum(A,d=>d.eff.credit||0),list:A};}
};
