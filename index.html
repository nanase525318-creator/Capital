function jobOffers(s, n, opts) {
  opts = opts || {};
  if (!opts.legacy && playerAge(s) >= 15) { const offers = jobHuntOffers(s, Math.max(n, 3), opts.mul); if (offers.length) return offers.slice(0, Math.max(n, offers.length >= 4 ? 4 : n)); }
  const C = country(s), deg = s.education.degree, k = s.stats.knowledge, ws = s.stats.workSkill;
  const base = (EDU_BASE[deg] || EDU_BASE.none) * C.wage * (s.region.wage || 1) * priceIdx(s) * (1 + ws / 150);
  const J = s.region.jobs || 1;
  const pre = JOB_PREFIX[C.nameStyle === 'east' && s.country === 'jp' ? 'east' : 'west'];
  const types = [];
  if ((deg === 'bachelor' || deg === 'grad') && (k >= 55 || chance(s, 0.3)) && chance(s, Math.min(1, 0.55 * J))) types.push('big');
  if (k >= 50 && chance(s, 0.35 + (k - 50) / 100)) types.push('gov');
  if ((k >= 45 || deg === 'vocational') && chance(s, Math.min(1, 0.7 * J * J))) types.push('tech');
  types.push('sme'); types.push('part');
  if (types.length < n) types.push('sme');
  const out = [];
  for (const t of types.slice(0, n)) {
    const T = JOB_TYPES[t];
    const salary = Math.round(base * T.mul * rfloat(s, 0.92, 1.12) * (opts.mul || 1) / 10000) * 10000;
    out.push({ type: t, company: pick(s, pre) + pick(s, T.suffix), title: t === 'part' ? 'スタッフ' : TITLES[0], level: 0, salary, stability: T.stability, raise: T.raise });
  }
  return out;
}
function marketSalary(s, type, level) {
  if (OCC[type] && OCC[type].base) return occBaseSalary(s, type) * (1 + 0.3 * (level || 0)) * (1 + s.stats.workSkill / 160) * 1.35;
  const C = country(s), T = JOB_TYPES[type || 'sme'];
  return (EDU_BASE[s.education.degree] || EDU_BASE.none) * C.wage * (s.region.wage || 1) * priceIdx(s) * T.mul * (1 + 0.28 * (level || 0)) * (1 + s.stats.workSkill / 160) * 1.35;
}
function startJob(s, offer) {
  const prevStatus = s.career.status;
  s.career.status = 'employed';
  s.career.job = Object.assign({ startYear: s.time.year, years: 0 }, offer);
  s.career.yearsInJob = 0; s.career.benefitMonths = 0; s.career.benefit = 0;
  if (s.education.stage !== 'done') s.education.stage = 'done';
  return prevStatus;
}
function loseJob(s, reason) {
  const j = s.career.job; if (!j) return;
  s.career.lastSalary = j.salary;
  s.career.job = null; s.career.status = 'unemployed';
  if (s.country === 'jp') { s.career.benefitMonths = CONFIG.JP.unemploymentMonths; s.career.benefit = j.salary * CONFIG.JP.unemploymentRate; }
  else { s.career.benefitMonths = 4; s.career.benefit = j.salary * 0.4; }
}
function calcPension(s) {
  const c = s.career, yrs = c.contribYears, avg = yrs ? c.salarySum / yrs : 0;
  if (s.country === 'jp') { const J = CONFIG.JP; return J.pensionBasic * Math.min(40, yrs) / 40 * priceIdx(s) + J.pensionRate * avg * yrs; }
  return Math.max(0.15 * EDU_BASE.high * country(s).wage * priceIdx(s), 0.38 * avg * Math.min(yrs, 35) / 35);
}
function retire(s, early) {
  const c = s.career, j = c.job;
  let allowance = 0;
  if (j) {
    const yrs = c.yearsInJob;
    allowance = j.salary / 14 * yrs * ((JOB_TYPES[j.type] || JOB_TYPES.sme).allowance || 0);
    if (s.country === 'jp' && allowance > 0) {
      const ded = yrs <= 20 ? 400000 * Math.max(2, yrs) : 8000000 + 700000 * (yrs - 20);
      allowance -= Math.max(0, allowance - ded) / 2 * 0.2;

function mortality(s, age, health, cid) {

  if (age < 5) p += C.kidMort;
  p *= health < 20 ? 4 : health < 40 ? 2 : health > 75 ? 0.6 : 1;
  p /= (s.region && s.region.med) || 1;
  return clamp(p, 0, age >= 112 ? 1 : 0.7);
}

// ===== FIRE & achievements =====
function fireStatus(s) {
  const b = budget(s), bs = balanceSheet(s);
  const spend = b.indep ? b.totalExpense : 0;
  const C = country(s), age = playerAge(s);
  const pension = age >= C.pensionAge ? s.career.pension : 0;
  const nonMortgageDebt = s.finance.debts.filter((d) => d.type !== 'mortgage').reduce((a, d) => a + d.principal, 0);
  const spare = Math.max(0, bs.cash - spend);
  const investIncome = 0.04 * (bs.investable + spare) + pension;
  const bizIncome = playerBusinesses(s).reduce((a, x) => a + x.ownership * Math.max(0, x.last ? x.last.net : 0) * 0.5, 0) + pension;
  const ok = b.indep && age >= 18 && spend > 0 && nonMortgageDebt <= 0;
  return { spend, investIncome, bizIncome, pension, nonMortgageDebt, investFire: ok && investIncome >= spend, bizFire: ok && bizIncome >= spend, ratio: spend ? investIncome / spend : 0, bizRatio: spend ? bizIncome / spend : 0 };
}

function checkAchievements(s) {

EV.uni_choice = { title: '高校卒業後の進路', cat: 'school', blocking: true, important: true, random: false,

  build: (s, c) => {
    const k = s.stats.knowledge, C = country(s), w = s.family.wealth;
    const nat = 540000 * C.cost * priceIdx(s), pri = 1200000 * C.cost * priceIdx(s) * (s.country === 'us' ? 2.5 : 1), voc = 1100000 * C.cost * priceIdx(s);
    const F = s.family, canPay = Math.max(0, F.savings + F.securities * 0.5 - (F.income * 0.15));
    const shareFor = (cost, yrs) => clamp(canPay / Math.max(1, cost * yrs), 0, 1) * (w >= 1 ? 1 : 0.5);
    const grant = s.flags.grant ? 0.5 : 0;
    const natOk = k >= 62 || (k >= 52 && c.pass < (k - 45) / 25);
    const loanNote = (cost, yrs) => { const ps = shareFor(cost, yrs); const l = cost * yrs * (1 - ps) * (1 - grant); return l > 0 ? `貸与型奨学金 ${yen(l)}${grant ? '（給付型で半額）' : ''}` : ps > 0 ? '学費は親が負担' : '給付型奨学金でまかなう'; };

      s.education = { stage, school, degree: 'high', target: degree, gradYear: s.time.year + yrs, track: s.education.track }; s.career.status = 'student';
      const parentShare = shareFor(cost, yrs);

      const loan = cost * yrs * (1 - parentShare) * (1 - grant);

    };

<script>// ===== candlestick chart renderer (drawing only; all prices come from the engine) =====

        for (const tv of niceTicks(lo, hi, 4)) { const y = Math.round(yOf(tv)) + 0.5; g.strokeStyle = COL.grid; g.beginPath(); g.moveTo(padL, y); g.lineTo(padL + plotW, y); g.stroke(); if (Math.abs(y - tagY) > 13) { g.fillStyle = COL.axis; g.fillText(fmtPrice(tv, cur), padL + plotW + 5, y); } }
        if (I.bb) {

        }

          g.strokeStyle = col; g.lineWidth = 1; g.beginPath(); g.moveTo(Math.round(x) + 0.5, yOf(b.h)); g.lineTo(Math.round(x) + 0.5, yOf(b.l)); g.stroke();
          const yTop = yOf(Math.max(b.o, b.c)), yBot = yOf(Math.min(b.o, b.c)), hh = Math.max(1, yBot - yTop);
          g.fillStyle = col; g.fillRect(Math.round(x - bw / 2), Math.round(yTop), Math.max(1, Math.round(bw)), Math.max(1, Math.round(hh)));
        }
        if (I.ma5) { line(g, I.ma5, xOf, yOf, COL.ma5); line(g, I.ma25, xOf, yOf, COL.ma25); line(g, I.ma75, xOf, yOf, COL.ma75); }
        // event markers (決算・ニュース) on the matching bar
        if (events && events.length && !model.intraday) {
          const keyOf = (t) => (unit === '月足' ? Math.floor(t / 100) : t);
          for (const e of events) {
            let idx = -1;
            if (unit === '週足') idx = bars.findIndex((b, i) => e.t >= b.t && (i === n - 1 || e.t < bars[i + 1].t));
            else idx = bars.findIndex((b) => b.t === keyOf(e.t));
            if (idx < 0) continue;
            const x = xOf(idx), y = p.y + p.h - 7;
            g.fillStyle = e.tone === 'good' ? COL.up : e.tone === 'bad' ? COL.down : COL.axis;
            g.beginPath(); g.moveTo(x, y - 5); g.lineTo(x - 4, y + 2); g.lineTo(x + 4, y + 2); g.closePath(); g.fill();
          }
        }
        // last price tag
        const last = bars[n - 1], ly = yOf(last.c);
        g.fillStyle = last.c >= last.o ? COL.up : COL.down; g.fillRect(padL + plotW + 1, ly - 8, padR - 2, 16);
        g.fillStyle = '#fff'; g.fillText(fmtPrice(last.c, cur), padL + plotW + 5, ly);
      } else if (p.k === 'vol') {
        let mx = 0; for (const b of bars) if (b.v != null) mx = Math.max(mx, b.v);
        for (let i = 0; i < n; i++) { const b = bars[i]; if (b.v == null) continue; const h = (b.v / (mx || 1)) * (p.h - 4); g.fillStyle = b.c >= b.o ? 'rgba(255,91,107,0.55)' : 'rgba(76,141,255,0.55)'; g.fillRect(Math.round(xOf(i) - bw / 2), p.y + p.h - h, Math.max(1, Math.round(bw)), h); }
        g.fillStyle = COL.axis; g.textAlign = 'left'; g.fillText(fmtVol(mx), padL + plotW + 5, p.y + 6); label(g, '出来高', padL + 4, p.y + 8);
      } else if (p.k === 'rsi') {
        const yOf = (v) => p.y + p.h - (v / 100) * p.h;
        for (const lv of [30, 70]) { g.strokeStyle = COL.grid; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(padL, yOf(lv)); g.lineTo(padL + plotW, yOf(lv)); g.stroke(); g.setLineDash([]); g.fillStyle = COL.axis; g.textAlign = 'left'; g.fillText(String(lv), padL + plotW + 5, yOf(lv)); }
        line(g, I.rsi, xOf, yOf, COL.rsi); label(g, 'RSI(14)', padL + 4, p.y + 8);
        if (!I.rsi.some((v) => v != null)) noData(g, padL + plotW / 2, p.y + p.h / 2);
      } else if (p.k === 'macd') {
        const M = I.macd; let lo = 0, hi = 0;
        for (const arr of [M.macd, M.signal, M.hist]) for (const v of arr) if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
        const yOf = (v) => p.y + p.h - ((v - lo) / ((hi - lo) || 1)) * p.h;
        g.strokeStyle = COL.grid; g.beginPath(); g.moveTo(padL, yOf(0)); g.lineTo(padL + plotW, yOf(0)); g.stroke();
        for (let i = 0; i < n; i++) { const v = M.hist[i]; if (v == null) continue; g.fillStyle = v >= 0 ? 'rgba(255,91,107,0.5)' : 'rgba(76,141,255,0.5)'; const y0 = yOf(0), y1 = yOf(v); g.fillRect(Math.round(xOf(i) - bw / 2), Math.min(y0, y1), Math.max(1, Math.round(bw)), Math.max(1, Math.abs(y1 - y0))); }
        line(g, M.macd, xOf, yOf, COL.macd); line(g, M.signal, xOf, yOf, COL.sig); label(g, 'MACD(12,26,9)', padL + 4, p.y + 8);
        if (!M.macd.some((v) => v != null)) noData(g, padL + plotW / 2, p.y + p.h / 2);
      }
    }
    // x axis labels
    const main = L.panes[0], ticks = Math.min(4, n);
    g.fillStyle = COL.axis; g.textAlign = 'center';
    let lastLabel = '';
    for (let k = 0; k < ticks; k++) { const i = Math.round((n - 1) * (ticks === 1 ? 1 : k / (ticks - 1))); const s = dateLabel(bars[i], unit); if (s === lastLabel) continue; lastLabel = s; const x = Math.min(padL + plotW - 22, Math.max(padL + 22, xOf(i))); g.fillText(s, x, main.y + main.h + 9); }
    // crosshair
    if (hover != null && hover >= 0 && hover < n) {
      const x = Math.round(xOf(hover)) + 0.5;
      g.strokeStyle = COL.cross; g.setLineDash([4, 3]); g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, main.y); g.lineTo(x, L.height - 4); g.stroke();
      const yy = main.yOf(bars[hover].c); g.beginPath(); g.moveTo(padL, yy); g.lineTo(padL + plotW, yy); g.stroke(); g.setLineDash([]);

  }
  function line(g, arr, xOf, yOf, col, dash) {

    arr.forEach((v, i) => { if (v == null) { on = false; return; } const x = xOf(i), y = yOf(v); if (!on) { g.moveTo(x, y); on = true; } else g.lineTo(x, y); });
    g.stroke(); g.setLineDash([]);

  // mounts a chart and wires touch/mouse crosshair. onHover(index|null) lets the page update its readout.
  function mount(canvas, model, onHover) {
    let geo = draw(canvas, model);
    const idxAt = (ev) => { const r = canvas.getBoundingClientRect(); const x = ev.clientX - r.left; if (!geo.n) return null; const i = Math.floor((x - geo.padL) / geo.slot); return Math.max(0, Math.min(geo.n - 1, i)); };

    canvas.addEventListener('pointerdown', (e) => set(idxAt(e)));
    canvas.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) set(idxAt(e)); });
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') set(null); });

<script>// ===== LIFE CAPITAL : UI layer (DOM only; all game rules live in LC) =====
(function () {

  const Y = LC.yen;
  const YP = (n) => (Math.abs(n) < 1e6 ? Math.round(n).toLocaleString('ja-JP') + '円' : LC.yen(n));
  const SLOT = 'lifecapital.v1.slot.';
  let S = null, lastRev = -1, lastMoodId = null, lastYear = null, lastFrame = 0;
  const ui = { mode: 'main', form: null, prevS: null, lookOpen: false, sheet: null, tab: null, asset: null, buyType: null, logAll: false, logImp: false, open: {}, statsMore: false, wasPlaying: false, confirm: null, msg: null, newOpts: { country: '', name: '' } };

  // ---------- storage (best-effort; the game runs without it)
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function saveTo(slot) { S.savedAt = Date.now(); const ok = store(SLOT + slot, LC.serialize(S)); return ok; }
  function loadFrom(slot) { const raw = load(SLOT + slot); if (!raw) return false; try { S = LC.deserialize(raw); resetView(); return true; } catch (e) { toast('セーブデータを読み込めませんでした。', true); return false; } }
  function resetView() { lastRev = -1; lastYear = S.time.year; lastMoodId = S.lastMood ? S.lastMood.id : null; closeSheet(true); renderEvent(); }

  // ---------- boot
  function start(data) {
    if (data && data.state) { try { S = LC.deserialize(data.state); if (data.playing) S.time.playing = true; } catch (e) { S = null; } }
    if (!S && load(SLOT + 'auto')) { try { S = LC.deserialize(load(SLOT + 'auto')); } catch (e) { S = null; } }
    Scene.mount($('#scene'));
    Scene.onPick((h) => { const tip = $('#sceneTip'); if (!tip || ui.mode !== 'main') return; tip.textContent = h.label; tip.style.left = (h.x * 100) + '%'; tip.style.top = (h.y * 100) + '%'; tip.hidden = false; clearTimeout(tip._t); tip._t = setTimeout(() => { tip.hidden = true; }, 2200); });
    buildSpeeds();
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onSetupInput);
    if (S) { lastYear = S.time.year; lastMoodId = S.lastMood ? S.lastMood.id : null; setMode('main'); } else openSetup(false);

  }
  function loop(now) {

    lastFrame = now;

    if (!ui.sheet) LC.tick(S, dt);
    if (S.time.year !== lastYear) { lastYear = S.time.year; saveTo('auto'); }
    Scene.frame(S, now);
    updateClock();
    if (S.rev !== lastRev) { lastRev = S.rev; renderAll(); }
    if (S.lastMood && S.lastMood.id !== lastMoodId) { lastMoodId = S.lastMood.id; if (S.lastMood.tone !== 'neutral') Scene.mood(S.lastMood.tone); }
    requestAnimationFrame(loop);
  }

  // ---------- A: clock
  const PLAY = '<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z"/></svg>', PAUSE = '<svg viewBox="0 0 14 14"><path d="M2.5 1.5h3.2v11H2.5zm5.8 0h3.2v11H8.3z"/></svg>';
  function buildSpeeds() { $('#speeds').innerHTML = LC.CONFIG.SPEEDS.map((v) => `<button data-act="speed" data-v="${v}" aria-pressed="false">${v}×</button>`).join(''); }
  let clockCache = {};
  function updateClock() {
    const T = S.time, age = LC.playerAge(S);
    const p = Math.min(1, T.progress);
    const held = !!S.events.active;
    const cal = LC.calendar(S);
    const vals = { age, year: `${cal.y}年${cal.m}月`, name: LC.P(S).name, speed: `1年 ≈ ${trim(LC.secondsPerYear(T.baseSeconds, T.speed))}秒`, playing: T.playing, sp: T.speed, held: !!held };
    if (clockCache.age !== vals.age) $('#ageNum').textContent = age;
    if (clockCache.year !== vals.year) $('#metaYear').textContent = vals.year;
    if (clockCache.name !== vals.name) $('#metaName').textContent = vals.name;
    if (clockCache.speed !== vals.speed) $('#metaSpeed').textContent = vals.speed;

    if (clockCache.sp !== vals.sp) document.querySelectorAll('#speeds button').forEach((b) => { const on = +b.dataset.v === T.speed; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    clockCache = vals;
  }
  const trim = (v) => (Math.round(v * 10) / 10).toString();

  // ---------- main render
  function renderAll() {

    if (ui.sheet && !ui.typing) renderSheet();
  }
  function renderScene() {
    const C = LC.country(S), R = S.residence;
    const hh = LC.household(S);
    const others = hh.filter((c) => c.relation !== 'self');
    const who = others.length ? summarizeHousehold(others) + 'と一緒に' : 'ひとりで';
    $('#sceneCap').textContent = `${C.name}・${S.region.name} · ${R.label} · ${who}`;
    const parts = hh.map((c) => `${c.relation === 'self' ? 'わたし' : LC.relLabel(S, c)} ${LC.ageOfChar(S, c)}歳`);
    const pets = LC.visiblePets(S).map((p) => `${LC.PETS[p.kind].label}の${p.name}`);
    const cars = S.vehicles.map((v) => v.label);
    $('#sceneSub').textContent = parts.concat(pets, cars).join(' · ');
    const rm = LC.roomModel(S), tg = $('#viewToggle');
    const visitors = rm.people.filter((p) => p.visiting);
    if (visitors.length) $('#sceneSub').textContent += ` · 遊びに来ている孫 ${visitors.map((p) => p.age + '歳').join('・')}`;
    if (rm.office) { tg.hidden = false; const v = Scene.getView(); tg.textContent = v === 'office' ? '自宅を見る' : 'オフィスを見る'; tg.setAttribute('aria-pressed', v === 'office'); }
    else { tg.hidden = true; if (Scene.getView() === 'office') Scene.setView('home'); }
    if (Scene.getView() === 'office' && rm.office) $('#sceneCap').textContent = `${rm.office.name}のオフィス · 社員${rm.office.employees}人${rm.office.listed ? ' · 上場企業' : ''}`;
    const st = rm.stored; $('#sceneStore').textContent = st > 0 ? `置ききれない家具 ${st}点は倉庫にあります` : '';
  }
  function summarizeHousehold(list) {
    const cnt = {};
    for (const c of list) { const k = { father: '両親', mother: '両親', sibling: 'きょうだい', grandparent: '祖母', spouse: '配偶者', child: '子ども' }[c.relation] || '家族'; cnt[k] = (cnt[k] || 0) + 1; }
    return Object.keys(cnt).map((k) => (k === '両親' ? (cnt[k] === 2 ? '両親' : '親') : k === 'きょうだい' || k === '子ども' ? `${k}${cnt[k]}人` : k)).join('・');
  }
  function renderLife() {
    const age = LC.playerAge(S), C = LC.country(S), indep = LC.isIndependent(S);
    const fam = S.order.map((id) => S.characters[id]).filter((c) => c.relation !== 'self' && c.relation !== 'grandchild' || (c.relation === 'grandchild' && c.alive))
      .map((c) => `<span class="${c.alive ? '' : 'gone'}">${esc(LC.relLabel(S, c))} ${c.alive ? LC.ageOfChar(S, c) + '歳' : ''}</span>`).join('');

    const avail = LC.availableFocus(S);
    let focus;
    if (S.over) focus = '<p>人生を終えました。</p>';
    else if (!avail.length) focus = `<p>まだ${LC.STAGE_LABEL[LC.stageOf(age)]}です。親に育てられています。幼いころの出来事が積み重なって5歳ごろに気質が見え、6歳からはその年の重点を選べます。この時期は8×で進めても大丈夫です。</p>`;
    else {
      focus = `<div class="seg">${avail.map((k) => { const on = S.focus.includes(k); const dis = !on && S.focus.length >= LC.CONFIG.MAX_FOCUS; return `<button class="chip-btn ${on ? 'on' : ''}" data-act="focus" data-v="${k}" ${dis ? 'disabled' : ''} aria-pressed="${on}">${LC.FOCUS[k].label}</button>`; }).join('')}</div>
        <p>${S.focus.length === 2 ? '2つ選ぶと時間を分け合うため、それぞれの効果は6割になります。' : S.focus.length ? '1つに絞ると効果は最大です。もう1つ選ぶと時間を分け合います。' : '重点を選ぶと、その年の成長や収入が変わります。'}${focusEffectText()}</p>`;
    }

      <div class="card-head"><h3>いまの人生</h3><span class="hint">${esc(LC.STAGE_LABEL[LC.stageOf(age)])}${S.temper ? ' · ' + esc(S.temper) + '性格' : ''}</span></div>
      <dl class="rows">
        <div class="row"><dt>住まい</dt><dd>${esc(C.name)}・${esc(S.region.name)}<br><span class="hint">${esc(S.residence.label)}${S.residence.own ? '（持ち家）' : S.residence.rent ? `（家賃 月${Y(S.residence.rent)}）` : ''}</span></dd></div>

  const STAT_COL = { health: 'var(--health)', happiness: 'var(--happy)', knowledge: 'var(--know)', relations: 'var(--rel)' };
  function renderStats() {

    const main = ['health', 'happiness', 'knowledge', 'relations'].map((k) => `<div class="stat"><div class="lbl">${LC.STAT_LABELS[k]}</div><div class="val">${Math.round(st[k])}${d(k)}</div><div class="meter"><i style="width:${st[k]}%;background:${STAT_COL[k]}"></i></div></div>`).join('');
    const more = ['finLit', 'workSkill', 'stress', 'credit'].map((k) => `<div class="mini"><span>${LC.STAT_LABELS[k]}</span><span class="num">${Math.round(st[k])}</span><div class="meter"><i style="width:${st[k]}%;background:${k === 'stress' ? 'var(--bad)' : 'var(--blue)'}"></i></div></div>`).join('');
    $('#secStats').innerHTML = `<div class="card-head"><h3>状態</h3><span class="hint">0〜100 · 数字の横は前年比</span></div><div class="stat4">${main}</div>
      ${ui.statsMore ? `<div class="more-stats">${more}</div>` : ''}<button class="toggle-link" data-act="statsMore">${ui.statsMore ? '詳細を閉じる ▲' : '詳細ステータス（金融リテラシー・仕事の能力・ストレス・信用力） ▼'}</button>`;

  // ---------- sheets

      const pets = S.pets.filter((p) => p.alive && p.owner !== 'left');

        <label>迎え方<select id="pfMethod" data-act="petForm"><option value="shelter" ${f.method === 'shelter' ? 'selected' : ''}>保護施設から</option><option value="buy" ${f.method === 'buy' ? 'selected' : ''}>ペットショップで購入</option><option value="gift" ${f.method === 'gift' ? 'selected' : ''}>知人から譲り受ける</option></select></label></div>

  // ---------- input handling

    const struct = { couple: sibs.length ? 'きょうだいのいる家庭' : 'ひとりっ子', single: 'ひとり親家庭', threegen: '祖父母と同居する家庭' }[F.structure];
    const dots = LC.TIERS.map((t, i) => `<i class="${i <= F.birthTier ? 'on' : ''}"></i>`).join('');
    const life = ['切り詰めた暮らし', '質素な暮らし', '標準的な暮らし', 'ゆとりのある暮らし', 'ぜいたくな暮らし'][F.birthTier];
    const row = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
    $('#intro').innerHTML = `<div class="pre-in">
      <p class="eyebrow">あなたの人生が始まります</p>
      <div class="scene-card intro-scene" id="introScene"></div>
      <div class="card"><h3 class="intro-name">${esc(me.name)}</h3><p class="intro-story">${esc(S.birth.narrative)}</p>
        <div class="tier-line"><span class="dots">${dots}</span><span>${LC.TIERS[F.birthTier].label}（5段階中${F.birthTier + 1}）</span></div>
        <p class="hint">${esc(LC.TIERS[F.birthTier].desc)}</p>
        <dl class="facts">
          ${row('性別', LC.GENDER_LABEL[me.gender])}${row('出生年月', `${S.birth.year}年${S.birth.month}月`)}
          ${row('出生地', esc(C.name === '日本' ? R.pref : C.name + '・' + R.name))}${row('地域', `${esc(R.area)}${R.ind && R.ind !== '—' ? '・' + esc(R.ind) : ''}`)}
          ${row('家族構成', `${struct}${sibs.length ? `（きょうだい${sibs.length}人）` : ''}${gp.length ? `・祖父母${gp.length}人` : ''}`)}${row('実家', esc(F.home.label))}
          ${row('生活水準', life)}${row('世帯年収', Y(fb.parentsIncome + (gp.reduce((a, c) => a + (c.income || 0), 0))))}
        </dl>
      </div>
      <div class="card"><h3>両親</h3><div class="list">${ps.map((p) => `<div class="opt"><span class="name">${LC.relLabel(S, p)}・${LC.ageOfChar(S, p)}歳</span><span class="sub">${esc(p.job)} · ${esc(p.emp || '—')} · ${esc(p.edu || '')} · 年収 ${Y(p.income)}</span></div>`).join('')}
        ${sibs.map((c) => `<div class="opt"><span class="name">${LC.relLabel(S, c)}・${LC.ageOfChar(S, c)}歳</span><span class="sub">きょうだい</span></div>`).join('')}
        ${gp.map((c) => `<div class="opt"><span class="name">${c.gender === 'f' ? '祖母' : '祖父'}・${LC.ageOfChar(S, c)}歳</span><span class="sub">年金 年${Y(c.income || 0)}</span></div>`).join('')}</div></div>
      <div class="card"><h3>実家の家計</h3><p class="hint">これは家族のお金です。あなた自身のお金は0円から始まり、親の資産が自動で足されることはありません。</p>
        ${kv([['世帯年収（手当を除く）', Y(fb.parentsIncome)], fb.childAllow && ['児童手当など', '年' + Y(fb.childAllow)], fb.welfare && ['公的支援（生活支援など）', '年' + Y(fb.welfare)], F.support && ['その他の給付', '年' + Y(F.support)],
          ['預貯金', Y(F.savings)], ['有価証券', Y(F.securities)], ['不動産', Y(F.realEstate)], F.business && ['事業資産', Y(F.business)], ['住宅ローン', F.mortgage ? '−' + Y(F.mortgage) : 'なし'], ['その他の負債', F.otherDebt ? '−' + Y(F.otherDebt) : 'なし'], ['家族の純資産', Y(LC.familyNet(S)), 'sum'],
          ['毎月の生活費', Y(fb.living)], ['毎月の住宅費', Y(fb.housing)], ['年間の教育費', Y(fb.edu)], ['毎月の保険料', Y(fb.insurance)], ['年間の貯蓄額', `<span class="${fb.annualSaving >= 0 ? 'up' : 'down'}">${LC.signedYen(fb.annualSaving)}</span>`], ['緊急予備資金', `${Math.max(0, fb.emergencyMonths).toFixed(1)}か月分`]])}</div>
      <div class="card"><h3>教育環境</h3>${kv([['保育', esc(F.edu.preschool)], ['学校へのアクセス', esc(F.edu.access)], ['学習環境', F.edu.studyEnv + ' / 100'], ['習い事', F.edu.lessons.length ? esc(F.edu.lessons.join('・')) + `（${F.edu.lessonsStartAge}歳ごろから）` : 'なし'], ['家庭の方針', esc(F.policy)], ['家での学習支援', esc(F.edu.help)], ['進学資金の見込み', Y(F.edu.fund)]])}</div>
      ${S.country === 'jp' ? `<div class="card"><h3>${esc(R.pref)}・${esc(R.area)}の特徴</h3>${kv([['物価・家賃', '全国平均の×' + R.cost.toFixed(2)], ['給与水準', '×' + R.wage.toFixed(2)], ['求人の多さ', '×' + R.jobs.toFixed(2)], ['教育環境', '×' + R.edu.toFixed(2)], ['医療へのアクセス', '×' + R.med.toFixed(2)], ['起業の機会', '×' + R.biz.toFixed(2)], ['通勤費（年・自己負担）', Y(R.commute)]])}<p class="hint" style="margin-top:6px">地域の数字はゲーム用の目安です。家庭の豊かさとは別に決まります。</p></div>` : ''}
      <p class="hint">シード ${S.seed}${S.mode === 'choose' ? ' · 家庭を選ぶモード' : ''}</p>
      </div>
      <div class="pre-bar two-btn"><button class="btn" data-act="redo">作り直す</button><button class="btn primary big" data-act="beginLife">この人生を始める</button></div>`;
    $('#introScene').appendChild($('#scene')); requestAnimationFrame(() => Scene.resize());
  }
  function beginLife() {
    ui.prevS = null; ui.form = null;
    setMode('main');
    resetView(); lastYear = S.time.year;
    S.time.playing = true; LC.bump(S);
    saveTo('auto');
  }
  function onSetupInput(e) {
    const el = e.target; if (!el.dataset || !el.dataset.f || !ui.form) return;
    ui.form[el.dataset.f] = el.value;
    if (ui.form.err && ui.form.err[el.dataset.f]) { delete ui.form.err[el.dataset.f]; el.setAttribute('aria-invalid', 'false'); const m = el.parentNode.querySelector('.msg'); if (m) m.remove(); }
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.sheet) closeSheet(); if (e.key === ' ' && !ui.sheet && e.target === document.body) { e.preventDefault(); LC.togglePlay(S); } });
  document.addEventListener('focusin', (e) => { if (e.target.matches && e.target.matches('.sheet input[type=text], .sheet input[type=number]')) ui.typing = true; });
  document.addEventListener('focusout', () => { ui.typing = false; });
  const H = window.claude && window.claude.hot;
  if (H && H.ready) H.ready(start); else start((H && H.data) || {});
})();
</script>
</body>
</html>
